con intereses. Quítenle, pues, el talento y dénselo al que tiene los diez talentos. Porque a todo el que tiene, se le dará más, y tendrá en abundancia. Pero al que no tiene, hasta lo que tiene se le quitará. Y al siervo inútil échenlo en las tinieblas de afuera. Allí habrá llanto y rechinar de dientes’.”"], ["h", "Trabajar con gozo"], ["p", "Los dos primeros siervos actuaron porque realmente conocían el carácter de su amo y su capacidad de invitarlos a su gozo. Entendían el poder que tenía el amo, pero también comprendían profundamente su naturaleza de amor y justicia. Este conocimiento les dio la confianza para negociar y multiplicar sus talentos, viendo su trabajo como una sociedad en el reino de su amo."], ["h", "La parálisis del concepto equivocado"], ["p", "El tercer siervo malinterpretó por completo las acciones de su amo, viéndolo solo como un hombre duro y exigente. Este malentendido lo llevó a actuar por temor en lugar de por el deseo de agradar. Como no logró ver el corazón del amo, su potencial para administrar fue reemplazado por un impulso de protegerse y esconder lo que se le había dado."], ["h", "El fruto de la sabiduría y el conocimiento"], ["p", "La Escritura enseña que el temor del Señor es el principio tanto de la sabiduría como del conocimiento; los dos primeros siervos actuaron según este conocimiento verdadero, y su mayordomía se basó en la confianza. El tercer siervo carecía de esta sabiduría y actuó por temor, lo que condujo a la parálisis y al miedo. Nuestras acciones son siempre el fruto de lo que creemos: si conocemos a Dios, nos mueve el amor; si no lo conocemos, nos mueve el miedo."], ["img", "chart.png"], ["h", "Parte 2: Rendir cuentas"], ["h", "2 Corintios 5:9–11 (ESV, traducción libre)"], ["p", "“Por eso, ya sea que estemos en casa o ausentes, nos proponemos agradarle. Porque todos debemos comparecer ante el tribunal de Cristo, para que cada uno reciba lo que le corresponde por lo que haya hecho en el cuerpo, sea bueno o malo. Por tanto, conociendo el temor del Señor, persuadimos a los demás.”"], ["h", "Nuestra cita divina"], ["p", "A lo largo de la Biblia se nos recuerda que toda vida humana avanza hacia un único momento seguro: una cita divina para presentarnos ante nuestro Creador. La Escritura lo deja claro en muchos lugares. Desde las enseñanzas de Jesús en los Evangelios hasta las cartas de los apóstoles, vemos que un día daremos cuenta de cómo vivimos la vida que se nos dio. Esta realidad no es motivo de temor, sino una brújula diaria para nuestro corazón. Vivimos conscientes de que un día estaremos delante de Aquel que nos dio el aliento de vida, nos confió talentos únicos y nos amó tanto que entregó a su Hijo para asegurar nuestra eternidad."], ["p", "Además de nuestro pasaje clave, vemos en Romanos 14:10, 12: \"...Porque todos compareceremos ante el tribunal de Dios... De manera que cada uno de nosotros dará cuenta de sí mismo a Dios.\" Hebreos 9:27 nos recuerda que este juicio es una cita fija que sigue a nuestro tiempo en la tierra: \"Y así como está establecido que el hombre muera una sola vez, y después de eso viene el juicio...\" Incluso nuestras palabras son importantes, como advierte Mateo 12:36: \"Les digo que en el día del juicio la gente dará cuenta de toda palabra descuidada que hable...\""], ["h", "Parte 3: Persuadir a otros"], ["h", "2 Corintios 5:9–11 (ESV, traducción libre)"], ["p", "“Por eso, ya sea que estemos en casa o ausentes, nos proponemos agradarle. Porque todos debemos comparecer ante el tribunal de Cristo, para que cada uno reciba lo que le corresponde por lo que haya hecho en el cuerpo, sea bueno o malo. Por tanto, conociendo el temor del Señor, persuadimos a los demás.”"], ["h", "Entender el temor de Dios"], ["li", "Proverbios 1:7 – \"El temor del Señor es el principio del conocimiento; los necios desprecian la sabiduría y la instrucción.\""], ["li", "El verdadero entendimiento comienza cuando reconocemos la autoridad de Dios sobre nuestra vida en lugar de depender de nuestra propia perspectiva limitada."], ["li", "Salmo 111:10 – \"El temor del Señor es el principio de la sabiduría; todos los que lo practican tienen buen entendimiento. ¡Su alabanza permanece para siempre!\""], ["li", "La sabiduría se encuentra en la práctica activa de honrar a Dios, lo que conduce a una vida de claridad y de alabanza duradera."], ["li", "Proverbios 8:13 – “El temor del Señor es aborrecer el mal. Aborrezco el orgullo y la arrogancia, el camino del mal y el habla perversa.”"], ["li", "Un corazón que realmente reverencia a Dios se encontrará naturalmente en oposición al orgullo, a la arrogancia y a todo lo que contradice su carácter."], ["h", "Impulsados por el amor a amar"], ["p", "El amor de Dios nos impulsa a amar a los demás. Sin embargo, un santo temor, que es reverencia por el poder de Dios, nos lleva a vivir en obediencia y en misión. Respetar su autoridad significa aplicar su verdad para su gloria."], ["h", "Esta reverencia aclara su carácter:"], ["li", "La promesa del amor: su poder está alineado con su corazón. Descansamos en su amor inquebrantable."], ["li", "La seguridad de la provisión: su poder garantiza que suplirá nuestras necesidades diarias."], ["p", "Caminar en reverencia invita a otros a esta vida segura."], ["h", "El fruto del santo temor"], ["p", "El temor de Dios inicia nuestro camino hacia la sabiduría, pero en última instancia el amor nos impulsa a amar a los demás. En la parábola de los talentos, los siervos sabían que el dueño volvería. En dos de ellos, esta reverencia sana despertó una mayordomía fiel, mientras que el tercero quedó paralizado por un concepto equivocado. Dios nos confía con ternura dones y recursos para compartir con nuestra comunidad. El santo temor no es miedo a la muerte, sino una motivación tierna para caminar en obediencia hacia una vida en Cristo. Cuando el amor nos impulsa a cuidar de los demás, nuestra responsabilidad se convierte en un testimonio convincente. El verdadero fruto de la reverencia es sencillamente multiplicar sus bendiciones para poder amar al mundo que nos rodea."]], "q": [["¿Cuáles son las tres ideas clave de 2 Corintios 5:9–11?", "Mira “Ideas clave” debajo del pasaje.", 6], ["Describe la acción y la recompensa de cada uno de los tres siervos en la parábola de los talentos.", "Mira la sección de Mateo 25.", 17], ["¿Qué significa que un día daremos cuenta de la vida que vivimos?", "Mira “Nuestra cita divina”.", 32], ["Escribe tu mejor definición del temor del Señor.", "Mira “Entender el temor de Dios”.", 38], ["¿Cómo debemos prepararnos para nuestra cita con Dios?", "Mira “Parte 1: Agradar a Dios”.", 13]]}, {"id": "s2", "k": "Sección 2", "t": "Establecer el ritmo: Palabra, oración y adoración", "b": [["h", "Resumen de la sección:"], ["h", "1) Palabra diaria: involucrar nuestra mente y nuestro corazón"], ["h", "2) Oración diaria: escuchar a Dios"], ["h", "3) Adoración diaria: el amor en acción"], ["h", "Dar prioridad al tiempo diario con Dios"], ["p", "El tiempo diario de quietud personal con Dios es el hábito esencial que nos permite permanecer en Cristo. Establecer un ritmo diario de Palabra, oración y adoración sincroniza nuestra vida con el latido del corazón de Dios. El cambio es inevitable; permanecer en Cristo asegura que el catalizador de ese cambio provenga de nuestra relación con Dios y no de nuestra cercanía con el mundo. Dedicar tiempo a Dios es orar “Aquí estoy” y ponernos a disposición para actuar según su respuesta."], ["p", "Al establecer un ritmo constante de involucrarnos en la Palabra, la oración y la adoración, creamos el espacio necesario para que Dios transforme nuestro corazón y dirija nuestros pasos. Este ritmo diario es mucho más que una disciplina espiritual; es nuestro amor por Dios en acción. Es el latido vital de la intimidad con el Padre. Sin este ritmo, nos falta una relación funcional con Dios, y sin esa relación, seguimos perdidos en el mundo, a la deriva fuera de su amor, su autoridad y su dirección."], ["h", "1) Palabra diaria: involucrar nuestra mente y nuestro corazón"], ["p", "La Biblia confronta nuestra mente con la verdad inmutable que desafía nuestro corazón egoísta. La Escritura es útil para enseñar, para reprender, para corregir y para instruir en justicia. El tiempo dedicado a leer la Palabra de Dios es un encuentro santo con Él."], ["h", "La autoridad de Dios"], ["p", "2 Timoteo 3:16: \"Toda la Escritura es inspirada por Dios y útil para enseñar, para reprender, para corregir y para instruir en justicia.\""], ["p", "La Escritura es literalmente el aliento de Dios. Por haber sido exhalada por el Padre, lleva el peso de su autoridad. Al leerla, nos ponemos a disposición de Aquel que infunde vida en nuestra alma. Este aliento es provechoso: nos enseña la verdad y corrige nuestra deriva, asegurando que estemos entrenados y listos para las tareas que Él tiene para nosotros."], ["h", "La dirección de Dios"], ["p", "Salmo 119:105: \"Lámpara es a mis pies tu palabra y luz para mi camino.\""], ["p", "La Palabra es nuestra lámpara. Nos da la claridad inmediata que necesitamos para el siguiente paso y, al mismo tiempo, ilumina la visión a largo plazo de nuestro recorrido por los cuatro fundamentos. Sin esta luz caminamos en la oscuridad, pero con ella tenemos la dirección que necesitamos para mantenernos en el blanco. Asegura que, cuando decimos “Aquí estoy”, realmente podamos ver hacia dónde nos guía el Padre."], ["h", "El discernimiento de Dios"], ["p", "Hebreos 4:12 “Porque la palabra de Dios es viva y eficaz, más cortante que cualquier espada de dos filos, y penetra hasta partir el alma y el espíritu, las coyunturas y los tuétanos, y discierne los pensamientos y las intenciones del corazón.”"], ["p", "La Escritura es un arma viva de dos filos que atraviesa el engaño del enemigo y la confusión del mundo, trayendo claridad, convicción y propósito. Como describe Hebreos 4:12, la Palabra de Dios es lo bastante afilada para penetrar hasta partir el alma y el espíritu, y llegar a los pensamientos y las intenciones del corazón."], ["p", "Cuando damos prioridad al tiempo diario en la Palabra, nos anclamos en la verdad inmutable, lo cual nos capacita para permanecer en el poder transformador del Espíritu Santo. La lectura diaria de la Biblia realinea nuestra perspectiva limitada con la inmensidad de la sabiduría de Dios, convirtiendo nuestra confusión en convicción y nuestra duda en santa confianza. Al establecer este ritmo, nuestro corazón se entrena para dejar de reaccionar ante el mundo y, en cambio, responder a la guía del Padre."], ["h", "2) Oración diaria: escuchar a Dios"], ["p", "Cuando la Palabra de Dios nos confronta, naturalmente nos sentimos impulsados a acudir a Él en oración. La oración involucra nuestro corazón. La oración exitosa no consiste en abrirnos paso a la fuerza hacia los cielos ni en llevar al trono una lista interminable de exigencias. La verdadera oración es un ejercicio de escucha."], ["p", "1 Tesalonicenses 5:17 \"Estén siempre alegres, oren sin cesar, den gracias en todo; porque esta es la voluntad de Dios para ustedes en Cristo Jesús.\""], ["p", "Aunque podemos usar la estructura del Padrenuestro u otros pasajes de la Escritura para enfocar nuestro corazón, la meta final es oír la voz suave y apacible de Dios. No llevamos una agenda a Dios; esperamos su agenda para nosotros. Como Abraham, debemos cultivar un silencio que nos permita oír el llamado del Maestro, reemplazando nuestra ansiedad con una paz que solo puede venir del consuelo de su voz."], ["p", "La Escritura abunda en ejemplos de cómo la oración nos transforma. Se nos desafía a orar sin cesar, un ritmo espiritual que afina continuamente nuestros oídos al sonido distintivo de la voz del Padre en medio del ruido del mundo."], ["h", "Reconciliación con Dios y entre nosotros"], ["p", "La oración es el ambiente donde recibimos fuerza para perdonar, de modo que permanezcamos en comunión con Dios y en su perdón."], ["p", "Marcos 11:25: \"Y cuando estén orando, perdonen si tienen algo contra alguien, para que también su Padre que está en los cielos les perdone a ustedes sus ofensas.\""], ["h", "La oración trae paz"], ["p", "La oración nos permite trasladar nuestras preocupaciones a Dios, lo que produce una paz que sobrepasa el entendimiento humano."], ["p", "Filipenses 4:6–7: \"No se inquieten por nada, sino presenten sus peticiones a Dios en toda ocasión, con oración y ruego, y con acción de gracias. Y la paz de Dios, que sobrepasa todo entendimiento, guardará sus corazones y sus pensamientos en Cristo Jesús.\""], ["h", "Fortaleza y renovación"], ["p", "La oración constante nos da la fortaleza espiritual necesaria para soportar las pruebas y renovar nuestro espíritu interior."], ["p", "Isaías 40:31: \"Pero los que esperan en el Señor renovarán sus fuerzas; se elevarán con alas como las águilas; correrán y no se cansarán; caminarán y no se fatigarán.\""], ["h", "Sabiduría y guía:"], ["p", "Ante decisiones difíciles, la oración es el medio por el cual pedimos y recibimos sabiduría divina. --- Santiago 1:5: \"Si alguno de ustedes carece de sabiduría, que se la pida a Dios, quien da a todos generosamente y sin reproche, y se le dará.\""], ["p", "Perdón y sanidad: la oración es la puerta para confesar nuestras faltas y recibir la restauración de Dios y la sanidad física o emocional. --- 1 Juan 1:9: \"Si confesamos nuestros pecados, él es fiel y justo para perdonarnos los pecados y limpiarnos de toda maldad.\" --- Santiago 5:16: \"Por lo tanto, confiésense unos a otros sus pecados y oren unos por otros, para que sean sanados. La oración del justo tiene gran poder cuando está en acción.\""], ["h", "Intimidad con Dios:"], ["p", "Uno de los principales beneficios de la oración es el desarrollo de una relación personal y cercana con el Padre. --- Salmo 145:18: \"El Señor está cerca de todos los que lo invocan, de todos los que lo invocan con sinceridad.\""], ["h", "Protección contra la tentación:"], ["p", "La oración sirve como herramienta de defensa, ayudándonos a mantenernos alerta y fortaleciendo nuestra determinación frente a las trampas espirituales. --- Mateo 26:41: \"Velen y oren para que no entren en tentación. El espíritu está dispuesto, pero la carne es débil.\""], ["p", "Confianza y seguridad: saber que Dios nos oye nos da un sentido de seguridad y confianza en su cuidado soberano. --- 1 Juan 5:14: \"Y esta es la confianza que tenemos al acercarnos a él: que si pedimos algo conforme a su voluntad, él nos oye.\""], ["h", "3) Adoración diaria: el amor en acción"], ["p", "Mientras dedicamos tiempo a abrir su Palabra y a orar, Él nos habla y nos pone en nuestra misión. Esta misión diaria incluye el uso de nuestros dones espirituales, que se nos dan para glorificar a Dios y servir al bien común. Romanos 12:1 nos exhorta a presentar nuestros cuerpos como sacrificio vivo, santo y agradable a Dios, que es nuestro culto espiritual. Encontramos nuestro propósito en el ejercicio de nuestros dones espirituales. En esencia, la adoración trata de obediencia y sacrificio. Pasar tiempo con Dios nos enseña a discernir su voz."], ["h", "El estilo de vida del “Aquí estoy”"], ["p", "Las expresiones “Aquí estoy” a lo largo de la Escritura son el resultado de un estilo de vida construido sobre la escucha. Abraham y otros que cumplieron su propósito dominaron el ritmo diario de dedicar tiempo a Dios. Al establecer este hábito, te aseguras de nunca perderte en el ruido del mundo. En cambio, cada día estás posicionado para recibir tus órdenes de marcha, impulsado por una intimidad con el Padre que hace que cada paso tenga propósito. Vivimos la Palabra, la oración y la adoración para vencer por la sangre del Cordero y por la palabra de nuestro testimonio."], ["h", "Mantenerse en ritmo con Dios"], ["p", "El ritmo diario de la Palabra, la oración y la adoración es el latido vital de una vida vivida en el blanco. Al hacer espacio cada mañana para escuchar, cambias el ruido del mundo por la dirección clara del Padre y las órdenes de marcha específicas que necesitas para tu día. Esta intimidad constante convierte tu escucha en obediencia activa, en la que estás listo para decir: “Aquí estoy”. En definitiva, estos hábitos aseguran que permanezcas estrechamente unido a la Vid, permitiendo que tu vida produzca fruto de manera natural que glorifique a Dios y sirva al bien común."]], "q": [["¿Por qué es esencial establecer un tiempo diario de quietud con Dios para llegar a ser discípulo?", "Mira el comienzo de la Sección 2.", 4], ["¿Cuáles son los beneficios del tiempo diario en la Palabra de Dios?", "Mira “Palabra diaria”.", 7], ["¿Cuáles son los beneficios de la oración diaria?", "Mira “Oración diaria”.", 19], ["¿Cuáles son las acciones de la adoración diaria?", "Pista: ¡no se trata de música! Mira “Adoración diaria”.", 41], ["¿Cómo se relaciona el estilo de vida del “Aquí estoy” con el ritmo de la Palabra, la oración y la adoración?", "Mira “Mantenerse en ritmo con Dios”.", 45]]}, {"id": "s3", "k": "Sección 3", "t": "Ser y hacer discípulos", "b": [["h", "Resumen de la sección:"], ["h", "1) Ser discípulo"], ["li", "a. Responder a Dios"], ["li", "b. Responder a un pastor"], ["li", "c. Responder a nuestras circunstancias"], ["h", "2) Hacer discípulos"], ["h", "Ser discípulo"], ["p", "Seguir a Jesús escuchando la voz de Dios y respondiendo a ella."], ["h", "1a) Responder a Dios"], ["p", "Ser discípulo es un estilo de vida de respuesta activa y de disciplinas desarrolladas, en el cual entregas tu corazón al plan de Dios para tu vida mediante el ritmo diario de la Palabra, la oración y la adoración."], ["p", "Al establecer un ritmo diario de tiempo con Dios, aprendemos a escuchar su voz y, finalmente, a alinearnos con su voluntad. Si escuchamos, Él hablará, como vemos una y otra vez en la Escritura. Esta postura de respuesta se extiende a quienes nos buscan con amor para nuestra madurez espiritual. Responderles con gratitud y darles permiso para hablar a nuestra vida nos beneficia enormemente. Por último, estamos llamados a estar “en el blanco” en nuestro mundo cotidiano, viendo nuestras circunstancias como oportunidades de ser sal y luz. Responder a Dios, a nuestro pastor y a nuestras circunstancias es la obra esencial de ser discípulo."], ["p", "Este es el fundamento de nuestra vida. Mediante el ritmo diario de la Palabra, la oración y la adoración, pasamos del ruido del mundo a una postura de escucha."], ["li", "La promesa: si creamos el espacio para escuchar, Él es fiel para hablarnos."], ["li", "La meta: alineación. No solo recibimos información; ajustamos nuestra vida para que coincida con su corazón."], ["p", "En el centro de este estilo de vida hay una postura específica del corazón: la disposición de decir “Aquí estoy”. Esta frase es la máxima expresión de disponibilidad: indica que estás escuchando y listo para moverte aun antes de conocer el destino."], ["h", "Cuando decimos “Aquí estoy”"], ["p", "Cuando decimos “Aquí estoy”, declaramos nuestra disponibilidad a Dios. Es una respuesta que ocurre en el lugar de quietud de nuestro ritmo diario antes de que salgamos al mundo. Al mantener un estilo de vida de Palabra, oración y adoración, permanecemos en Cristo, lo cual trae verdadera comunión e intimidad con Dios. Esta conexión es el núcleo central de nuestra vida espiritual, como lo describió Jesús:"], ["p", "\"Yo soy la vid; ustedes son las ramas. El que permanece en mí, y yo en él, ese da mucho fruto; porque separados de mí nada pueden hacer.\" (Juan 15:5 ESV, traducción libre)"], ["p", "“Aquí estoy” no es una respuesta a una lista de tareas; es una respuesta a la Presencia del Padre. Significa que, ya sea que Dios nos llame a descansar, a arrepentirnos o a acercarnos a un vecino, nuestra respuesta ya es “Sí” porque vivimos como parte de la vid de la vida."], ["h", "Cuando Abraham dijo “Aquí estoy”"], ["h", "La perspectiva de Moria: seis pruebas de la respuesta “Aquí estoy”"], ["p", "El relato de Abraham en el monte Moria es una gran metáfora de la vida de un discípulo. Revela que la respuesta “Aquí estoy” no es una declaración de una sola vez, sino una postura continua que debe mantenerse a lo largo del camino de la fe. Al examinar Génesis 22, vemos seis pruebas distintas que afinan nuestro corazón a la frecuencia de la voz de Dios y a la magnitud de su fidelidad. Mientras la Escritura cuenta el viaje de Abraham a la cima del monte Moria, observa las tres veces que respondió con las palabras “Aquí estoy”."], ["h", "Prueba 1: ¿Estamos escuchando la asignación?"], ["p", "Versículo 1: Después de estas cosas, Dios probó a Abraham y le dijo: “¡Abraham!”. Y él respondió: “Aquí estoy”."], ["p", "Este pasaje comienza diciendo que Dios probó a Abraham llamándolo por su nombre. No dice que lo probó asignándole de inmediato una misión. Más bien, la respuesta de Abraham fue la clave para desbloquear la promesa para su vida. Podemos deducir que Abraham tenía el hábito de escuchar la voz de Dios, porque en el momento en que Dios lo llamó, respondió de inmediato con la sencilla respuesta: “Aquí estoy”. Esta prueba no fue para demostrar la fidelidad de Abraham a Dios"], ["h", "Prueba 2: ¿Obedecemos la asignación?"], ["p", "Versículos 2–3: Dios dijo: “Toma a tu hijo, tu único hijo Isaac, a quien amas, y ve a la tierra de Moria, y ofrécelo allí como holocausto en uno de los montes que yo te indicaré”. Abraham se levantó de madrugada, aparejó su asno y tomó consigo a dos de sus siervos jóvenes y a su hijo Isaac. Cortó la leña para el holocausto, se levantó y se fue al lugar que Dios le había dicho.”"], ["p", "Tan pronto como Abraham respondió a Dios, recibió su asignación: una orden que ponía a prueba su fe y exigía actuar de inmediato. Estos versículos demuestran que la obediencia de Abraham fue total e inmediata. Atendió cada detalle, incluso cortar la leña para el holocausto que consumiría a su hijo, el mismo hijo que era el cumplimiento de la promesa de Dios."], ["h", "Prueba 3: La prueba del tiempo"], ["p", "Versículo 4: “Al tercer día, Abraham alzó los ojos y vio el lugar de lejos.”"], ["p", "Este único versículo demuestra que Abraham vio su destino desde lejos. Entendió que el destino estaba lejos y que le tomaría mucho tiempo y un esfuerzo sostenido escalar la montaña de fe que tenía delante. El discipulado suele ser un largo camino entre el “sí” inicial y la provisión final."], ["h", "Prueba 4: ¿Cuál es nuestro testimonio ante el mundo en la adversidad?"], ["p", "Versículo 5: “Entonces Abraham dijo a sus siervos jóvenes: ‘Quédense aquí con el asno; yo y el muchacho iremos hasta allá, adoraremos y volveremos a ustedes’.”"], ["p", "Abraham sabía que sus siervos observaban cómo respondería al mandato de Dios. Aprovechó esa oportunidad para hablar con fe. Aun frente a lo que parecía una promesa rota, testificó que él e Isaac no solo irían juntos al monte, sino que ambos volverían. A pesar de instrucciones aparentemente contradictorias, Abraham creyó que la promesa de Dios superaría el costo de su obediencia sacrificial."], ["p", "Esto plantea la pregunta: ¿qué diría el mundo de nuestro testimonio cuando nos ve enfrentando la adversidad? Cuando hay presión y el resultado es incierto, ¿nos quejamos de nuestras circunstancias o afirmamos nuestra fe en la fidelidad de Dios? Abraham demostró al mundo que era un hombre fiel al elegir adorar en lugar de vacilar."], ["h", "Prueba 5: ¿Cuál es nuestro testimonio ante quienes amamos en la adversidad?"], ["p", "Versículos 6–8: “Abraham tomó la leña del holocausto y la puso sobre su hijo Isaac. Él tomó en su mano el fuego y el cuchillo. Y los dos iban juntos. Isaac dijo a su padre Abraham: ‘¡Padre mío!’. Y él respondió: ‘Aquí estoy, hijo mío’. Isaac dijo: ‘Aquí están el fuego y la leña, pero ¿dónde está el cordero para el holocausto?’. Abraham respondió: ‘Dios proveerá para sí el cordero para el holocausto, hijo mío’. Y los dos iban juntos.”"], ["p", "A veces es más fácil dar testimonio de la fidelidad de Dios a extraños que a quienes tenemos más cerca. En el versículo seis, Abraham hace que Isaac lleve la leña para la ofrenda mientras él lleva el fuego y el cuchillo. Imagina la agitación en el alma de Abraham cuando Isaac preguntó: “¿Dónde está el cordero para el holocausto?”. La respuesta de Abraham fue una declaración de fe: Dios proveería el cordero. Antes de ver el carnero en el matorral, ya tenía fe en que Dios proveería."], ["h", "Prueba 6: ¿Estamos escuchando durante la asignación?"], ["p", "Versículos 9–12: Cuando llegaron al lugar que Dios le había dicho, Abraham construyó allí el altar, acomodó la leña, ató a su hijo Isaac y lo puso sobre el altar, encima de la leña. Entonces Abraham extendió la mano y tomó el cuchillo para sacrificar a su hijo. Pero el ángel del Señor lo llamó desde el cielo: “¡Abraham, Abraham!”. Y él respondió: “Aquí estoy”. El ángel dijo: “No extiendas tu mano contra el muchacho ni le hagas nada, porque ahora sé que temes a Dios, pues no me has negado a tu hijo, tu único hijo.”"], ["li", "Fidelidad continua: Abraham construyó el altar, ató a su hijo y levantó el cuchillo. Estaba plenamente preparado para hacer el sacrificio impensable."], ["li", "Escuchar durante la asignación: aun en un momento increíblemente desgarrador y emotivo, justo el segundo antes de que el cuchillo terminara con una vida, Dios llamó a Abraham otra vez. Abraham respondió una vez más: “Aquí estoy”. En ese punto, Dios lo detuvo, proveyó el carnero y reiteró la promesa de que Abraham sería padre de una gran nación. Si Abraham hubiera dejado de escuchar la voz de Dios durante la asignación, habría perdido su legado conforme a la promesa de Dios."], ["p", "Cuando Isaías dijo “Aquí estoy”"], ["p", "\"Entonces oí la voz del Señor que decía: ‘¿A quién enviaré, y quién irá por nosotros?’. Y respondí: ‘¡Aquí estoy! Envíame a mí’.\" (Isaías 6:8 ESV, traducción libre)"], ["p", "En Isaías 6:1–8, Dios revela su gloria a Isaías en una visión que lo abruma, mientras los serafines claman: “Santo, santo, santo es el Señor de los ejércitos”, y en ese momento Isaías vislumbra de verdad la santidad de Dios; el temor del Señor se apodera de él, y de inmediato se humilla y confiesa: “¡Ay de mí!… soy un hombre de labios impuros”, reconociendo tanto su propio pecado como la condición de su pueblo; sin embargo, Dios responde no con juicio sino con gracia, enviando a un serafín a tocar los labios de Isaías con un carbón encendido y a declarar que su culpa era quitada y su pecado expiado; solo después de esta purificación el Señor pregunta: “¿A quién enviaré, y quién irá por nosotros?”, e Isaías, ya transformado por el temor de Dios y restaurado por su misericordia, responde con plena entrega: “¡Aquí estoy! Envíame a mí”."], ["p", "En respuesta a la entrega de Isaías, “¡Aquí estoy! Envíame a mí”, Dios lo comisiona no a un ministerio fácil ni celebrado, sino a proclamar fielmente su palabra a un pueblo que oiría pero no entendería; sin embargo, mediante este llamado la relación de Isaías con Dios pasa de un momento de temerosa conciencia del pecado a una vida de comunión restaurada y de obediencia con propósito, y aunque su tarea no daría resultados visibles inmediatos, su fidelidad lo posicionó como un siervo de Dios cuyas palabras serían preservadas y resonarían a través de generaciones, demostrando que, si bien la obediencia no le hizo la vida más fácil, la alineó con la voluntad de Dios, llena de propósito y de eterno significado."], ["p", "Cuando María dijo “Aquí estoy”"], ["p", "\"Entonces María dijo: ‘He aquí la sierva del Señor; hágase en mí según tu palabra’.\" (Lucas 1:38 ESV, traducción libre)"], ["p", "La vida de María es un poderoso testimonio del estilo de vida de respuesta, en particular cuando el ángel Gabriel la visitó con la noticia de que daría a luz al Mesías. Aunque las circunstancias eran humanamente imposibles y tendrían un alto costo social, su respuesta fue una entrega inmediata y total a la iniciativa de Dios."], ["p", "Al declararse sierva, anunciaba su total disponibilidad al Padre. No pidió un mapa detallado de los siguientes treinta años; simplemente entregó su cuerpo, su reputación y su futuro al plan de Dios antes de saber cómo se desarrollaría."], ["p", "El “Aquí estoy” de María demuestra que ser discípulo significa responder a Dios aun cuando su llamado interrumpe nuestros planes personales o desafía nuestra comodidad. Porque se mantuvo en una postura de disponibilidad, se convirtió en el vaso por el cual la Promesa entró al mundo, mostrándonos que la intimidad con Dios se encuentra en la respuesta sencilla y humilde: “Hágase en mí según tu palabra”."], ["h", "“Aquí estoy” es cómo respondemos"], ["p", "El viaje de Abraham demuestra que la respuesta “Aquí estoy” debe permanecer activa desde el pie de la montaña hasta la cima. Estamos llamados a escuchar la asignación, obedecer las instrucciones y seguir escuchando aun en el calor de la prueba. Cuando mantenemos esta postura, descubrimos que nuestra obediencia no solo cumple un requisito; nos posiciona para ver la plena magnitud de la provisión de Dios."], ["h", "1b) Responder a tu pastor"], ["p", "Ser discípulo implica la humildad de reconocer que Dios con frecuencia habla y guía mediante las voces de aquellos que Él ha puesto como cobertura espiritual sobre nosotros y a nuestro alrededor. Un estilo de vida de respuesta requiere que seamos enseñables, dejando a un lado nuestro orgullo para seguir, escuchar y aplicar la guía de líderes espirituales que están invertidos en nuestro crecimiento. El verdadero cambio de vida rara vez ocurre en aislamiento; con frecuencia es el resultado de una profunda inversión espiritual de un mentor o pastor que nos ayuda a ver lo que no podemos ver en nosotros mismos. Esta postura de honra está arraigada en la manera en que consideramos a quienes Dios ha"], ["h", "puesto para guiarnos:"], ["p", "\"Les pedimos, hermanos, que respeten a los que trabajan entre ustedes y los presiden en el Señor y los amonestan, y que los estimen muy en alto con amor por causa de su obra. Vivan en paz entre ustedes.\" (1 Tesalonicenses 5:12–13 ESV, traducción libre) Cuando respondemos a nuestros pastores, no solo seguimos a una persona; respondemos al orden establecido por Dios que protege nuestra alma y nos mantiene en el blanco."], ["h", "Relación de discipulado: Timoteo y Pablo"], ["p", "\"Retén la forma de las sanas palabras que de mí oíste, en la fe y el amor que son en Cristo Jesús.\" (2 Timoteo 1:13 ESV, traducción libre) La relación entre el apóstol Pablo y Timoteo es un gran ejemplo de pastoreo. Timoteo era un joven que luchaba con una timidez natural y con el gran peso de su llamado, pero Pablo invirtió en él como un padre en la fe. Pablo pastoreó a Timoteo mediante corrección constante, ánimo e instrucción específica. El crecimiento de Timoteo hasta convertirse en un líder estable solo fue posible porque respondió consistentemente a la mentoría de Pablo. Pablo le recordó que su autoridad espiritual provenía de seguir el “modelo de las sanas palabras” que su pastor le mostraba."], ["h", "Cómo se benefició Timoteo de su pastor:"], ["li", "Superar el miedo: mediante el pastoreo de Pablo, la timidez natural de Timoteo fue reemplazada por un espíritu de poder, amor y dominio propio (2 Timoteo 1:7)."], ["li", "Dirección clara: Timoteo no tuvo que adivinar cómo liderar; tenía un plano probado que seguir."], ["li", "Autoridad transferida: al responder al liderazgo de Pablo, a Timoteo finalmente se le confió su propio ministerio, lo que demuestra que quienes siguen bien están capacitados para liderar bien."], ["h", "Relación de discipulado: Rut y Noemí"], ["p", "\"Y ella le respondió: ‘Haré todo lo que me digas’.\" (Rut 3:5 ESV, traducción libre)"], ["p", "El cambio de vida que vemos en Rut es un poderoso testimonio del valor de someterse a un pastor. Rut, una extranjera viuda que lo había perdido todo, decidió unirse a la cobertura espiritual de Noemí. Noemí le dio un pastoreo estratégico que la posicionó para un futuro que ella no podía ver. La redención de Rut solo fue posible porque respondió a la mentoría de Noemí con total humildad. Cuando Noemí le dio instrucciones específicas y difíciles sobre cómo acercarse a Booz en la era, Rut no se apoyó en su propio entendimiento. Ella respondió: “Haré todo lo que me digas”."], ["h", "Cómo se benefició Rut de su pastora:"], ["li", "Un cambio de identidad: mediante la guía de Noemí, Rut dejó de verse a sí misma como una extraña y comenzó a vivir como hija del Dios de Israel."], ["li", "Posicionamiento estratégico: Noemí veía el “campo” mejor que Rut. Sus instrucciones posicionaron a Rut para que Booz, su pariente redentor, se fijara en ella."], ["li", "El fruto del legado: porque Rut respondió a la persona que Dios usó para guiarla, fue introducida en el linaje directo del rey David y de Jesucristo."], ["h", "Mandatos bíblicos para responder a un pastor"], ["li", "Responder a la supervisión: \"Obedezcan a sus líderes y sométanse a ellos, porque ellos velan por sus almas, como quienes han de rendir cuentas.\" (Hebreos 13:17 ESV, traducción libre)"], ["li", "Responder a la capacitación: \"Y él dio... a los pastores y maestros, a fin de capacitar a los santos para la obra del ministerio, para edificar el cuerpo de Cristo.\" (Efesios 4:11–12 ESV, traducción libre)"], ["li", "Responder al ejemplo: \"Acuérdense de sus líderes, quienes les hablaron la palabra de Dios. Consideren el resultado de su manera de vivir e imiten su fe.\" (Hebreos 13:7 ESV, traducción libre)"], ["li", "Responder con humildad: \"Igualmente, jóvenes, estén sujetos a los ancianos. Y todos revístanse de humildad unos para con otros.\" (1 Pedro 5:5 ESV, traducción libre)"], ["li", "Responder a tu pastor es el puente entre ser discípulo y hacer discípulos. Cuando nos dejamos pastorear, respondiendo con el corazón de Rut y la disposición a aprender de Timoteo, experimentamos el tipo de cambio de vida que solo ocurre mediante la inversión espiritual. Al honrar a quienes velan por nuestras almas, permanecemos en una postura en la que Dios puede moldearnos como líderes que un día velarán por otros."], ["h", "1c) Responder a tus circunstancias"], ["p", "Ser discípulo implica aceptar tus circunstancias como oportunidades divinas para responder con fe en lugar de reaccionar con autosuficiencia. A menudo vemos las situaciones inesperadas como obstáculos, pero en la vida de un discípulo esos momentos son el principal campo de entrenamiento para la madurez. Cuando respondemos correctamente a nuestro entorno, demostramos que nuestra confianza está en la soberanía de Dios y no en la estabilidad de nuestro ambiente."], ["h", "Pablo y Silas: responder con adoración"], ["p", "Después de ser golpeados y encarcelados por predicar el evangelio, Pablo y Silas se encontraron encadenados en una cárcel de Filipos. En lugar de quejarse o desesperarse, respondieron a sus circunstancias con adoración y oración."], ["p", "\"Hacia la medianoche, Pablo y Silas oraban y cantaban himnos a Dios, y los presos los escuchaban.\" (Hechos 16:25 ESV, traducción libre)"], ["h", "Los apóstoles: responder con gozo"], ["p", "Después de ser arrestados y golpeados por predicar en el nombre de Jesús, los apóstoles recibieron de las autoridades la orden de dejar de enseñar acerca de Cristo. En lugar de irse desanimados o con miedo, se regocijaron de haber sido considerados dignos de sufrir por su nombre."], ["p", "\"Entonces salieron de la presencia del concilio, regocijándose de haber sido considerados dignos de sufrir afrenta por el Nombre.\" (Hechos 5:41 ESV, traducción libre)"], ["h", "Hacer discípulos"], ["h", "Hacer discípulos significa buscar a las personas"], ["p", "Hacer discípulos significa modelar y enseñar activamente a otros a vivir una vida que agrade al Señor. Los estás guiando para que lleguen a ser discípulos así como tú eres discípulo de Jesús, acompañándolos para cultivar el Espíritu mientras aprenden a permanecer en la verdad de la Escritura y a aplicarla a su vida. Hacer discípulos comienza con construir relaciones, porque ellas son tanto la tierra como el fruto del discipulado."], ["p", "La tierra: las relaciones pueden ser una gran tierra para dar y recibir un discipulado significativo, constante y a menudo de toda la vida. Proverbios 27:17 dice: “El hierro con hierro se afila, y un hombre afila a otro.” Dos amigos en una relación de confianza tienen una base sólida para procesar la alegría, el dolor y lidiar con preguntas difíciles. Dentro de una amistad centrada en la fe, el Espíritu Santo puede guiar a dos personas que buscan hacia el fundamento firme de la verdad. Estas relaciones proveen una tierra nutritiva para hacer preguntas desafiantes sobre Dios, la Biblia y nuestra fe, incluidas nuestras propias luchas personales con estos temas. La amistad es tierra fértil para el crecimiento espiritual. El fruto: las relaciones significativas suelen ser el fruto, el resultado natural, de participar juntos en el discipulado. Un momento compartido de descubrimiento espiritual puede transformar a dos desconocidos en amigos de toda la vida, forjando el tipo de vínculo descrito en Proverbios 17:17: una amistad que \"ama en todo tiempo\" y que \"nace para el tiempo de angustia\"."], ["p", "Piensa en los momentos de tu vida en que una conversación espiritual con un amigo te abrió los ojos a una verdad nueva, o cuando te uniste a una clase o a un grupo pequeño para estudiar la Escritura. En esos entornos, la búsqueda compartida de Dios actúa como catalizador de la conexión. Si bien ciertamente aprendemos del Espíritu Santo en soledad, a veces nuestras relaciones más profundas crecen de la tierra fértil de aprender, crecer y “luchar” con la verdad junto a otros."], ["h", "Modelar una vida compartida hace discípulos"], ["p", "Una comunidad de iglesia sana es más que un círculo social. Es un laboratorio de discipulado donde modelar una vida compartida y la formación espiritual están inseparablemente unidos. A lo largo de la Escritura vemos que madurar en Cristo rara vez ocurre en el vacío. Jesús no se limitó a dar conferencias. Llamó a doce discípulos a una vida compartida para demostrar que la inversión espiritual más profunda ocurre en el contexto de una relación. Pablo y Bernabé, o Rut y Noemí, no eran solo compañeros. El vínculo entre David y Jonatán muestra que hacer un discípulo con frecuencia exige atravesar juntos el fuego. Su relación no era un subproducto de la cercanía. Era el fruto de un compromiso mutuo con los propósitos de Dios. Vivir en comunidad demuestra que Dios usa nuestras estaciones más difíciles para transformar a desconocidos en un pueblo unido y en seguidores maduros de Cristo."], ["p", "Eran socios en una misión que se estimulaban intencionalmente unos a otros hacia una vida más semejante a Cristo. Modelar una vida compartida requiere estar lo bastante cerca para que otros vean cómo se vive la fe en tiempo real."], ["h", "Vivir en comunidad hace discípulos"], ["p", "El viaje de los israelitas de la esclavitud a la Tierra Prometida sirve como modelo del discipulado colectivo. Su identidad espiritual no se forjó en la comodidad, sino a través de la dureza de soportar la miseria y presenciar milagros juntos. Esta experiencia colectiva de una nación muestra que hacer discípulos con frecuencia requiere atravesar el fuego juntos, permitiendo que las pruebas compartidas unan los corazones de una manera que la prosperidad nunca podría. Al vivir en comunidad, un pueblo errante se transformó en una nación unida, demostrando que Dios usa el peso de una historia compartida para refinar el carácter de sus seguidores y convertir a desconocidos en familia."], ["p", "Ser parte de una iglesia requiere que la construyamos y la mantengamos. La comunidad no es algo que encontramos; es algo que construimos. Muchas personas se pierden la bendición de la comunión y desperdician su vida vagando de una iglesia a otra buscando comunidad, sin encontrarla nunca porque se niegan a construirla. Solo podemos saborear el fruto de la comunidad trabajando la tierra para construirla. La comunidad es algo costoso. Cuando nos enfocamos solo en la reunión del domingo y perdemos la oportunidad de desarrollar relaciones, desanimamos el hacer discípulos. Para realmente hacer discípulos, debemos facilitar espacios donde se cultive la tierra de la amistad y donde todos abracen el trabajo de construir comunidad."], ["h", "El camino relacional: ser conocido, mostrado y desarrollado"], ["p", "La meta de una relación de pastoreo es que la persona que está siendo discipulada sea conocida, desarrollada y mostrada"], ["h", "Conocido: la tierra de la relación"], ["p", "El discipulado comienza conociendo a la persona. Al construir una relación genuina, creas un espacio donde alguien se siente lo bastante seguro para ser realmente conocido. Esto refleja el vínculo del Pastor en Juan 10; así como las ovejas reconocen la “forma” de la voz del Pastor, un amigo aprende a oír el corazón de Dios a través del tono de una relación de confianza. Esto te permite atender necesidades y hablar vida en las situaciones relevantes de la persona a quien discipulas."], ["h", "Mostrado: las semillas de la verdad"], ["p", "En la tierra de una relación, la verdad se siembra mediante la honestidad. Muestras el camino a un amigo abriendo juntos la Palabra de Dios y siendo transparente acerca de tus propias luchas y victorias. Esta combinación de verdad bíblica y vulnerabilidad personal permite que las “semillas” de la verdad en la fe echen raíz sin temor al juicio. Es imperativo sembrar las semillas de la verdad de Dios en el espíritu y no en nuestra propia carne, porque sabemos que lo que sembremos, eso cosecharemos."], ["h", "Desarrollado: el fruto del crecimiento"], ["p", "La madurez espiritual es la cosecha de permanecer en Cristo y aplicar las verdades a nuestra vida. A medida que caminan juntos por la vida, el “fruto” es un discípulo que se parece más a Cristo y una fe que resiste el paso del tiempo. Nosotros sembramos y regamos, pero solo el Señor puede hacer brotar el fruto de un corazón. Él nos usa para sembrar, regar y cuidar a las personas para que la semilla eche raíces y dé buen fruto."], ["h", "La Gran Comisión: la búsqueda de los perdidos"], ["p", "Esto representa el ciclo completo de hacer discípulos. Comienza con que somos buscados y confrontados por la verdad de Jesús; una vez que respondemos, comienza nuestro camino de “ser” discípulo. Luego somos discipulados para permanecer, aplicar y crecer en nuestra fe y en nuestra comunión con Dios. A medida que crecemos, el amor nos impulsa a aceptar la comisión de hacer discípulos buscando a los perdidos e invitándolos a una relación con Dios y con nosotros. Esto completa el ciclo: evangelizar es simplemente amar al mundo lo suficiente como para ser un discípulo que hace más discípulos."], ["li", "El mandato: \"Por tanto, vayan y hagan discípulos de todas las naciones, bautizándolos en el nombre del Padre y del Hijo y del Espíritu Santo, y enseñándoles a guardar todo lo que les he mandado.\" (Mateo 28:19–20 ESV, traducción libre)"], ["li", "La identidad: \"Y les dijo: ‘Síganme, y los haré pescadores de hombres’.\" (Mateo 4:19 ESV, traducción libre)"], ["li", "La búsqueda: \"Porque el Hijo del Hombre vino a buscar y a salvar lo que se había perdido.\" (Lucas 19:10 ESV, traducción libre)"], ["li", "El poder: \"Pero recibirán poder cuando el Espíritu Santo venga sobre ustedes, y serán mis testigos... hasta lo último de la tierra.\" (Hechos 1:8 ESV, traducción libre)"], ["li", "El llamado: \"Así que somos embajadores de Cristo, como si Dios rogara por medio de nosotros. En nombre de Cristo les rogamos: reconcíliense con Dios.\" (2 Corintios 5:20 ESV, traducción libre)"], ["h", "El poder de contar nuestra historia para hacer discípulos"], ["p", "Tenemos a nuestra disposición una herramienta increíblemente poderosa para hacer discípulos. Todo cristiano la tiene: contar nuestra historia. Apocalipsis enseña que vencemos por la sangre del Cordero y por la palabra de nuestro testimonio, presentando el relato como un arma que derrota al enemigo. Contar nuestra historia nos capacita para vencer al enemigo porque traslada el Evangelio de un concepto lejano y abstracto a una realidad viva que no se puede refutar. Cuando hablamos con sinceridad de cómo Cristo nos sacó de la oscuridad, desmantelamos activamente las mentiras del acusador y le quitamos su poder de mantenernos —a nosotros o a quienes escuchan— atados en la vergüenza y el silencio. Al compartir las maneras específicas en que Dios ha redimido nuestro pasado, convertimos nuestra historia en un campo de batalla donde la derrota del enemigo se hace pública. Contar nuestra historia inspira y anima a otros a buscar a Dios de maneras que le permitan hacer su obra milagrosa en ellos, creando una nueva chispa de esperanza en sus propias circunstancias. Al presenciar la realidad del poder de Dios a través de nuestra vida, se animan a buscar su propia transformación para que, a su vez, puedan contar su historia a un mundo necesitado."]], "q": [["Ser discípulo significa vivir un estilo de vida de respuesta a tres cosas específicas. ¿Cuáles son?", "Mira “Ser discípulo”.", 6], ["Con base en la historia de Abraham en el monte Moria, ¿qué significa vivir un estilo de vida de “Aquí estoy” en tu caminar diario con Dios?", "Mira la perspectiva de Moria.", 20], ["¿Cuál es la actividad principal de hacer discípulos?", "Mira el comienzo de “Hacer discípulos”.", 84], ["¿Cómo se puede describir una relación como la “tierra” y el “fruto” del discipulado?", "Mira “La tierra” y “El fruto”.", 97], ["¿Cuáles son las tres acciones específicas (o etapas) del camino relacional que se usa en una relación de pastoreo?", "Mira “El camino relacional”.", 95]]}, {"id": "s4", "k": "Sección 4", "t": "Amar y servir", "b": [["h", "Resumen de la sección:"], ["h", "1) El estilo de vida de amar y servir"], ["h", "2) Los cuatro fundamentos de amar y servir"], ["p", "Un verdadero discípulo de Cristo vive una vida de amor y servicio. Amar y servir es el desbordamiento natural de permanecer en Cristo (Juan 15:12–13). El amor se expresa con el corazón y el servicio se expresa con las manos."], ["h", "1) El estilo de vida de amar y servir"], ["h", "Amar"], ["p", "Cuando cruzamos el umbral del amor con una persona, obtenemos una perspectiva espiritual que nos ayuda a mostrarle cómo Dios quiere revelar su gloria en su vida. También podemos describir la trampa que Satanás le ha tendido; nuestro amor por otra persona le ofrece ese beneficio, y nosotros nos beneficiamos del amor de la misma manera. Este es el fruto del amor. Esta profundidad de entrega no es pasiva; solo podemos amar de verdad aquello por lo que hemos sacrificado algo. Esto lo aprendimos del modelo de Cristo en la cruz, quien nos mostró la verdadera definición del amor mediante su máximo sacrificio. Al permanecer en Cristo, Dios guía nuestro corazón a amar lo que Él ama."], ["h", "Servir"], ["p", "Servir a alguien abre la puerta para amarlo. Cuando nos sacrificamos por alguien, lo invitamos a cruzar con nosotros el umbral del amor. Servir a otros abre la puerta para que la bendición de Dios se derrame en su vida. Cuando servimos a otros de manera desinteresada, los lleva a preguntarse: “¿Por qué hacen esto?”. Llevar esa pregunta a Dios le permite hacer su obra; la gente ve nuestro servicio como la bondad de Dios, y esa bondad conduce al arrepentimiento, lo cual abre la puerta al discipulado. Servir es simplemente el amor en acción, la prueba exterior de que nuestra devoción interior es genuina. Servir no espera a que se lo pidan; busca activamente la necesidad. No espera recompensa, reconocimiento ni reciprocidad, y encuentra su satisfacción únicamente en agradar a Dios. Más allá de suplir necesidades, servir humilla el alma y rompe el poder del egoísmo en nosotros. Ayuda a romper la esclavitud de nuestra carne, para que la gloria de Dios se revele en nosotros."], ["h", "2) Los cuatro fundamentos de amar y servir"], ["h", "Fundamento 1: Amar y servir a Cristo"], ["p", "Amamos y servimos a Cristo permaneciendo en Él. Como enseña Jesús en Juan 15:5: \"Yo soy la vid; ustedes son las ramas. El que permanece en mí, y yo en él, ese da mucho fruto; porque separados de mí nada pueden hacer.\" Fuera de esta conexión, no podemos hacer nada de valor eterno. Amar y servir a Cristo significa permanecer reconciliados con el Padre por medio de Cristo para poder, a su vez, reconciliarnos con el mundo."], ["p", "Se nos ha confiado el ministerio de la reconciliación, actuando como embajadores que ayudan a un mundo quebrantado a encontrar el camino de regreso a Dios. Como declara 2 Corintios 5:17-21: \"De modo que, si alguno está en Cristo, es una nueva creación. Lo viejo ha pasado; he aquí, ha llegado lo nuevo. Todo esto proviene de Dios, quien por medio de Cristo nos reconcilió consigo mismo y nos dio el ministerio de la reconciliación; es decir, en Cristo Dios estaba reconciliando al mundo consigo mismo, no tomándoles en cuenta sus transgresiones, y encomendándonos a nosotros el mensaje de la reconciliación.\" En la práctica, amamos y servimos a Cristo estableciendo un ritmo diario de Palabra, oración y adoración, que mantiene nuestro corazón alineado con el suyo. Esta salud espiritual luego se desborda hacia el mundo cuando compartimos activamente su amor con nuestras palabras y obras."], ["h", "Fundamento 2: Amar y servir al hogar"], ["p", "Nuestras familias son las primeras en beneficiarse cuando tenemos una relación correcta con Cristo. Se benefician de nuestra madurez espiritual y pueden sufrir por nuestra inmadurez. Establecer un Fundamento Uno sólido es la única manera de construir un Fundamento Dos sólido. La guía destaca que debemos amar y servir a nuestras familias en todas las etapas de la vida, incluidos el matrimonio, los hijos y la crianza. Debemos dedicarnos a amar y servir a nuestra familia en todas las formas en que esta se manifieste. Ya sean familias tradicionales o ensambladas, estamos llamados a priorizar estas relaciones procurando la paz."], ["p", "Tomando Romanos 12:18 como ancla, \"si es posible, en cuanto dependa de ustedes, vivan en paz con todos\", nos enfrentamos a tres oportunidades de reconciliación. Primero, cuando hemos herido a alguien, seguimos Mateo 5:23-24 y vamos a buscarlo. Segundo, cuando alguien nos hiere, seguimos Marcos 11:25 y decidimos perdonar. Tercero, si los esfuerzos de reconciliación fracasan, hacemos todo lo posible por buscarlos con amor y nos comprometemos a orar por ellos. Amar y servir a nuestra familia también significa asegurarnos de tener una visión bíblica del dinero, logrando un equilibrio entre mantener a la familia como prioridad y manejar las responsabilidades de proveer para ella económicamente."], ["h", "Fundamento 3: Amar y servir a la iglesia"], ["p", "Amamos y servimos a la iglesia involucrándonos intencionalmente con las personas que componen el cuerpo y discipulándolas. No es una organización, es un organismo. Construir una iglesia significa construir una comunidad donde los miembros son conocidos, mostrados y desarrollados. Lo hacemos asistiendo con regularidad a las reuniones, usando nuestros dones espirituales para fortalecer a otros y apoyando económicamente la misión de la iglesia. Según la guía, la Iglesia es una comunidad “llamada fuera” (la Ecclesia) de creyentes unidos por su fe común en Cristo. Lo que es la iglesia se define como el Cuerpo y la Novia de Cristo: un organismo vivo, formado por miembros diversos que funcionan en unidad para reflejar la gloria de Dios al mundo."], ["h", "Fundamento 4: Amar y servir al mundo"], ["p", "El fundamento final se construye sobre la Gran Comisión de Mateo 28:18-20, donde vamos bajo la autoridad de Cristo a hacer discípulos de todas las naciones. Amamos y servimos al mundo practicando una hospitalidad radical, abriendo nuestros hogares y nuestra vida a extraños y vecinos para construir relaciones sin segundas intenciones (Hebreos 13:2). Buscamos la justicia y la misericordia defendiendo a los vulnerables y atendiendo las necesidades físicas de los marginados (Miqueas 6:8). Ofrecemos oración de intercesión, hablando con Dios acerca de los perdidos antes de hablar con los perdidos acerca de Dios (1 Timoteo 2:1). Vivimos como una “Ciudad sobre un monte”, manteniendo una integridad extraordinaria en nuestros lugares de trabajo para que nuestra luz brille a través de nuestra excelencia (Mateo 5:16). Compartimos la razón de nuestra esperanza, buscando puertas abiertas para contar nuestra historia de salvación con mansedumbre y respeto (1 Pedro 3:15)."], ["p", "En definitiva, amamos y servimos al mundo comprometiéndonos con la disciplina de hacer discípulos. Una de las herramientas principales para hacer discípulos es aprender a contar nuestra historia con verdad y transparencia para que otros vean cómo Dios ha obrado en nuestra vida. Apocalipsis enseña que vencemos por la sangre del Cordero y por la palabra de nuestro testimonio. Cuando contamos nuestra historia, nos beneficia a nosotros y a la persona que escucha de primera mano la obra de Dios en nosotros."]], "q": [["Según la sección “Amar”, ¿cuál es el beneficio espiritual o “fruto” de cruzar el umbral del amor con otra persona?", "Mira el comienzo de “Amar”.", 5], ["La sección “Servir” describe el servicio como “el amor en acción”. ¿Cómo lleva el servicio desinteresado a alguien hacia la puerta del discipulado?", "Bondad, luego preguntas, luego arrepentimiento.", 7], ["Según el Fundamento 2, ¿por qué es importante priorizar nuestra relación con Cristo antes de intentar servir a nuestro propio hogar?", "Mira “Fundamento 2”.", 13], ["¿De qué manera contar tu testimonio personal actúa como un arma contra el enemigo?", "Mira Apocalipsis y “la palabra de nuestro testimonio”.", 20]]}, {"id": "launch", "k": "Cierre", "t": "Living On Target: el lanzamiento del estilo de vida", "b": [["p", "Has completado la etapa fundamental de la Formación en Discipulado de Living On Target. Este es un logro espiritual profundo. Te has involucrado en la obra pesada del corazón, alineando tu vida con la meta máxima de la gloria de Dios."], ["p", "Ahora cuentas con un plano táctico para salir del ruido de la vida diaria y entrar en un estilo de vida de escucha, obediencia y fruto sobrenatural."], ["h", "Repaso de las ideas clave"], ["p", "Aférrate a los cuatro fundamentos del blanco que has establecido a lo largo de esta formación:"], ["h", "● Nuestra cita con Dios"], ["p", "\"Por eso, ya sea que estemos en casa o ausentes, nos proponemos agradarle.\" – 2"], ["h", "Corintios 5:9"], ["p", "Nuestra meta principal es vivir una vida que agrade a Dios, sabiendo que un día estaremos ante el tribunal de Cristo para dar cuenta de nuestras acciones. Esta rendición de cuentas no es motivo de temor sino una brújula diaria, donde un santo temor y reverencia por el poder de Dios aclaran su carácter, nos anclan en su amor inquebrantable y nos motivan a persuadir a otros."], ["h", "● El ritmo de la Palabra, la oración y la adoración"], ["h", "\"Lámpara es a mis pies tu palabra y luz para mi camino.\" – Salmo 119:105"], ["p", "Una relación íntima con Dios requiere un tiempo diario de quietud que sincronice nuestra vida con su latido en lugar de dejarnos llevar por el mundo. Involucramos nuestra mente mediante la autoridad, la dirección y el discernimiento de la Palabra, entregamos nuestro corazón orando y escuchando su agenda, y desplegamos nuestros dones espirituales mediante un estilo de vida de adoración arraigado en la obediencia y el sacrificio."], ["h", "● Ser y hacer discípulos"], ["p", "\"Yo soy la vid; ustedes son las ramas. El que permanece en mí, y yo en él, ese da mucho fruto...\" – Juan 15:5 --- Ser discípulo significa mantener una postura continua de “Aquí estoy” de absoluta disponibilidad, aprendiendo a responder con humildad y fe a Dios, a nuestros pastores espirituales y a nuestras circunstancias. A medida que esta postura madura, hacemos discípulos activamente buscando a las personas, modelando una vida compartida en comunidad y guiando a otros por un camino relacional donde son verdaderamente conocidos, se les muestra la verdad y se desarrollan hasta la madurez espiritual."], ["h", "● Amar y servir"], ["h", "\"Por tanto, vayan y hagan discípulos de todas las naciones...\" – Mateo 28:19"], ["p", "La vida de un discípulo es impulsada por el amor en el corazón y se expresa mediante un servicio desinteresado con las manos, lo cual actúa como catalizador que abre la puerta para que la bondad de Dios lleve a otros al arrepentimiento. Este estilo de vida se construye desde una conexión profunda con Cristo, se desborda para traer paz y reconciliación al hogar, fortalece la comunidad de la iglesia y ejecuta la Gran Comisión practicando una hospitalidad radical y compartiendo nuestra esperanza con el mundo."], ["h", "Tu despliegue: ve y multiplica"], ["p", "La Gran Comisión es tu directiva, y tienes las herramientas para ejecutarla. La verdadera mayordomía significa tomar las inversiones que Dios ha puesto en ti y multiplicarlas dentro de tu comunidad. El amor te impulsa a amar a los demás."], ["p", "Entra hoy al camino relacional con estos tres puntos de acción: 1. Cultiva la tierra (sé conocido): construye relaciones genuinas donde las personas se sientan seguras. Conoce sus corazones, así como las ovejas reconocen la voz del Pastor en Juan 10."], ["p", "2. Planta la semilla (muestra el camino): abre la Palabra de Dios con otros. Sé transparente acerca de tus propias luchas y victorias, permitiendo que la verdad inmutable eche raíz sin temor al juicio."], ["p", "3. Empuña tu arma (cuenta tu historia): recuerda que vencemos por la sangre del Cordero y por la palabra de nuestro testimonio. Tu historia personal de transformación es un recurso innegable que desmantela el engaño, despoja al enemigo de su poder y enciende una nueva esperanza en quienes la escuchan."], ["h", "El encargo:"], ["p", "No seas como el siervo paralizado que escondió su talento en la tierra por un concepto equivocado del corazón del Amo. Da un paso adelante con sabiduría reverente, sube la montaña de la fe y deja que tu vida dé fruto de manera natural para su reino."]], "q": []}], "fr": [{"id": "intro", "k": "Bienvenue", "t": "Living On Target : Formation de disciples", "b": [["p", "Notre objectif est que chaque participant s’engage dans l’œuvre du cœur pour être et faire des disciples ! Cette formation équipera les membres et les responsables d’église pour devenir des disciples du Christ qui font des disciples qui aiment et servent le Christ, la famille, l’église et le monde."], ["h", "Le matériel est divisé en quatre sections :"], ["h", "Section 1 : Notre rendez-vous avec Dieu"], ["p", "Nous avons tous un rendez-vous avec Dieu où nous rendrons compte de ce que nous avons fait dans cette vie. Nous nous y préparons en vivant une vie qui plaît à Dieu et en persuadant les autres d’en faire autant."], ["h", "Section 2 : Établir le rythme de la Parole, de la prière et de l’adoration"], ["p", "Vivre une vie qui plaît à Dieu exige une relation intime avec lui. Elle est entretenue par un rythme quotidien de Parole, de prière et d’adoration. Ce rythme garde notre cœur aligné sur Dieu et notre vie centrée sur son dessein."], ["h", "Section 3 : Être et faire des disciples"], ["p", "Le discipulat commence par l’attitude « Me voici ». Un disciple apprend à répondre à Dieu, à la direction spirituelle et aux circonstances de la vie avec humilité et foi. À mesure que cette attitude mûrit, les disciples vont intentionnellement vers les autres afin que l’œuvre de Dieu se multiplie par eux."], ["h", "Section 4 : Aimer et servir le Christ, la famille, l’église et le monde"], ["p", "La vie d’un disciple est animée par l’amour et s’exprime par le service. Cette section explore quatre fondements de l’influence spirituelle : le Christ, la famille, l’église et le monde. Chaque niveau dépend de la solidité de celui qui est en dessous. Une marche solide avec le Christ produit des familles saines, des églises fortes et un témoignage puissant auprès du monde."], ["p", "Ensemble, ces sections nous font passer du bruit de la vie quotidienne à une vie d’écoute, d’obéissance et de fruit. Le but du mode de vie de disciple est simple : rester connectés au Christ afin que notre vie porte naturellement du fruit pour sa gloire."]], "q": []}, {"id": "s1", "k": "Section 1", "t": "Notre rendez-vous avec Dieu", "b": [["h", "Aperçu de la section :"], ["h", "1) Plaire à Dieu"], ["h", "2) Rendre compte"], ["h", "3) Persuader les autres"], ["h", "2 Corinthiens 5.9-11 (ESV, traduction libre)"], ["p", "« Aussi, que nous soyons chez nous ou en exil, nous nous faisons un point d’honneur de lui plaire. Car nous devons tous comparaître devant le tribunal de Christ, afin que chacun reçoive ce qui lui est dû pour ce qu’il a fait dans son corps, soit en bien, soit en mal. Connaissant donc la crainte du Seigneur, nous persuadons les autres. »"], ["h", "Idées clés"], ["h", "Partie 1 : But"], ["p", "Notre but est de plaire à Dieu : dans cette vie comme dans la suivante, notre objectif premier est de vivre d’une manière qui plaît à Dieu."], ["h", "Partie 2 : Responsabilité"], ["p", "Notre rendez-vous avec Dieu : nous reconnaissons que chaque personne se tiendra un jour devant le tribunal de Christ pour rendre compte de ses actes."], ["h", "Partie 3 : Action"], ["p", "Notre motivation pour persuader les autres : la crainte du Seigneur est le fondement de la sagesse qui oriente notre cœur dans l’amour, nous donnant le pouvoir de faire des disciples qui connaissent et partagent l’amour de Dieu qui transforme les vies."], ["h", "Partie 1 : Plaire à Dieu"], ["h", "2 Corinthiens 5.9-11 (ESV, traduction libre)"], ["p", "« Aussi, que nous soyons chez nous ou en exil, nous nous faisons un point d’honneur de lui plaire. Car nous devons tous comparaître devant le tribunal de Christ, afin que chacun reçoive ce qui lui est dû pour ce qu’il a fait dans son corps, soit en bien, soit en mal. Connaissant donc la crainte du Seigneur, nous persuadons les autres. »"], ["p", "La mission de notre vie peut se résumer dans ce passage : vivre d’une manière qui plaît à Dieu, sachant qu’un jour nous rendrons compte, et aider les autres à faire de même. Paul nous rappelle que le but central de la vie de tout croyant est de plaire à Dieu. Il ne s’agit pas de gagner son amour, mais d’y répondre. Nous plaisons à Dieu en passant du temps en sa présence, en discernant sa voix et en laissant sa Parole façonner nos désirs."], ["h", "Matthieu 25.21 – La parabole des talents"], ["p", "La parabole des talents illustre profondément la façon dont notre perception du caractère de Dieu dicte directement notre niveau de fidélité et d’action. Elle révèle que la véritable intendance ne tient pas seulement à l’effort, mais à un cœur aligné sur la nature et la mission du Maître. En examinant les réactions différentes des trois serviteurs, nous voyons que si une sagesse empreinte de révérence mène à la multiplication, un manque de compréhension mène inévitablement à la paralysie."], ["p", "« Il en sera comme d’un homme qui, partant en voyage, appela ses serviteurs et leur confia ses biens. Il donna cinq talents à l’un, deux à un autre, un à un troisième, à chacun selon sa capacité. Puis il partit. Celui qui avait reçu les cinq talents s’en alla aussitôt les faire valoir, et il gagna cinq autres talents. De même, celui qui avait reçu les deux talents en gagna deux autres. Mais celui qui avait reçu un seul talent alla creuser un trou dans la terre et cacha l’argent de son maître."], ["p", "Longtemps après, le maître de ces serviteurs revint et leur demanda des comptes. Celui qui avait reçu les cinq talents s’avança, apportant cinq autres talents, et dit : “Maître, tu m’as remis cinq talents ; voici, j’ai gagné cinq autres talents.” Son maître lui dit : “C’est bien, bon et fidèle serviteur. Tu as été fidèle en peu de chose ; je t’établirai sur beaucoup. Entre dans la joie de ton maître.” Celui qui avait reçu les deux talents s’avança aussi et dit : “Maître, tu m’as remis deux talents ; voici, j’ai gagné deux autres talents.” Son maître lui dit : “C’est bien, bon et fidèle serviteur. Tu as été fidèle en peu de chose ; je t’établirai sur beaucoup. Entre dans la joie de ton maître.”"], ["p", "Celui qui avait reçu un seul talent s’avança aussi et dit : “Maître, je savais que tu es un homme dur, qui moissonnes où tu n’as pas semé et qui ramasses où tu n’as pas répandu de semence ; alors j’ai eu peur, et je suis allé cacher ton talent dans la terre. Voici, tu as ce qui t’appartient.” Mais son maître lui répondit : “Serviteur méchant et paresseux ! Tu savais que je moissonne où je n’ai pas semé et que je ramasse où je n’ai pas répandu de semence ? Tu aurais donc dû placer mon argent chez les banquiers, et à mon retour j’aurais retiré ce qui m’appartient avec un intérêt. Ôtez-lui donc le talent et donnez-le à celui qui a les dix talents. Car on donnera à celui qui a, et il aura en abondance ; mais à celui qui n’a pas, même ce qu’il a lui sera enlevé. Et ce serviteur inutile, jetez-le dans les ténèbres du dehors. Là il y aura des pleurs et des grincements de dents.” »"], ["h", "Travailler dans la joie"], ["p", "Les deux premiers serviteurs ont agi parce qu’ils connaissaient vraiment le caractère de leur maître et sa capacité à les inviter à entrer dans sa joie. Ils comprenaient la puissance du maître, mais aussi sa nature d’amour et de justice. Cette connaissance leur a donné la confiance de faire fructifier et multiplier leurs talents, voyant leur travail comme un partenariat dans son royaume."], ["h", "La paralysie d’une idée fausse"], ["p", "Le troisième serviteur a fondamentalement mal compris les actions de son maître, ne le voyant que comme un homme dur et exigeant. Cette incompréhension l’a poussé à agir par crainte plutôt que par désir de plaire. Parce qu’il n’a pas vu le cœur du maître, son potentiel d’intendance a été remplacé par un réflexe de protection : cacher ce qui lui avait été confié."], ["h", "Le fruit de la sagesse et de la connaissance"], ["p", "L’Écriture enseigne que la crainte du Seigneur est le commencement de la sagesse comme de la connaissance ; les deux premiers serviteurs ont agi selon cette connaissance vraie, et leur intendance reposait sur la confiance. Le troisième serviteur manquait de cette sagesse et a agi par peur, ce qui a conduit à la paralysie et à la crainte. Nos actions sont toujours le fruit de ce que nous croyons : si nous connaissons Dieu, nous sommes motivés par l’amour ; si nous ne le connaissons pas, nous sommes motivés par la peur."], ["img", "chart.png"], ["h", "Partie 2 : Rendre compte"], ["h", "2 Corinthiens 5.9-11 (ESV, traduction libre)"], ["p", "« Aussi, que nous soyons chez nous ou en exil, nous nous faisons un point d’honneur de lui plaire. Car nous devons tous comparaître devant le tribunal de Christ, afin que chacun reçoive ce qui lui est dû pour ce qu’il a fait dans son corps, soit en bien, soit en mal. Connaissant donc la crainte du Seigneur, nous persuadons les autres. »"], ["h", "Notre rendez-vous divin"], ["p", "Tout au long de la Bible, il nous est rappelé que chaque vie humaine mène vers un moment unique et certain : un rendez-vous divin pour nous tenir devant notre Créateur. L’Écriture le dit clairement en de nombreux endroits. Des enseignements de Jésus dans les Évangiles aux lettres des apôtres, nous voyons qu’un jour nous rendrons compte de la façon dont nous avons vécu la vie qui nous a été donnée. Cette réalité n’est pas une source de crainte, mais une boussole quotidienne pour notre cœur. Nous vivons conscients que nous nous tiendrons un jour devant Celui qui nous a insufflé la vie, nous a confié des talents uniques et nous a aimés assez pour donner son Fils afin d’assurer notre éternité."], ["p", "En plus de notre passage clé, nous lisons en Romains 14.10, 12 : « …Car nous comparaîtrons tous devant le tribunal de Dieu… Ainsi chacun de nous rendra compte de lui-même à Dieu. » Hébreux 9.27 nous rappelle que ce jugement est un rendez-vous fixé qui suit notre passage sur la terre : « Et comme il est réservé aux hommes de mourir une seule fois, après quoi vient le jugement… » Même nos paroles comptent, comme l’avertit Matthieu 12.36 : « Je vous le dis, au jour du jugement, les hommes rendront compte de toute parole inutile qu’ils auront dite… »"], ["h", "Partie 3 : Persuader les autres"], ["h", "2 Corinthiens 5.9-11 (ESV, traduction libre)"], ["p", "« Aussi, que nous soyons chez nous ou en exil, nous nous faisons un point d’honneur de lui plaire. Car nous devons tous comparaître devant le tribunal de Christ, afin que chacun reçoive ce qui lui est dû pour ce qu’il a fait dans son corps, soit en bien, soit en mal. Connaissant donc la crainte du Seigneur, nous persuadons les autres. »"], ["h", "Comprendre la crainte de Dieu"], ["li", "Proverbes 1.7 – « La crainte du Seigneur est le commencement de la connaissance ; les insensés méprisent la sagesse et l’instruction. »"], ["li", "La vraie compréhension commence quand nous reconnaissons l’autorité de Dieu sur notre vie plutôt que de nous appuyer sur notre propre perspective limitée."], ["li", "Psaume 111.10 – « La crainte du Seigneur est le commencement de la sagesse ; tous ceux qui la pratiquent ont une bonne intelligence. Sa louange subsiste à jamais ! »"], ["li", "La sagesse se trouve dans la pratique active qui honore Dieu, ce qui mène à une vie de clarté et de louange durable."], ["li", "Proverbes 8.13 – « La crainte du Seigneur, c’est la haine du mal. L’orgueil et l’arrogance, la voie du mal et la bouche perverse, je les hais. »"], ["li", "Un cœur qui révère vraiment Dieu se trouvera naturellement en opposition à l’orgueil, à l’arrogance et à tout ce qui contredit son caractère."], ["h", "Poussés par l’amour à aimer"], ["p", "L’amour de Dieu nous pousse à aimer les autres. Pourtant, une sainte crainte, qui est la révérence devant la puissance de Dieu, nous conduit à vivre dans l’obéissance et la mission. Respecter son autorité, c’est appliquer sa vérité pour sa gloire."], ["h", "Cette révérence éclaire son caractère :"], ["li", "La promesse de l’amour : sa puissance s’accorde à son cœur. Nous nous reposons dans son amour inébranlable."], ["li", "L’assurance de la provision : sa puissance garantit qu’il pourvoira à nos besoins quotidiens."], ["p", "Marcher dans la révérence invite les autres à entrer dans cette vie sûre."], ["h", "Le fruit de la sainte crainte"], ["p", "La crainte de Dieu commence notre cheminement vers la sagesse, mais nous sommes en définitive poussés par l’amour à aimer les autres. Dans la parabole des talents, les serviteurs savaient que le propriétaire reviendrait. Pour deux d’entre eux, cette saine révérence a suscité une intendance fidèle, tandis que le troisième a été paralysé par une idée fausse. Dieu nous confie avec douceur des dons et des ressources à partager avec notre communauté. La sainte crainte n’est pas la peur de la mort, mais une motivation tendre à marcher dans l’obéissance vers une vie en Christ. Quand l’amour nous pousse à prendre soin des autres, notre responsabilité devient un témoignage convaincant. Le vrai fruit de la révérence est simplement de multiplier ses bénédictions afin d’aimer le monde qui nous entoure."]], "q": [["Quelles sont les trois idées clés de 2 Corinthiens 5.9-11 ?", "Voir « Idées clés » sous le passage.", 6], ["Décrivez l’action et la récompense de chacun des trois serviteurs dans la parabole des talents.", "Regardez la section sur Matthieu 25.", 17], ["Que signifie le fait qu’un jour nous rendrons compte de la vie que nous avons vécue ?", "Voir « Notre rendez-vous divin ».", 32], ["Écrivez votre meilleure définition de la crainte du Seigneur.", "Voir « Comprendre la crainte de Dieu ».", 38], ["Comment devons-nous nous préparer à notre rendez-vous avec Dieu ?", "Voir « Partie 1 : Plaire à Dieu ».", 13]]}, {"id": "s2", "k": "Section 2", "t": "Établir le rythme : Parole, prière et adoration", "b": [["h", "Aperçu de la section :"], ["h", "1) Parole quotidienne : engager notre intelligence et notre cœur"], ["h", "2) Prière quotidienne : être à l’écoute de Dieu"], ["h", "3) Adoration quotidienne : l’amour en action"], ["h", "Donner la priorité au temps quotidien avec Dieu"], ["p", "Le temps de recueillement personnel quotidien avec Dieu est l’habitude essentielle qui nous permet de demeurer en Christ. Établir un rythme quotidien de Parole, de prière et d’adoration synchronise notre vie avec les battements du cœur de Dieu. Le changement est inévitable ; demeurer en Christ garantit que le moteur de ce changement vienne de notre relation avec Dieu et non de notre proximité avec le monde. Prendre du temps pour Dieu, c’est prier « Me voici » et nous rendre disponibles pour agir selon sa réponse."], ["p", "En établissant un rythme régulier de Parole, de prière et d’adoration, nous créons l’espace nécessaire pour que Dieu transforme notre cœur et dirige nos pas. Ce rythme quotidien est bien plus qu’une discipline spirituelle ; c’est notre amour pour Dieu en action. C’est le battement vital de l’intimité avec le Père. Sans ce rythme, il nous manque une relation fonctionnelle avec Dieu, et sans cette relation, nous restons perdus dans le monde, à la dérive loin de son amour, de son autorité et de sa direction."], ["h", "1) Parole quotidienne : engager notre intelligence et notre cœur"], ["p", "La Bible confronte notre intelligence à la vérité immuable qui interpelle notre cœur égoïste. L’Écriture est utile pour enseigner, pour convaincre, pour corriger et pour instruire dans la justice. Le temps passé à lire la Parole de Dieu est une rencontre sainte avec lui."], ["h", "L’autorité de Dieu"], ["p", "2 Timothée 3.16 : « Toute l’Écriture est inspirée de Dieu et utile pour enseigner, pour convaincre, pour corriger et pour instruire dans la justice. »"], ["p", "L’Écriture est littéralement le souffle de Dieu. Parce qu’elle est soufflée par le Père, elle porte le poids de son autorité. En la lisant, nous nous rendons disponibles à Celui qui insuffle la vie dans notre âme. Ce souffle est profitable : il nous enseigne la vérité et corrige notre dérive, nous assurant d’être formés et prêts pour les missions qu’il a pour nous."], ["h", "La direction de Dieu"], ["p", "Psaume 119.105 : « Ta parole est une lampe à mes pieds, et une lumière sur mon sentier. »"], ["p", "La Parole est notre lampe. Elle donne la clarté immédiate nécessaire pour notre prochain pas tout en éclairant la vision à long terme de notre parcours à travers les quatre fondements. Sans cette lumière, nous marchons dans les ténèbres, mais avec elle, nous avons la direction nécessaire pour rester dans la cible. Elle fait en sorte que, lorsque nous disons « Me voici », nous puissions réellement voir où le Père nous conduit."], ["h", "Le discernement de Dieu"], ["p", "Hébreux 4.12 « Car la parole de Dieu est vivante et efficace, plus tranchante qu’aucune épée à deux tranchants, pénétrante jusqu’à partager âme et esprit, jointures et moelle, et elle juge les sentiments et les pensées du cœur. »"], ["p", "L’Écriture est une arme vivante à deux tranchants qui perce la tromperie de l’ennemi et la confusion du monde, apportant clarté, conviction et but. Comme le décrit Hébreux 4.12, la Parole de Dieu est assez tranchante pour pénétrer jusqu’à partager l’âme et l’esprit, et atteindre les pensées et les intentions du cœur."], ["p", "Quand nous donnons la priorité au temps quotidien dans la Parole, nous nous ancrons dans la vérité immuable, ce qui nous rend capables de demeurer dans la puissance transformatrice du Saint-Esprit. La lecture quotidienne de la Bible réaligne notre perspective limitée sur l’immensité de la sagesse de Dieu, transformant notre confusion en conviction et notre hésitation en sainte assurance. En établissant ce rythme, notre cœur apprend à ne plus réagir au monde, mais à répondre à la conduite du Père."], ["h", "2) Prière quotidienne : être à l’écoute de Dieu"], ["p", "Lorsque la Parole de Dieu nous confronte, nous sommes naturellement poussés à aller à lui dans la prière. La prière engage notre cœur. Une prière réussie ne consiste pas à forcer notre entrée dans les cieux ni à apporter au trône une liste de revendications. La vraie prière est un exercice d’écoute."], ["p", "1 Thessaloniciens 5.17 « Soyez toujours joyeux, priez sans cesse, rendez grâces en toutes choses, car c’est à votre égard la volonté de Dieu en Jésus-Christ. »"], ["p", "Bien que nous puissions utiliser la structure du Notre Père ou d’autres passages de l’Écriture pour centrer notre cœur, le but ultime est d’entendre la voix douce et subtile de Dieu. Nous n’apportons pas un programme à Dieu ; nous attendons le sien pour nous. Comme Abraham, nous devons cultiver un silence qui nous permet d’entendre l’appel du Maître, remplaçant notre anxiété par une paix qui ne peut venir que du réconfort de sa voix."], ["p", "L’Écriture regorge d’exemples de la façon dont la prière nous transforme. Nous sommes appelés à prier sans cesse, un rythme spirituel qui accorde continuellement nos oreilles au son distinct de la voix du Père au milieu du bruit du monde."], ["h", "Réconciliation avec Dieu et les uns avec les autres"], ["p", "La prière est le milieu où nous recevons la force de pardonner, afin de rester en communion avec Dieu et dans son pardon."], ["p", "Marc 11.25 : « Et, lorsque vous êtes debout pour prier, si vous avez quelque chose contre quelqu’un, pardonnez, afin que votre Père qui est dans les cieux vous pardonne aussi vos offenses. »"], ["h", "La prière apporte la paix"], ["p", "La prière nous permet de remettre nos soucis à Dieu, ce qui produit une paix qui surpasse l’intelligence humaine."], ["p", "Philippiens 4.6-7 : « Ne vous inquiétez de rien ; mais en toute chose, par la prière et la supplication, avec des actions de grâces, faites connaître vos demandes à Dieu. Et la paix de Dieu, qui surpasse toute intelligence, gardera vos cœurs et vos pensées en Jésus-Christ. »"], ["h", "Force et renouvellement"], ["p", "La prière régulière donne la force spirituelle nécessaire pour traverser les épreuves et renouveler notre esprit intérieur."], ["p", "Ésaïe 40.31 : « Mais ceux qui se confient en l’Éternel renouvellent leur force ; ils prennent le vol comme les aigles ; ils courent et ne se lassent point, ils marchent et ne se fatiguent point. »"], ["h", "Sagesse et conduite :"], ["p", "Face à des décisions difficiles, la prière est le moyen par lequel nous demandons et recevons la sagesse divine. --- Jacques 1.5 : « Si quelqu’un d’entre vous manque de sagesse, qu’il la demande à Dieu, qui donne à tous généreusement et sans reproche, et elle lui sera donnée. »"], ["p", "Pardon et guérison : la prière est la porte par laquelle nous confessons nos manquements et recevons la restauration de Dieu ainsi que la guérison physique ou émotionnelle. --- 1 Jean 1.9 : « Si nous confessons nos péchés, il est fidèle et juste pour nous pardonner nos péchés et nous purifier de toute iniquité. » --- Jacques 5.16 : « Confessez donc vos péchés les uns aux autres, et priez les uns pour les autres, afin que vous soyez guéris. La prière fervente du juste a une grande efficacité. »"], ["h", "Intimité avec Dieu :"], ["p", "L’un des principaux bienfaits de la prière est le développement d’une relation personnelle et proche avec le Père. --- Psaume 145.18 : « L’Éternel est près de tous ceux qui l’invoquent, de tous ceux qui l’invoquent avec sincérité. »"], ["h", "Protection contre la tentation :"], ["p", "La prière sert d’outil de défense, nous aidant à rester vigilants et fortifiant notre détermination face aux pièges spirituels. --- Matthieu 26.41 : « Veillez et priez, afin que vous ne tombiez pas dans la tentation ; l’esprit est bien disposé, mais la cha
