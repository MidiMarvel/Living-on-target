<!DOCTYPE html>

<style>
:root{--bg:#f4f4f4;--card:#fff;--ink:#3b3b3b;--mute:#6a6d70;--line:#d1d3d4;--acc:#e0583f;--soft:#fdeae6;--btn:#3b3b3b;--btnt:#fff;--fs:16px;--rose:#F37760;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#262626;--card:#303030;--ink:#f1f1f1;--mute:#b0b3b5;--line:#4a4a4a;--acc:#f2705a;--soft:#3d2b27;--btn:#f2705a;--btnt:#262626;--rose:#F37760;color-scheme:dark}}
*{box-sizing:border-box}
/* Free Netlify plans add a floating 'Powered by Netlify' badge at the bottom right; leave room so it never covers the buttons. */
body.nbdg{padding-bottom:58px}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--card);color:var(--ink);font:400 var(--fs)/1.7 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{flex:none;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;background:var(--card);border-bottom:3px solid var(--acc)}
header a.lg{display:block;line-height:0;margin-right:auto;min-width:0;text-decoration:none;color:inherit}
.logo{height:58px;width:auto;display:block;max-width:100%}
.srow select{display:block;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 12px}
.ttl{display:block;margin-top:5px;font:600 12.5px/1.2 Montserrat,system-ui,sans-serif;letter-spacing:.02em;color:var(--mute)}
.hb{font:600 14px Montserrat,system-ui,sans-serif;min-width:42px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.hb.big{font-size:19px}
.tb{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb>*{flex:none}
.chip{height:40px;font:600 .82rem/1 Montserrat,system-ui,sans-serif;font-size:13px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px)}
.badge{min-width:20px;height:20px;margin:-4px 0;border-radius:10px;background:var(--acc);color:var(--btnt);font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--card);perspective:1800px}
.book{position:absolute;inset:0;overflow:hidden;background:var(--card)}
.leaf{transform-origin:left center;-webkit-backface-visibility:hidden;backface-visibility:hidden;z-index:6;box-shadow:8px 0 26px rgba(0,0,0,.28)}
#cols{position:absolute}
#cols h1{padding-right:32px;font-size:1.55em;line-height:1.25;margin:.1em 0 .5em;font-weight:700;break-after:avoid;-webkit-column-break-after:avoid}
#cols h2{font-size:1.12em;line-height:1.35;margin:1.1em 0 .2em;font-weight:600;break-after:avoid;-webkit-column-break-after:avoid}
#cols h2:first-child{margin-top:0}
#cols p{margin:.5em 0;orphans:2;widows:2}
#cols p.k{color:var(--acc);font-weight:600;font-size:.875em;margin:0}
#cols ul{padding-left:1.3em;margin:.5em 0}
#cols li{margin:.35em 0}
.fig{display:block;width:100%;height:auto;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;margin:.8em 0;break-inside:avoid;-webkit-column-break-inside:avoid}
.rd{background:var(--soft);border-radius:6px;box-shadow:0 0 0 5px var(--soft)}
.panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);padding:20px 20px 40px}
.panel#qpanel{padding-top:46px}.panel .in{max-width:640px;margin:0 auto}
h1.t{font-size:1.55em;line-height:1.25;margin:.1em 0 .4em}
h2.t{font-size:1.12em;margin:1.2em 0 .3em}
.k{color:var(--acc);font-weight:600;font-size:.875em;margin:0}
.sub{color:var(--mute);margin:.2em 0 .8em}
.cnt{color:var(--mute);font-size:.875em;margin:.2em 0}
#rib{position:absolute;top:2px;right:10px;z-index:8;width:44px;height:38px;border:0;background:none;color:var(--mute);padding:0}
#rib svg{width:22px;height:30px;display:block;margin:0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
#rib.on{color:var(--acc)}#rib.on svg{fill:var(--acc)}
#nav{flex:none;display:flex;align-items:stretch;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.nb{flex:1;padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.94em;min-height:48px}
.nb.go{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.nb:disabled{opacity:.4}
.mid{flex:1.5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.mid .row{display:flex;gap:6px}
.sm{font-size:.82em;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--btn);background:var(--btn);color:var(--btnt)}
.sm.o{background:var(--card);color:var(--ink);border-color:var(--line)}
#pgl{font-size:.75em;color:var(--mute);white-space:nowrap}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;color:inherit;text-decoration:none;text-align:left;width:100%}
.card b{display:block;font-size:1.04em}.card span{color:var(--mute);font-size:.875em}
.card.done{border-color:var(--acc)}
.card.big{padding:18px}
.primary{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--btn);background:var(--btn);color:var(--btnt);font-weight:600}
.primary:disabled{opacity:.5}
.ghost{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.9em}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.q b{display:block;font-weight:600}.q em{display:block;color:var(--mute);font-size:.8em;font-style:normal;margin:4px 0 8px}
textarea,input[type=text],input[type=email],select.f{width:100%;font-size:max(16px,1em);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.85em;font-weight:600;margin:12px 0 4px}
.cb,.sb{font-weight:600;font-size:.9em;padding:9px 16px;border-radius:999px}
.cb{border:1px solid var(--acc);background:transparent;color:var(--acc);margin-top:10px}
.sb{border:1px solid var(--btn);background:var(--btn);color:var(--btnt)}
.bub{max-width:92%;padding:10px 14px;border-radius:16px;margin:8px 0;white-space:pre-wrap;font-size:.95em;line-height:1.55}
.bub.ai{background:var(--soft);border-bottom-left-radius:4px}
.bub.me{background:var(--btn);color:var(--btnt);margin-left:auto;border-bottom-right-radius:4px}
.rep{display:flex;gap:8px;margin-top:6px}.rep input{flex:1;min-width:0;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:9px 14px;font-size:max(16px,1em)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0}
.seg button{flex:1;padding:12px 8px;border:0;background:var(--card);font-weight:600;font-size:.9em}
.seg button.on{background:var(--btn);color:var(--btnt)}
.share{border-top:3px solid var(--acc);margin-top:28px;padding-top:6px}
.note{color:var(--mute);font-size:.82em;margin:.6em 0}
.ok{color:var(--acc);font-weight:600}
.pop{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:62vh;overflow:auto;min-width:240px;max-width:calc(100vw - 16px);padding:6px}
.pi{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;font-size:.9rem;font-size:14px;border-radius:8px;text-decoration:none;color:var(--ink);line-height:1.35}
.pi:active,.pi:hover{background:var(--soft)}
.pi.sub{padding-left:28px;color:var(--mute)}
.pop select{width:100%;margin:4px 0 10px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.pop label{margin:6px 8px 0}
.pop .pad{padding:4px 8px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90vw}
.who{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}.dot.on{background:#2e9e5b}
.code{font:700 1.9em/1.2 ui-monospace,Menlo,monospace;letter-spacing:.15em;text-align:center;border:2px dashed var(--acc);border-radius:12px;padding:14px;margin:12px 0;user-select:all}
.hero{height:84px;width:auto;display:block;margin:4px 0 14px}
.pi.ppart,.card.ppart{background:linear-gradient(90deg,rgba(243,119,96,.38) var(--p),transparent var(--p))}
.pi.pdone,.card.pdone{background:var(--rose);color:#2a2a2a;border-color:var(--rose)}
.pi.pdone span,.card.pdone span{color:#3a3a3a}
.pi.pdone::after{content:'\2713';float:right;font-weight:700}
.card.pdone b::after{content:' \2713'}
.pl{margin:8px 12px 2px;font-size:.75em;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.pi .badge{margin-left:6px}
.pisub{display:block;font-size:.78em;color:var(--mute);margin-top:2px}
.panel.chatmode{overflow:hidden;padding-bottom:10px}
.chatwrap{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
.cmsgs{flex:1;overflow-y:auto;padding:6px 2px;-webkit-overflow-scrolling:touch;min-height:0}
.cm{margin:10px 0}.cm.me{text-align:right}
.cmeta{font-size:.78em;color:var(--mute);margin:0 4px 3px}
.cm .bub{display:inline-block;text-align:left;margin:0;max-width:88%}
.bub.oth{background:var(--soft);border-bottom-left-radius:4px}
.cdel{background:none;border:0;color:var(--mute);font-size:.75em;text-decoration:underline;padding:4px 6px}
.cgone{color:var(--mute);font-style:italic;font-size:.82em;text-align:center;margin:8px 0}
.ccomp{display:flex;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid var(--line)}
.ccomp textarea{flex:1;margin:0;min-height:48px;resize:none}
.ccomp .primary{width:auto;padding:13px 18px}
.vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:10px 0}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
video.vv{display:block;width:100%;max-height:72vh;background:#000;border-radius:12px;margin:10px 0}
.vcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}.vcard b{display:block}.vcard p{margin:.5em 0}
.hl{color:var(--acc);text-decoration:underline;text-underline-offset:2px;font-weight:600}
.fl{margin:.3em 0 0;padding-left:1.2em}.fl li{margin:.45em 0}
.srow{border-top:1px solid var(--line);padding:12px 0}.srow b{display:block}
.danger{border-color:#c0392b;color:#c0392b}
.tag{font-size:.68em;font-weight:700;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>
if(/\.netlify\.app$/i.test(location.hostname))document.body.classList.add('nbdg');
const DATA={"en": [{"id": "intro", "k": "Welcome", "t": "Living On Target Discipleship Training", "b": [["p", "Our goal is that every attendee will be engaged in the work of the heart to be and make disciples! This training will equip church members and leaders to become disciples of Christ who make disciples who love and serve Christ, home, church, and the world."], ["h", "The material is divided into four sections:"], ["h", "Section 1: Our Appointment With God"], ["p", "We all have an appointment with God where we will give an account of what we have done in this life. We prepare for that appointment by living a life that pleases God and persuading others to do the same."], ["h", "Section 2: Establishing The Rhythm of Word, Prayer, and Worship"], ["p", "Living a life that pleases God requires an intimate relationship with Him. It is sustained through a daily rhythm of Word, Prayer, and Worship. This rhythm keeps our hearts aligned with God and our lives focused on His purpose."], ["h", "Section 3: Being and Making Disciples"], ["p", "Discipleship begins with the posture “Here I am.” A disciple learns to respond to God, to spiritual leadership, and to life’s circumstances with humility and faith. As this posture matures, disciples intentionally pursue others so that God’s work multiplies through them."], ["h", "Section 4: Loving and Serving Christ, Home, Church, and the World"], ["p", "A disciple’s life is driven by love and expressed through service. This section explores four foundations of spiritual influence: Christ, Home, Church, and World. Each level depends on the strength of the one beneath it. A strong walk with Christ produces healthy homes, strong churches, and a powerful witness to the world."], ["p", "Together, these sections move us from the noise of everyday life into a life of listening, obedience, and fruitfulness. The goal of the discipleship lifestyle is simple: remain connected to Christ so that our lives naturally bear fruit for His glory."]], "q": []}, {"id": "s1", "k": "Section 1", "t": "Our Appointment With God", "b": [["h", "Section Overview:"], ["h", "1) Pleasing God"], ["h", "2) Giving An Account"], ["h", "3) Persuading Others"], ["h", "2 Corinthians 5:9–11 (ESV)"], ["p", "“So whether we are at home or away, we make it our aim to please him. For we must all appear before the judgment seat of Christ, so that each one may receive what is due for what he has done in the body, whether good or evil. Therefore, knowing the fear of the Lord, we persuade others.”"], ["h", "Key Ideas"], ["h", "Part 1: Aim"], ["p", "Our Aim Is To Please God: Whether in this life or the next, our primary goal is to live in a way that is pleasing to God."], ["h", "Part 2: Accountability"], ["p", "Our Appointment With God: We recognize that every person will eventually stand before the judgment seat of Christ to give an account for their actions."], ["h", "Part 3: Action"], ["p", "Our Motivation to Persuade Others: The fear of the Lord is the foundation of wisdom that directs our hearts in love, empowering us to make disciples who know and share the life-changing love of God."], ["h", "Part 1: Pleasing God"], ["h", "2 Corinthians 5:9–11 (ESV)"], ["p", "“So whether we are at home or away, we make it our aim to please him. For we must all appear before the judgment seat of Christ, so that each one may receive what is due for what he has done in the body, whether good or evil. Therefore, knowing the fear of the Lord, we persuade others.”"], ["p", "Our life mission can be summarized in this passage: to live in a way that pleases God, knowing we will one day give an account, and to help others do the same. Paul reminds us that the central aim of every believer’s life is to please God. This is not about earning His love but responding to it. We please God by spending time in His presence, discerning His voice, and allowing His Word to shape our desires."], ["h", "Matthew 25:21 - The Parable of the Talent"], ["p", "The Parable of the Talents serves as a profound illustration of how our perception of God’s character directly dictates our level of faithfulness and action. It reveals that true stewardship is not merely about effort, but about a heart aligned with the Master’s nature and mission. By examining the three servants' different responses, we can see that while reverent wisdom leads to multiplication, a lack of understanding inevitably leads to paralysis."], ["p", "“For it will be like a man going on a journey, who called his servants and entrusted to them his property. To one he gave five talents, to another two, to another one, to each according to his ability. Then he went away. He who had received the five talents went at once and traded with them, and he made five talents more. So also he who had received the two talents made two talents more. But he who had received the one talent went and dug in the ground and hid his master's money."], ["p", "Now after a long time the master of those servants came and settled accounts with them. And he who had received the five talents came forward, bringing five talents more, saying, ‘Master, you delivered to me five talents; here, I have made five talents more.’ His master said to him, ‘Well done, good and faithful servant. You have been faithful over a little; I will set you over much. Enter into the joy of your master.’ And he also who had received the two talents came forward, saying, ‘Master, you delivered to me two talents; here, I have made two talents more.’ His master said to him, ‘Well done, good and faithful servant. You have been faithful over a little; I will set you over much. Enter into the joy of your master.’"], ["p", "He also who had received the one talent came forward, saying, ‘Master, I knew you to be a hard man, reaping where you did not sow, and gathering where you scattered no seed, so I was afraid, and I went and hid your talent in the ground. Here, you have what is yours.’ But his master answered him, ‘You wicked and slothful servant! You knew that I reap where I have not sown and gather where I scattered no seed? Then you ought to have invested my money with the bankers, and at my coming I should have received what was my own with interest. So take the talent from him and give it to him who has the ten talents. For to everyone who has will more be given, and he will have an abundance. But from the one who has not, even what he has will be taken away. And cast the worthless servant into the outer darkness. In that place there will be weeping and gnashing of teeth.’”"], ["h", "Laboring in Joy"], ["p", "The first two servants acted because they truly knew their master's character and his capacity to invite them into his joy. They understood the power the master held, but they also deeply understood his nature for love and justice. This knowledge gave them the confidence to trade and multiply their talents, viewing their work as a partnership in his kingdom."], ["h", "The Paralysis of Misconception"], ["p", "The third servant fundamentally misunderstood his master's actions, viewing him only as a hard and demanding man. This misunderstanding led him to act out of dread rather than a desire to please. Because he failed to see the master's heart, his potential for stewardship was replaced by a self-protective urge to hide what he had been given."], ["h", "The Fruit of Wisdom and Knowledge"], ["p", "Scripture teaches that the fear of the Lord is the beginning of both wisdom and knowledge; the first two servants acted on this true knowledge, and their stewardship was based on trust. The third servant lacked this wisdom and acted out of fear, which led to paralysis and fear. Our actions are always the fruit of our belief: if we know God, we are motivated by love; if we do not know him, we are motivated by fear."], ["img", "chart.png"], ["h", "Part 2: Giving An Account"], ["h", "2 Corinthians 5:9–11 (ESV)"], ["p", "“So whether we are at home or away, we make it our aim to please him. For we must all appear before the judgment seat of Christ, so that each one may receive what is due for what he has done in the body, whether good or evil. Therefore, knowing the fear of the Lord, we persuade others.”"], ["h", "Our Divine Appointment"], ["p", "Throughout the Bible, we are reminded that every human life is leading toward a single, certain moment: a divine appointment to stand before our Creator. Scripture makes it clear in multiple places. From the teachings of Jesus in the Gospels to the letters of the apostles, we see that we will one day give an account of how we lived the life we were given. This reality is not a source of dread but a daily compass for our hearts. We live mindful that we will one day stand before the One who breathed life into us, entrusted us with unique talents, and loved us enough to give His Son to secure our eternity."], ["p", "In addition to our key passage, we see in Romans 14:10, 12, \"...For we will all stand before the judgment seat of God... So then each of us will give an account of himself to God.\" Hebrews 9:27 reminds us that this judgment is a fixed appointment that follows our time on earth: \"And just as it is appointed for man to die once, and after that comes judgment...\" Even our words are significant, as Matthew 12:36 warns, \"I tell you, on the day of judgment people will give account for every careless word they speak...\""], ["h", "Part 3: Persuading Others"], ["h", "2 Corinthians 5:9–11 (ESV)"], ["p", "“So whether we are at home or away, we make it our aim to please him. For we must all appear before the judgment seat of Christ, so that each one may receive what is due for what he has done in the body, whether good or evil. Therefore, knowing the fear of the Lord, we persuade others.”"], ["h", "Understanding the Fear of God"], ["li", "Proverbs 1:7 – \"The fear of the Lord is the beginning of knowledge; fools despise wisdom and instruction.\""], ["li", "True understanding starts when we acknowledge God’s authority over our lives rather than relying on our own limited perspective."], ["li", "Psalm 111:10 – \"The fear of the Lord is the beginning of wisdom; all those who practice it have a good understanding. His praise endures forever!\""], ["li", "Wisdom is found in the active practice of honoring God, which leads to a life of clarity and lasting praise."], ["li", "Proverbs 8:13 – “The fear of the Lord is hatred of evil. Pride and arrogance and the way of evil and perverted speech I hate.”"], ["li", "A heart that truly reveres God will naturally find itself in opposition to pride, arrogance, and everything that contradicts His character."], ["h", "Compelled By Love To Love"], ["p", "We are compelled by God’s love to love others. Yet, a holy fear, which is reverence for God’s power, drives us to live obediently on mission. Respecting His authority means applying His truth for His glory."], ["h", "This reverence clarifies His character:"], ["li", "The Promise of Love: His power aligns with His heart. We rest in His unwavering love."], ["li", "The Assurance of Provision: His power guarantees He will supply our daily needs."], ["p", "Walking in reverence invites others into this secure life."], ["h", "The Fruit of Holy Fear"], ["p", "The fear of God begins our journey toward wisdom, but we are ultimately compelled by love to love others. In the Parable of the Talents, the servants knew the owner would return. For two, this healthy reverence sparked faithful stewardship, while the third was paralyzed by misconception. God gently entrusts us with gifts and resources to share with our community. Holy fear is not fear of death, but rather a tender motivation to walk in obedience towards a life in Christ. When we are compelled by love to care for others, our responsibility becomes a compelling witness. The true fruit of reverence is simply multiplying His blessings so we can love the world around us."]], "q": [["What are the three key ideas in 2 Corinthians 5:9–11?", "See “Key Ideas” under the passage.", 6], ["Describe the action and the reward of each of the three servants in the parable of the talents.", "Look at the Matthew 25 section.", 17], ["What does it mean that we will one day give an account for the life we lived?", "See “Our Divine Appointment.”", 32], ["Write your best definition of the fear of the Lord.", "See “Understanding the Fear of God.”", 38], ["How should we prepare for our appointment with God?", "See “Part 1: Pleasing God.”", 13]]}, {"id": "s2", "k": "Section 2", "t": "Establish the Rhythm: Word, Prayer, and Worship", "b": [["h", "Section Overview:"], ["h", "1) Daily Word: Engaging Our Mind and Our Heart"], ["h", "2) Daily Prayer: Listening For God"], ["h", "3) Daily Worship: Love In Action"], ["h", "Prioritizing Daily Time With God"], ["p", "Personal daily quiet time with God is the essential habit that enables us to abide in Christ. Establishing a daily rhythm of word, prayer, and worship synchronizes our lives with the heartbeat of God. Change is inevitable; abiding in Christ ensures that the catalyst for this change comes from our relationship with God, not from our proximity to the world. Making time for God is praying “Here I am”, and making ourselves available to act on His response."], ["p", "By establishing a consistent rhythm of engaging in the word, prayer, and worship, we create the necessary space for God to transform our hearts and direct our steps. This daily rhythm is far more than a spiritual discipline; it is our love for God in action. It is the vital heartbeat of intimacy with the Father. Without this rhythm, we lack a functional relationship with God, and without that relationship, we remain lost in the world, drifting outside of His love, authority, and direction."], ["h", "1) Daily Word: Engaging Our Mind and Our Heart"], ["p", "The Bible confronts our minds with the unchanging truth that challenges our selfish hearts. Scripture is profitable for our teaching, for reproof, for correction, and for training in righteousness. Time spent reading God’s word is a holy encounter with Him."], ["h", "God’s Authority"], ["p", "2 Timothy 3:16: \"All Scripture is breathed out by God and profitable for teaching, for reproof, for correction, and for training in righteousness.\""], ["p", "Scripture is the literal Breath of God. Because it is breathed out by the Father, it carries the weight of His authority. As we read, we are making ourselves available to the One who speaks life into our souls. This breath is profitable; it teaches us truth and corrects our drift, ensuring we are trained and ready for the assignments He has for us."], ["h", "God’s Direction"], ["p", "Psalm 119:105: \"Your word is a lamp to my feet and a light to my path.\""], ["p", "The Word is our Lamp. It provides the immediate clarity needed for our next step while simultaneously illuminating the long-term vision for our journey through the four foundations. Without this light, we walk in the dark, but with it, we have the direction we need to stay on target. It ensures that when we say \"Here I am,\" we can actually see where the Father is leading."], ["h", "God’s Discernment"], ["p", "Hebrews 4:12 “For the word of God is living and active, sharper than any two-edged sword, piercing to the division of soul and of spirit, of joints and of marrow, and discerning the thoughts and intentions of the heart.”"], ["p", "Scripture is a living, two-edged weapon that cuts through the enemy's deception and the world's confusion, bringing clarity, conviction, and purpose. As Hebrews 4:12 describes, God’s Word is sharp enough to pierce the division of soul and spirit, reaching the very thoughts and intentions of the heart."], ["p", "When we prioritize daily time in the Word, we anchor ourselves in unchanging truth, empowering us to abide in the transforming power of the Holy Spirit. Daily Bible reading realigns our limited perspective with the vastness of God’s wisdom, turning our confusion into conviction and our hesitation into holy confidence. By establishing this rhythm, our hearts are trained to no longer be reactive to the world, but instead to be responsive to the Father’s guidance."], ["h", "2) Daily Prayer: Listening For God"], ["p", "When we are confronted by God’s Word, we are naturally compelled to go to Him in prayer. Prayer engages our hearts. Successful prayer is not about pressing our way into the heavens or bringing a laundry list of demands to the throne. True prayer is an exercise of listening."], ["p", "1 Thessalonians 5:17 \"Rejoice always, pray without ceasing, give thanks in all circumstances; for this is the will of God in Christ Jesus for you.\""], ["p", "While we may use the structure of the Lord’s Prayer or other scriptures to focus our hearts, the ultimate goal is to hear the still, small voice of God. We do not bring an agenda to God; we wait for His agenda for us. Like Abraham, we must cultivate a silence that allows us to hear the Master’s call, replacing our anxiety with a peace that can only come from the comfort of His voice."], ["p", "Scripture is rich with examples of how prayer transforms us. We are challenged to pray without ceasing, a spiritual rhythm that continuously tunes our ears to the distinct sound of the Father’s voice amidst the noise of the world."], ["h", "Reconciliation to God and One Another"], ["p", "Prayer is the environment where we are empowered to forgive, so that we remain in fellowship with God and His forgiveness."], ["p", "Mark 11:25: \"And whenever you stand praying, forgive, if you have anything against anyone, so that your Father also who is in heaven may forgive you your trespasses.\""], ["h", "Prayer Brings Peace"], ["p", "Prayer allows us to transfer our worries to God, resulting in a peace that transcends human understanding."], ["p", "Philippians 4:6–7: \"Do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus.\""], ["h", "Strength and Renewal"], ["p", "Regular prayer provides the spiritual strength needed to endure trials and to renew our inner spirit."], ["p", "Isaiah 40:31: \"But they who wait for the Lord shall renew their strength; they shall mount up with wings like eagles; they shall run and not be weary; they shall walk and not faint.\""], ["h", "Wisdom and Guidance:"], ["p", "When faced with difficult decisions, prayer is the means by which we ask for and receive divine wisdom. --- James 1:5: \"If any of you lacks wisdom, let him ask God, who gives generously to all without reproach, and it will be given him.\""], ["p", "Forgiveness and Healing: Prayer is the gateway to confessing our shortcomings and receiving God’s restoration and physical or emotional healing. --- 1 John 1:9: \"If we confess our sins, he is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.\" --- James 5:16: \"Therefore, confess your sins to one another and pray for one another, that you may be healed. The prayer of a righteous person has great power as it is working.\""], ["h", "Intimacy with God:"], ["p", "One of the primary benefits of prayer is the development of a personal, close relationship with the Father. --- Psalm 145:18: \"The Lord is near to all who call on him, to all who call on him in truth.\""], ["h", "Protection from Temptation:"], ["p", "Prayer serves as a defensive tool, helping us stay alert and strengthening our resolve against spiritual pitfalls. --- Matthew 26:41: \"Watch and pray that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.\""], ["p", "Confidence and Assurance: Knowing that God hears us provides a sense of security and confidence in His sovereign care. --- 1 John 5:14: \"And this is the confidence that we have toward him, that if we ask anything according to his will he hears us.\""], ["h", "3) Daily Worship: Love In Action"], ["p", "As we spend time opening His Word and engaging in prayer, He speaks to us and sets us on our mission. This daily mission includes the deployment of our spiritual gifts, which are given to glorify God and serve the common good. Romans 12:1 appeals to us to present our bodies as a living sacrifice, holy and acceptable to God, as our spiritual worship. We find our purpose in the exercise of our spiritual gifts. At its core, worship is about obedience and sacrifice. Spending time with God teaches us to discern his voice."], ["h", "The \"Here I Am\" Lifestyle"], ["p", "The \"Here I am\" statements throughout Scripture are the result of a lifestyle built on listening. Abraham and others who fulfilled their purpose mastered the daily rhythm of making time for God. By establishing this habit, you ensure that you are never lost in the world’s noise. Instead, you are positioned daily to receive your marching orders, fueled by an intimacy with the Father that makes every step purposeful. We live out the Word, prayer, and worship so that we may overcome by the blood of the Lamb and the word of our testimony."], ["h", "Staying in Rhythm With God"], ["p", "The daily rhythm of the Word, prayer, and worship serves as the vital heartbeat of a life lived on target. By making space to listen each morning, you trade the noise of the world for the clear direction of the Father and the specific marching orders needed for your day. This consistent intimacy transforms your listening into an active obedience, where you stand ready to say, \"Here I am.\" Ultimately, these habits ensure you remain closely connected to the Vine, allowing your life to naturally produce fruit that glorifies God and serves the common good."]], "q": [["Why is establishing a daily quiet time with God essential to becoming a disciple?", "See the opening of Section 2.", 4], ["What are the benefits of daily time in God’s Word?", "See “Daily Word.”", 7], ["What are the benefits of daily prayer?", "See “Daily Prayer.”", 19], ["What are the actions of daily worship?", "Clue: it’s not about music! See “Daily Worship.”", 41], ["How does the “Here I am” lifestyle relate to the rhythm of Word, prayer, and worship?", "See “Staying in Rhythm With God.”", 45]]}, {"id": "s3", "k": "Section 3", "t": "Being and Making Disciples", "b": [["h", "Section Overview:"], ["h", "1) Being a Disciple"], ["li", "a. Responding to God"], ["li", "b. Responding to a Shepherd"], ["li", "c. Responding to our Circumstances"], ["h", "2) Making Disciples"], ["h", "Being A Disciple"], ["p", "Following Jesus by listening for and responding to the voice of God."], ["h", "1a) Responding To God"], ["p", "Being a disciple is a lifestyle of active response and developed disciplines, in which you yield your heart to God’s plan for your life through the daily rhythm of Word, prayer, and worship."], ["p", "By establishing a daily rhythm of time with God, we learn to listen for His voice and ultimately align ourselves with His will. If we listen, He will speak, as we see time and again in Scripture. This posture of response extends to those who pursue us in love for the sake of our spiritual maturity. Responding to them with gratitude and giving them permission to speak into our lives benefits us immensely. Lastly, we are called to be \"on target\" in our day-to-day world, viewing our circumstances as opportunities to be salt and light. Responding to God, our Shepherd, and our circumstances is the essential work of being a disciple."], ["p", "This is the foundation of our life. Through the daily rhythm of the Word, Prayer, and Worship, we move from the noise of the world into a posture of listening."], ["li", "The Promise: If we create the space to listen, He is faithful to speak to us."], ["li", "The Goal: Alignment. We don't just hear information; we adjust our lives to match His heart."], ["p", "At the core of this lifestyle is a specific heart posture: the willingness to say, \"Here I am.\" This phrase is the ultimate expression of availability, signaling that you are listening and ready to move before you even know the destination."], ["h", "When We Say \"Here I Am\""], ["p", "When we say \"Here I am,\" we are declaring our availability to God. It is a response that happens in the quiet place of our daily rhythm before we ever step into the world. By maintaining a lifestyle of Word, prayer, and worship, we are abiding in Christ, which brings true fellowship and intimacy with God. This connection is the central core of our spiritual life, as Jesus described:"], ["p", "\"I am the vine; you are the branches. Whoever abides in me and I in him, he it is that bears much fruit, for apart from me you can do nothing.\" (John 15:5 ESV)"], ["p", "\"Here I am\" is not a response to a list of tasks; it is a response to the Presence of the Father. It means that whether God calls us to rest, to repent, or to reach out to a neighbor, our answer is already \"Yes\" because we live as a part of the vine of life."], ["h", "When Abraham Said \"Here I Am\""], ["h", "The Moriah Perspective: Six Tests of the \"Here I Am\" Response"], ["p", "Abraham's account on Mount Moriah serves as a great metaphor for the life of a disciple. It reveals that the \"Here I am\" response is not a one-time declaration but a continuous posture to be maintained throughout the journey of faith. By examining Genesis 22, we see six distinct tests that calibrate our hearts to the frequency of God’s voice and the magnitude of His faithfulness. As scripture tells the story of Abraham’s journey to top of Mt. Moriah, watch for the three times he responded with the words “Here I Am.”"], ["h", "Test 1: Are We Listening for the Assignment?"], ["p", "Verse 1: After these things God tested Abraham and said to him, “Abraham!” And he said, “Here I am.”"], ["p", "This passage opens by stating that God tested Abraham by calling his name. It does not say that He tested Abraham by immediately assigning him a mission. Rather, Abraham’s response was the key to unlocking the promise for his life. We can infer that Abraham had the habit of listening for God’s voice, because, the moment God called, he immediately answered with the simple response: \"Here I am.\" This test was not to prove Abraham’s faithfulness to God"], ["h", "Test 2: Are We Obedient to the Assignment?"], ["p", "Verses 2–3: He said, “Take your son, your only son Isaac, whom you love, and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains of which I shall tell you.” So Abraham rose early in the morning, saddled his donkey, and took two of his young men with him, and his son Isaac. And he cut the wood for the burnt offering and arose and went to the place of which God had told him.”"], ["p", "As soon as Abraham responded to God, he received his assignment, a faith-testing command to act immediately. These verses demonstrate that Abraham’s obedience was both total and immediate. He attended to every detail, even down to cutting the wood for the burnt offering that was intended to consume his son, the very son who was the fulfillment of God’s promise."], ["h", "Test 3: The Test of Time"], ["p", "Verse 4: “On the third day, Abraham lifted up his eyes and saw the place from afar.”"], ["p", "This single verse demonstrates that Abraham saw his destination from afar. He understood that the destination was far away and would take both significant time and sustained effort to scale the mountain of faith before him. Discipleship is often a long journey between the initial \"yes\" and the final provision."], ["h", "Test 4: What Is Our Testimony to the World During Adversity?"], ["p", "Verse 5: “Then Abraham said to his young men, “Stay here with the donkey; I and the boy will go over there and worship and come again to you.”"], ["p", "Abraham knew his servants were watching how he would respond to God’s command. He took this opportunity to speak in faith. Even in the face of what appeared to be a broken promise, he testified that he and Isaac would not only go to the mountain together, but that they both would return. Despite seemingly contradictory instructions, Abraham believed God’s promise would supersede the cost of his sacrificial obedience."], ["p", "This raises the question: What would the world say about our testimony when they see us facing adversity? When the pressure is on, and the outcome is uncertain, do we complain about our circumstances or do we affirm our faith in God’s faithfulness? Abraham proved to the world he was a faithful man by choosing to worship rather than waver."], ["h", "Test 5: What Is Our Testimony to Those We Love During Adversity?"], ["p", "Verses 6–8: “And Abraham took the wood of the burnt offering and laid it on Isaac his son. And he took in his hand the fire and the knife. So they went both of them together. And Isaac said to his father Abraham, “My father!” And he said, “Here I am, my son.” He said, “Behold, the fire and the wood, but where is the lamb for a burnt offering?” Abraham said, “God will provide for himself the lamb for a burnt offering, my son.” So they went both of them together.”"], ["p", "Sometimes it is easier to testify about God’s faithfulness to strangers than it is to those closest to us. In verse six, Abraham requires Isaac to carry the wood for the offering while he carries the fire and the knife. Imagine the churning in Abraham’s soul when Isaac asked, \"Where is the lamb for the burnt offering?\" Abraham’s response was a declaration of faith: God would provide the lamb. Before he ever saw the ram in the thicket, he had faith that God would provide."], ["h", "Test 6: Are We Listening During the Assignment?"], ["p", "Verses 9–12: When they came to the place of which God had told him, Abraham built the altar there and laid the wood in order and bound Isaac his son and laid him on the altar, on top of the wood. Then Abraham reached out his hand and took the knife to slaughter his son. But the angel of the Lord called to him from heaven and said, “Abraham, Abraham!” And he said, “Here I am.” He said, “Do not lay your hand on the boy or do anything to him, for now I know that you fear God, seeing you have not withheld your son, your only son, from me.”"], ["li", "Continued Faithfulness: Abraham built the altar, bound his son, and raised the knife. He was fully prepared to make the unthinkable sacrifice."], ["li", "Listening During the Assignment: Even in an incredibly heartbreaking and emotional moment, the very second before the knife would end a life, God called out to Abraham again. Abraham responded once more, \"Here I am.\" At that point, God stopped him, provided the ram, and reiterated the promise that Abraham would be the father of a great nation. Abraham’s failure to listen for God’s voice during the assignment would have cost him his legacy according to God’s promise."], ["p", "When Isaiah Said \"Here I Am\""], ["p", "\"And I heard the voice of the Lord saying, 'Whom shall I send, and who will go for us?' Then I said, 'Here I am! Send me.'\" (Isaiah 6:8 ESV)"], ["p", "In Isaiah 6:1–8, God reveals His glory to Isaiah in a vision that overwhelms him, as the seraphim cry, “Holy, holy, holy is the LORD of hosts,” and in that moment Isaiah catches a true glimpse of God’s holiness; the fear of the Lord grips him, and he immediately humbles himself, confessing, “Woe is me… I am a man of unclean lips,” recognizing both his own sin and the condition of his people, yet God responds not with judgment but with grace, sending a seraphim to touch Isaiah’s lips with a burning coal and declare his guilt removed and his sin atoned for; only after this cleansing does the Lord ask, “Whom shall I send, and who will go for us?” and Isaiah, now transformed by the fear of God and restored by His mercy, responds with full surrender, “Here I am! Send me.”"], ["p", "In response to Isaiah’s surrender, “Here I am! Send me,” God commissions him not to an easy or celebrated ministry, but to faithfully proclaim His word to a people who would hear yet not understand; yet through this calling, Isaiah’s relationship with God is transformed from a moment of fearful awareness of sin into a life of restored fellowship and purposeful obedience, and though his assignment would not yield immediate visible results, his faithfulness positioned him as a servant of God whose words would be preserved and echoed through generations, demonstrating that while obedience did not make his life easier, it made it aligned with God’s will, deeply purposeful, and eternally significant."], ["p", "When Mary Said \"Here I Am\""], ["p", "\"And Mary said, 'Behold, I am the servant of the Lord; let it be to me according to your word.'\" (Luke 1:38 ESV)"], ["p", "Mary’s life serves as a powerful testament to the lifestyle of response, specifically when she was visited by the angel Gabriel with the news that she would bear the Messiah. Although the circumstances were humanly impossible and would carry a high social cost, her response was an immediate and total surrender to God's initiative."], ["p", "By declaring herself a servant, she was announcing her total availability to the Father. She did not ask for a detailed roadmap of the next thirty years; she simply yielded her body, her reputation, and her future to God’s plan before she knew how it would unfold."], ["p", "Mary’s \"Here I am\" demonstrates that being a disciple means responding to God even when His call interrupts our personal plans or challenges our comfort. Because she remained in a posture of availability, she became the vessel through which the Promise entered the world, modeling for us that intimacy with God is found in the simple, humble response: \"Let it be to me according to your word.\""], ["h", "“Here I Am” Is How We Respond"], ["p", "Abraham’s journey proves that the \"Here I am\" response must remain active from the bottom of the mountain to the summit. We are called to listen for the assignment, obey the instructions, and continue listening even in the heat of the trial. When we maintain this posture, we find that our obedience does not just fulfill a requirement; it positions us to witness the full magnitude of God's provision."], ["h", "1b) Responding to Your Shepherd"], ["p", "Being a disciple involves the humility to recognize that God often speaks and leads through the voices of those He has placed as a spiritual covering over us and around us. A lifestyle of response requires us to be teachable, setting aside our own pride to follow, listen, and apply the guidance of spiritual leaders who are invested in our growth. True life change rarely happens in isolation; it is often the result of a deep spiritual investment from a mentor or shepherd who helps us see what we cannot see in ourselves. This posture of honor is rooted in the way we regard those God has"], ["h", "appointed to lead us:"], ["p", "\"We ask you, brothers, to respect those who labor among you and are over you in the Lord and admonish you, and to esteem them very highly in love because of their work. Be at peace among yourselves.\" (1 Thessalonians 5:12–13 ESV) When we respond to our shepherds, we are not just following a person; we are responding to the God-ordained order that protects our souls and keeps us on target."], ["h", "Discipling Relationship: Timothy and Paul"], ["p", "\"Follow the pattern of the sound words that you have heard from me, in the faith and love that are in Christ Jesus.\" (2 Timothy 1:13 ESV) The relationship between the Apostle Paul and Timothy is a great example of shepherding. Timothy was a young man who struggled with natural timidity and the heavy weight of his calling, yet Paul invested in him as a father in the faith. Paul shepherded Timothy through constant correction, encouragement, and specific instruction. Timothy’s growth into a stable leader was only possible because he consistently responded to Paul’s mentoring. Paul reminded him that his spiritual authority stemmed from following the \"pattern of sound words\" modeled by his shepherd."], ["h", "How Timothy Benefitted from his Shepherd:"], ["li", "Overcoming Fear: Through Paul’s shepherding, Timothy’s natural timidity was replaced with a spirit of power, love, and self-discipline (2 Timothy 1:7)."], ["li", "Clear Direction: Timothy did not have to guess how to lead; he had a proven blueprint to follow."], ["li", "Transferred Authority: By responding to Paul’s leadership, Timothy was eventually entrusted with his own ministry, proving that those who follow well are equipped to lead well."], ["h", "Discipling Relationship: Ruth and Naomi"], ["p", "\"And she said to her, 'All that you say to me I will do.'\" (Ruth 3:5 ESV)"], ["p", "The life change we see in Ruth is a powerful testament to the value of yielding to a shepherd. Ruth, a widowed foreigner who had lost everything, chose to bind herself to Naomi’s spiritual covering. Naomi provided strategic shepherding that positioned Ruth for a future she could not see. Ruth’s redemption was only possible because she responded to Naomi’s mentoring with total humility. When Naomi gave her specific, difficult instructions on how to approach Boaz at the threshing floor, Ruth did not rely on her own understanding. She responded, \"All that you say to me I will do.\""], ["h", "How Ruth Benefitted from her Shepherd:"], ["li", "A Shift in Identity: Through Naomi’s guidance, Ruth stopped seeing herself as an outsider and began living as a daughter of the God of Israel."], ["li", "Strategic Positioning: Naomi saw the \"field\" better than Ruth did. Her instructions positioned Ruth to be noticed by Boaz, her kinsman-redeemer."], ["li", "The Fruit of Legacy: Because Ruth responded to the person God used to guide her, she was brought into the direct lineage of King David and Jesus Christ."], ["h", "Scriptural Mandates for Responding to a Shepherd"], ["li", "Responding to Oversight: \"Obey your leaders and submit to them, for they are keeping watch over your souls, as those who will have to give an account.\" (Hebrews 13:17 ESV)"], ["li", "Responding to Equipping: \"And he gave... the shepherds and teachers, to equip the saints for the work of ministry, for building up the body of Christ.\" (Ephesians 4:11–12 ESV)"], ["li", "Responding to Example: \"Remember your leaders, those who spoke to you the word of God. Consider the outcome of their way of life, and imitate their faith.\" (Hebrews 13:7 ESV)"], ["li", "Responding with Humility: \"Likewise, you who are younger, be subject to the elders. Clothe yourselves, all of you, with humility toward one another.\" (1 Peter 5:5 ESV)"], ["li", "Responding to your shepherd is the bridge between being a disciple and making one. When we allow ourselves to be shepherded, responding with the heart of Ruth and the teachability of Timothy, we experience the kind of life change that only happens through spiritual investment. By honoring those who keep watch over our souls, we remain in a posture where God can mold us into leaders who will one day watch over others."], ["h", "1c) Responding to Your Circumstances"], ["p", "Being a disciple involves embracing your circumstances as divine opportunities to respond with faith rather than reacting out of self-reliance. Often, we view unexpected situations as obstacles, but in the life of a disciple, these moments are the primary training ground for maturity. When we respond correctly to our setting, we prove that our trust is in the sovereignty of God rather than the stability of our environment."], ["h", "Paul and Silas: Responding with Worship"], ["p", "After being beaten and imprisoned for preaching the gospel, Paul and Silas found themselves chained in a Philippian jail. Rather than complaining or despairing, they responded to their circumstances with worship and prayer."], ["p", "\"About midnight Paul and Silas were praying and singing hymns to God, and the prisoners were listening to them.\" (Acts 16:25 ESV)"], ["h", "The Apostles: Responding with Joy"], ["p", "After being arrested and beaten for preaching in the name of Jesus, the apostles were ordered by the authorities to stop teaching about Christ. Instead of leaving discouraged or afraid, they rejoiced that they had been counted worthy to suffer for His name."], ["p", "\"Then they left the presence of the council, rejoicing that they were counted worthy to suffer dishonor for the name.\" (Acts 5:41 ESV)"], ["h", "Making Disciples"], ["h", "Making Disciples Means Pursuing People"], ["p", "Making disciples means actively modeling and teaching others to live a life that is pleasing to the Lord. You are guiding them to become disciples just as you are a disciple of Jesus, coming alongside them to cultivate the Spirit as they learn to abide in and apply the truth of Scripture to their lives. Making Disciples starts with building relationships because they are both the soil and the fruit of discipleship."], ["p", "The Soil: Relationships can be great soil for giving and receiving meaningful, consistent, and often lifelong discipleship. Proverbs 27:17 says, “As iron sharpens iron, so one person sharpens another.” Two friends in a trusting relationship have a strong foundation for processing joy, grief, and grappling with hard questions. Within a faith-focused friendship, the Holy Spirit can guide two seeking people to the firm foundation of truth. These relationships provide a nurturing soil for asking challenging questions about God, the Bible, and our faith, including our own personal struggles with these issues. Friendship is fertile soil for spiritual growth. The Fruit: Meaningful relationships are often the fruit, the natural result, of engaging in discipleship together. A shared moment of spiritual discovery can transform two strangers into lifelong friends, forging the kind of bond described in Proverbs 17:17: a friendship that \"loves at all times\" and is \"born for a time of adversity.\""], ["p", "Consider the moments in your life when a spiritual conversation with a friend opened your eyes to a new truth, or when you joined a class or small group to study Scripture. In these environments, the shared pursuit of God acts as a catalyst for connection. While we certainly learn from the Holy Spirit in solitude, sometimes our deepest relationships grow out of the fertile soil of learning, growing, and \"grappling\" with truth alongside others."], ["h", "Modeling A Shared Life Makes Disciples"], ["p", "A healthy church community is more than a social circle. It is a discipleship laboratory where modeling a shared life and spiritual formation are inextricably linked. Throughout Scripture, we see that maturing in Christ rarely happens in a vacuum. Jesus did not just offer lectures. He called twelve disciples into a shared life to demonstrate that the deepest spiritual investment occurs within the context of a relationship. Paul and Barnabas, or Ruth and Naomi, were not just companions. The bond between David and Jonathan shows that making a disciple often requires walking through the fire as one. Their relationship was not a byproduct of proximity. It was the fruit of a mutual commitment to God's purposes. Living in community proves that God uses our hardest seasons to transform strangers into a unified people and mature followers of Christ."], ["p", "They were partners in a mission who intentionally spurred one another toward a more Christ-like life. Modeling a shared life requires being close enough for others to see how faith is lived out in real time."], ["h", "Living In Community Makes Disciples"], ["p", "The Israelites’ journey from slavery to the Promised Land serves as a blueprint for collective discipleship. Their spiritual identity was forged not in comfort, but through the grit and gristle of enduring misery and witnessing miracles together. This collective experience of a nation shows that making disciples often requires walking through the fire together, allowing shared trials to knit hearts together in a way that prosperity never could. By living in community, a wandering people transformed into a unified nation, proving that God uses the weight of shared history to refine the character of His followers and turn strangers into family."], ["p", "Being part of a church requires us to build and maintain it. Community is not something that we find; it is something that we build. So many people miss the blessing of fellowship and waste their lives wandering from one church to another, seeking community, never finding it because they refuse to build it. We can only taste the fruit of Community by laboring in the soil to build it. Community is a costly thing. When we focus only on the Sunday gathering and miss the opportunity for relational development, we discourage the making of disciples. To truly make disciples, we must facilitate spaces where the soil of friendship is nurtured, and the work of building community is embraced by all."], ["h", "The Relational Path: Being Known, Shown, and Grown"], ["p", "The goal of a shepherding relationship is that the person being discipled is known, grown, and shown"], ["h", "Known: The Soil of Relationship"], ["p", "Discipleship begins by getting to know the person. By building a genuine relationship, you create a space where someone feels safe enough to be truly known. This mirrors the Shepherd’s bond in John 10; just as sheep recognize the \"shape\" of the Shepherd’s voice, a friend learns to hear God’s heart through the tone of a trusted relationship. This allows you to care for needs and speak life into relevant situations for the one you are discipling."], ["h", "Shown: The Seeds of Truth"], ["p", "In the soil of a relationship, truth is planted through honesty. You show a friend the way by opening the Word of God together and being transparent about your own struggles and victories. This combination of biblical truth and personal vulnerability allows the \"seeds\" of truth in the faith to take root without the fear of judgment. It’s imperative to plant the seeds of God’s truth in the spirit and not our own flesh because we know what we sow, we will reap."], ["h", "Grown: The Fruit of Growth"], ["p", "Spiritual maturity is the harvest of abiding in Christ and applying the truths to our lives. As you walk through life together, the \"fruit\" is a disciple who looks more like Christ and a faith that stands the test of time. We plant and water, but the Lord can only bring the fruit out of a heart. He uses us to plant, water, and care for people so the seed can grow roots and bear good fruit."], ["h", "The Great Commission: The Pursuit of the Lost"], ["p", "This represents the complete lifecycle of making disciples. It begins with us being pursued and confronted by the truth of Jesus; once we respond, our journey of \"being\" a disciple begins. We are then discipled to abide, apply, and grow in our faith and communion with God. As we grow, love compels us to accept the commission to make disciples by pursuing the lost and inviting them into a relationship with God and ourselves. This completes the cycle: evangelism is simply loving the world enough to be a disciple who makes more disciples."], ["li", "The Mandate: \"Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all that I have commanded you.\" (Matthew 28:19–20 ESV)"], ["li", "The Identity: \"And he said to them, 'Follow me, and I will make you fishers of men.'\" (Matthew 4:19 ESV)"], ["li", "The Search: \"For the Son of Man came to seek and to save the lost.\" (Luke 19:10 ESV)"], ["li", "The Power: \"But you will receive power when the Holy Spirit has come upon you, and you will be my witnesses... to the end of the earth.\" (Acts 1:8 ESV)"], ["li", "The Call: \"Therefore, we are ambassadors for Christ, God making his appeal through us. We implore you on behalf of Christ, be reconciled to God.\" (2 Corinthians 5:20 ESV)"], ["h", "The Disciple-Making Power of Telling Our Story"], ["p", "We have an incredibly powerful tool at our disposal in making disciples. Every Christian has this tool: telling our story. Revelation teaches that we overcome by the blood of the Lamb and the word of our testimony, framing storytelling as a weapon that defeats the enemy. Telling our story empowers us to overcome the enemy because it moves the Gospel from a distant, abstract concept into a living, breathing reality that cannot be argued away. When we speak truthfully about how Christ has pulled us out of darkness, we actively dismantle the lies of the accuser and strip him of his power to keep us—or those listening—bound in shame and silence. By sharing the specific ways God has redeemed our past, we turn our history into a battlefield where the enemy's defeat is made public. Telling our story inspires and encourages others to seek God in ways that allow Him to do His miraculous work in them, creating a fresh spark of hope in their own circumstances. As they witness the reality of God's power through our lives, they are emboldened to seek their own transformation so they can, in turn, tell their story to a world in need."]], "q": [["Being a disciple means living a lifestyle of response to three specific things. What are they?", "See “Being a Disciple.”", 6], ["Based on Abraham’s story on Mount Moriah, what does it mean to live a “Here I am” lifestyle in your daily walk with God?", "Look at the Moriah Perspective.", 20], ["What is the primary activity of making disciples?", "See the beginning of “Making Disciples.”", 84], ["How can a relationship be described as both the “soil” and the “fruit” of discipleship?", "See “The Soil” and “The Fruit.”", 97], ["What are the three specific actions (or stages) of the Relational Path used in a shepherding relationship?", "See “The Relational Path.”", 95]]}, {"id": "s4", "k": "Section 4", "t": "Loving and Serving", "b": [["h", "Section Overview:"], ["h", "1) The Lifestyle of Loving and Serving"], ["h", "2) The Four Foundations of Loving and Serving"], ["p", "A true disciple of Christ lives a life of loving and serving. Loving and serving is the natural overflow of abiding in Christ (John 15:12–13). Loving is expressed through the heart, and serving is expressed through the hands."], ["h", "1) The Lifestyle of Loving and Serving"], ["h", "Loving"], ["p", "When we cross the threshold of love with a person, we gain a spiritual vantage point that helps them see how God wants to reveal His glory in their lives. We can also describe the trap that Satan has built for them; our love for another person offers them that benefit, and we benefit from love in the same way. This is the fruit of love. This depth of devotion is not passive; we can only truly love what we have sacrificed for. We learned this from the model of Christ on the cross, who showed us the very definition of love through His ultimate sacrifice. By abiding in Christ, God guides our hearts to love the things He loves."], ["h", "Serving"], ["p", "Serving someone opens the door to loving them. When we sacrifice for someone, it invites them to cross the threshold of love with us. Serving others opens the door for God's blessing to be poured out in their life. When we serve others selflessly, it compels them to ask, “Why are they doing this?” Taking this question to God allows Him to do His work; people see our service as God's kindness, and that kindness leads to repentance, which opens the door to discipleship. Serving is simply Love in Action, the outward proof that our internal devotion is genuine. Serving does not wait to be asked; it actively seeks out the need. It expects no reward, recognition, or reciprocation, finding its satisfaction solely in pleasing God. Beyond meeting needs, serving humbles the soul and breaks the power of selfishness in us. It helps break the bondage of our flesh, so God’s glory is revealed in us."], ["h", "2) The Four Foundations of Loving and Serving"], ["h", "Foundation 1: Loving and Serving Christ"], ["p", "We love and serve Christ by abiding in Him. As Jesus teaches in John 15:5, \"I am the vine; you are the branches. Whoever abides in me and I in him, he it is that bears much fruit, for apart from me you can do nothing.\" Apart from this connection, we can do nothing of eternal value. Loving and serving Christ means staying reconciled to the Father through Christ so that we can, in turn, be reconciled to the world."], ["p", "We are entrusted with the ministry of reconciliation, acting as ambassadors who help a broken world find its way back to God. As 2 Corinthians 5:17-21 declares, \"Therefore, if anyone is in Christ, he is a new creation. The old has passed away; behold, the new has come. All this is from God, who through Christ reconciled us to himself and gave us the ministry of reconciliation; that is, in Christ God was reconciling the world to himself, not counting their trespasses against them, and entrusting to us the message of reconciliation.\" Practically, we love and serve Christ by establishing a daily rhythm of Word, prayer, and worship, which keeps our hearts aligned with His. This spiritual health then overflows into the world as we actively share His love through our words and deeds."], ["h", "Foundation 2: Loving and Serving the Home"], ["p", "Our families are the first to benefit when we have a right relationship with Christ. They benefit from our spiritual maturity, and they can suffer from our immaturity. Establishing a strong Foundation One is the only way to build a strong Foundation Two. The guide highlights that we must love and serve our families across every state of life, including marriage, children, and parenting. We must engage in loving and serving our family in every way that it expresses itself. Whether families are traditional or blended, we are called to prioritize these relationships by pursuing peace."], ["p", "Using Romans 12:18 as our anchor, \"be at peace with everyone, as far as it depends on you,\" we navigate three opportunities for reconciliation. First, when we have hurt someone, we follow Matthew 5:23-24 to seek them out. Second, when someone hurts us, we follow Mark 11:25 and choose to forgive. Third, if reconciliation efforts fail, we do all we can to pursue them in love and commit to pray for them. Loving and serving our family also means ensuring that we have a biblical view of money, striking a balance between keeping the family a priority and juggling the responsibilities of providing for it financially."], ["h", "Foundation 3: Loving and Serving the Church"], ["p", "We love and serve the church by intentionally engaging with and discipling the people who make up the body. It is not an organization, it is an organism. Building a church means building a community where members are known, shown, and grown. We do this through regular attendance at gatherings, using our spiritual gifts to strengthen others, and financially supporting the church's mission. According to the guide, the Church is a \"called-out\" community (the Ecclesia) of believers who are joined together by their common faith in Christ. Who the church is is defined as the Body and Bride of Christ: a living, breathing organism made up of diverse members who function in unity to reflect God's glory to the world."], ["h", "Foundation 4: Loving and Serving the World"], ["p", "The final foundation is built upon the Great Commission in Matthew 28:18-20, where we go under Christ's authority to make disciples of all nations. We love and serve the world by practicing radical hospitality, opening our homes and lives to strangers and neighbors to build relationships without agendas (Hebrews 13:2). We seek justice and mercy by advocating for the vulnerable and meeting the physical needs of the marginalized (Micah 6:8). We offer intercessory prayer, talking to God about the lost before we talk to the lost about God (1 Timothy 2:1). We live as a \"City on a Hill,\" maintaining over the top integrity in our workplaces so that our light shines through our excellence (Matthew 5:16). We share the reason for our hope, looking for open doors to tell our story of salvation with gentleness and respect (1 Peter 3:15)."], ["p", "Ultimately, we love and serve the world by committing to the discipline of disciple-making. One of the main tools in disciple-making is learning to tell our story in truth and transparency so that others can see how God has worked in our lives. Revelation teaches that we overcome by the blood of the Lamb and the word of our testimony. When we tell our story, it benefits us and the person who hears it firsthand about the work of God in us."]], "q": [["According to the “Loving” section, what is the spiritual benefit or “fruit” of crossing the threshold of love with another person?", "See the opening of “Loving.”", 5], ["The “Serving” section describes serving as “Love in Action.” How does selfless service lead someone toward the door of discipleship?", "Kindness, then questioning, then repentance.", 7], ["According to Foundation 2, why is it important to prioritize our relationship with Christ before trying to serve our own household?", "See “Foundation 2.”", 13], ["How does telling your personal testimony act as a weapon against the enemy?", "See Revelation and “the word of our testimony.”", 20]]}, {"id": "launch", "k": "Wrap-up", "t": "Living On Target: The Lifestyle Launch", "b": [["p", "You have completed the foundational stage of Living On Target Discipleship Training. This is a profound spiritual accomplishment. You have engaged in the heavy work of the heart, aligning your life to the ultimate goal of God’s glory."], ["p", "You are now equipped with a tactical blueprint to step out of the noise of everyday life and into a lifestyle of listening, obedience, and supernatural fruitfulness."], ["h", "Review of Key Ideas"], ["p", "Take hold of the four target foundations you have established throughout this training:"], ["h", "● Our Appointment with God"], ["p", "\"So whether we are at home or away, we make it our aim to please him.\" – 2"], ["h", "Corinthians 5:9"], ["p", "Our primary aim is to live a life that pleases God, knowing we will one day stand before the judgment seat of Christ to give an account for our actions. This accountability is not a source of dread but a daily compass, where a holy fear and reverence for God's power clarify His character, anchor us in His unwavering love, and motivate us to persuade others."], ["h", "● The Rhythm of Word, Prayer, and Worship"], ["h", "\"Your word is a lamp to my feet and a light to my path.\" – Psalm 119:105"], ["p", "An intimate relationship with God requires a daily quiet time that synchronizes our lives with His heartbeat rather than drifting with the world. We engage our minds through the authority, direction, and discernment of the Word, surrender our hearts by praying and listening for His agenda, and deploy our spiritual gifts through a lifestyle of Worship rooted in obedience and sacrifice."], ["h", "● Being and Making Disciples"], ["p", "\"I am the vine; you are the branches. Whoever abides in me and I in him, he it is that bears much fruit...\" – John 15:5 --- Being a disciple means maintaining a continuous \"Here I am\" posture of absolute availability, learning to respond with humility and faith to God, to our spiritual shepherds, and to our circumstances. As this posture matures, we actively make disciples by pursuing people, modeling a shared life in community, and guiding others through a relational path where they are truly known, shown the truth, and grown into spiritual maturity."], ["h", "● Loving and Serving"], ["h", "\"Go therefore and make disciples of all nations...\" – Matthew 28:19"], ["p", "A disciple's life is driven by love in the heart and expressed through selfless service with the hands, which acts as a catalyst that opens the door for God's kindness to lead others to repentance. This lifestyle builds from a deep connection to Christ, overflows to bring peace and reconciliation to the Home, strengthens the community of the Church, and executes the Great Commission by practicing radical hospitality and sharing our hope with the World."], ["h", "Your Deployment: Go and Multiply"], ["p", "The Great Commission is your directive, and you have the tools to execute it. True stewardship means taking the investments God has placed in you and multiplying them within your community. You are compelled by love to love others."], ["p", "Step onto the relational path today using these three action points: 1. Cultivate the Soil (Be Known): Build genuine relationships where people feel safe. Learn their hearts, just as the sheep recognize the voice of the Shepherd in John 10."], ["p", "2. Plant the Seed (Show the Way): Open up the Word of God with others. Be transparent about your own struggles and victories, allowing the unchanging truth to take root without fear of judgment."], ["p", "3. Wield Your Weapon (Tell Your Story): Remember that we overcome by the blood of the Lamb and the word of our testimony. Your personal story of transformation is an undeniable asset that dismantles deception, strips the enemy of his power, and sparks fresh hope in those who hear it."], ["h", "The Charge:"], ["p", "Do not be like the paralyzed servant who hid his talent in the ground because of a misconception of the Master's heart. Step forward in reverent wisdom, walk up the mountain of faith, and let your life naturally bear fruit for His kingdom."]], "q": []}], "es": [{"id": "intro", "k": "Bienvenida", "t": "Living On Target: Formación en Discipulado", "b": [["p", "¡Nuestra meta es que cada asistente participe en la obra del corazón para ser y hacer discípulos! Esta formación equipará a los miembros y líderes de la iglesia para convertirse en discípulos de Cristo que hacen discípulos que aman y sirven a Cristo, al hogar, a la iglesia y al mundo."], ["h", "El material está dividido en cuatro secciones:"], ["h", "Sección 1: Nuestra cita con Dios"], ["p", "Todos tenemos una cita con Dios en la que daremos cuenta de lo que hemos hecho en esta vida. Nos preparamos para esa cita viviendo una vida que agrada a Dios y persuadiendo a otros a hacer lo mismo."], ["h", "Sección 2: Establecer el ritmo de la Palabra, la oración y la adoración"], ["p", "Vivir una vida que agrada a Dios requiere una relación íntima con Él. Esa relación se sostiene mediante un ritmo diario de Palabra, oración y adoración. Este ritmo mantiene nuestro corazón alineado con Dios y nuestra vida enfocada en su propósito."], ["h", "Sección 3: Ser y hacer discípulos"], ["p", "El discipulado comienza con la postura “Aquí estoy”. Un discípulo aprende a responder a Dios, al liderazgo espiritual y a las circunstancias de la vida con humildad y fe. A medida que esta postura madura, los discípulos buscan intencionalmente a otros para que la obra de Dios se multiplique a través de ellos."], ["h", "Sección 4: Amar y servir a Cristo, al hogar, a la iglesia y al mundo"], ["p", "La vida de un discípulo es impulsada por el amor y se expresa mediante el servicio. Esta sección explora cuatro fundamentos de la influencia espiritual: Cristo, el hogar, la iglesia y el mundo. Cada nivel depende de la fortaleza del que está debajo. Una caminata firme con Cristo produce hogares sanos, iglesias fuertes y un testimonio poderoso ante el mundo."], ["p", "Juntas, estas secciones nos llevan del ruido de la vida diaria a una vida de escucha, obediencia y fruto. La meta del estilo de vida del discipulado es sencilla: permanecer conectados a Cristo para que nuestra vida dé fruto de manera natural para su gloria."]], "q": []}, {"id": "s1", "k": "Sección 1", "t": "Nuestra cita con Dios", "b": [["h", "Resumen de la sección:"], ["h", "1) Agradar a Dios"], ["h", "2) Rendir cuentas"], ["h", "3) Persuadir a otros"], ["h", "2 Corintios 5:9–11 (ESV, traducción libre)"], ["p", "“Por eso, ya sea que estemos en casa o ausentes, nos proponemos agradarle. Porque todos debemos comparecer ante el tribunal de Cristo, para que cada uno reciba lo que le corresponde por lo que haya hecho en el cuerpo, sea bueno o malo. Por tanto, conociendo el temor del Señor, persuadimos a los demás.”"], ["h", "Ideas clave"], ["h", "Parte 1: Meta"], ["p", "Nuestra meta es agradar a Dios: ya sea en esta vida o en la próxima, nuestro objetivo principal es vivir de una manera que agrade a Dios."], ["h", "Parte 2: Rendición de cuentas"], ["p", "Nuestra cita con Dios: reconocemos que toda persona se presentará algún día ante el tribunal de Cristo para rendir cuentas de sus acciones."], ["h", "Parte 3: Acción"], ["p", "Nuestra motivación para persuadir a otros: el temor del Señor es el fundamento de la sabiduría que dirige nuestro corazón en amor, capacitándonos para hacer discípulos que conocen y comparten el amor transformador de Dios."], ["h", "Parte 1: Agradar a Dios"], ["h", "2 Corintios 5:9–11 (ESV, traducción libre)"], ["p", "“Por eso, ya sea que estemos en casa o ausentes, nos proponemos agradarle. Porque todos debemos comparecer ante el tribunal de Cristo, para que cada uno reciba lo que le corresponde por lo que haya hecho en el cuerpo, sea bueno o malo. Por tanto, conociendo el temor del Señor, persuadimos a los demás.”"], ["p", "La misión de nuestra vida se puede resumir en este pasaje: vivir de una manera que agrade a Dios, sabiendo que un día rendiremos cuentas, y ayudar a otros a hacer lo mismo. Pablo nos recuerda que la meta central de la vida de todo creyente es agradar a Dios. No se trata de ganar su amor, sino de responder a él. Agradamos a Dios pasando tiempo en su presencia, discerniendo su voz y permitiendo que su Palabra moldee nuestros deseos."], ["h", "Mateo 25:21 – La parábola de los talentos"], ["p", "La parábola de los talentos es una ilustración profunda de cómo nuestra percepción del carácter de Dios determina directamente nuestro nivel de fidelidad y acción. Revela que la verdadera mayordomía no es solo cuestión de esfuerzo, sino de un corazón alineado con la naturaleza y la misión del Amo. Al examinar las diferentes respuestas de los tres siervos, vemos que mientras la sabiduría reverente conduce a la multiplicación, la falta de comprensión conduce inevitablemente a la parálisis."], ["p", "“Porque será como un hombre que, al emprender un viaje, llamó a sus siervos y les encargó sus bienes. A uno le dio cinco talentos, a otro dos y a otro uno, a cada uno según su capacidad. Luego se fue de viaje. El que había recibido los cinco talentos fue de inmediato a negociar con ellos, y ganó otros cinco talentos. Así también el que había recibido los dos talentos ganó otros dos. Pero el que había recibido un talento fue, cavó un hoyo en la tierra y escondió el dinero de su amo."], ["p", "Después de mucho tiempo, volvió el amo de aquellos siervos y arregló cuentas con ellos. Y el que había recibido los cinco talentos se acercó, trayendo otros cinco talentos, y dijo: ‘Amo, usted me entregó cinco talentos; mire, he ganado otros cinco talentos’. Su amo le dijo: ‘Bien hecho, siervo bueno y fiel. Has sido fiel en lo poco; te pondré sobre mucho. Entra en el gozo de tu amo’. Y el que había recibido los dos talentos también se acercó y dijo: ‘Amo, usted me entregó dos talentos; mire, he ganado otros dos talentos’. Su amo le dijo: ‘Bien hecho, siervo bueno y fiel. Has sido fiel en lo poco; te pondré sobre mucho. Entra en el gozo de tu amo’."], ["p", "También se acercó el que había recibido un talento y dijo: ‘Amo, yo sabía que usted es un hombre duro, que cosecha donde no sembró y recoge donde no esparció semilla; así que tuve miedo, fui y escondí su talento en la tierra. Aquí tiene lo que es suyo’. Pero su amo le respondió: ‘¡Siervo malo y perezoso! ¿Sabías que cosecho donde no sembré y recojo donde no esparcí semilla? Entonces debiste haber puesto mi dinero en el banco, y a mi regreso yo habría recibido lo mío
