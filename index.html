ir est faible. »"], ["p", "Confiance et assurance : savoir que Dieu nous entend donne un sentiment de sécurité et de confiance dans ses soins souverains. --- 1 Jean 5.14 : « Nous avons auprès de lui cette assurance que, si nous demandons quelque chose selon sa volonté, il nous écoute. »"], ["h", "3) Adoration quotidienne : l’amour en action"], ["p", "Tandis que nous passons du temps à ouvrir sa Parole et à prier, il nous parle et nous envoie en mission. Cette mission quotidienne comprend la mise en œuvre de nos dons spirituels, qui nous sont donnés pour glorifier Dieu et servir le bien commun. Romains 12.1 nous exhorte à offrir nos corps comme un sacrifice vivant, saint, agréable à Dieu, ce qui est notre culte spirituel. Nous trouvons notre but dans l’exercice de nos dons spirituels. Au fond, l’adoration est affaire d’obéissance et de sacrifice. Passer du temps avec Dieu nous apprend à discerner sa voix."], ["h", "Le mode de vie « Me voici »"], ["p", "Les déclarations « Me voici » à travers l’Écriture sont le fruit d’un mode de vie fondé sur l’écoute. Abraham et d’autres qui ont accompli leur vocation ont maîtrisé le rythme quotidien consistant à faire du temps pour Dieu. En établissant cette habitude, vous êtes sûr de ne jamais vous perdre dans le bruit du monde. Au contraire, vous êtes placé chaque jour en position de recevoir vos ordres de marche, alimenté par une intimité avec le Père qui donne un but à chaque pas. Nous vivons la Parole, la prière et l’adoration afin de vaincre par le sang de l’Agneau et par la parole de notre témoignage."], ["h", "Rester en rythme avec Dieu"], ["p", "Le rythme quotidien de la Parole, de la prière et de l’adoration est le battement vital d’une vie vécue dans la cible. En faisant de la place chaque matin pour écouter, vous échangez le bruit du monde contre la direction claire du Père et les ordres de marche précis dont vous avez besoin pour votre journée. Cette intimité constante transforme votre écoute en obéissance active, où vous êtes prêt à dire : « Me voici ». En définitive, ces habitudes vous gardent étroitement attaché au Cep, permettant à votre vie de produire naturellement du fruit qui glorifie Dieu et sert le bien commun."]], "q": [["Pourquoi établir un temps de recueillement quotidien avec Dieu est-il essentiel pour devenir disciple ?", "Voir le début de la Section 2.", 4], ["Quels sont les bienfaits du temps quotidien dans la Parole de Dieu ?", "Voir « Parole quotidienne ».", 7], ["Quels sont les bienfaits de la prière quotidienne ?", "Voir « Prière quotidienne ».", 19], ["Quelles sont les actions de l’adoration quotidienne ?", "Indice : il ne s’agit pas de musique ! Voir « Adoration quotidienne ».", 41], ["Comment le mode de vie « Me voici » est-il lié au rythme de la Parole, de la prière et de l’adoration ?", "Voir « Rester en rythme avec Dieu ».", 45]]}, {"id": "s3", "k": "Section 3", "t": "Être et faire des disciples", "b": [["h", "Aperçu de la section :"], ["h", "1) Être disciple"], ["li", "a. Répondre à Dieu"], ["li", "b. Répondre à un berger"], ["li", "c. Répondre à nos circonstances"], ["h", "2) Faire des disciples"], ["h", "Être disciple"], ["p", "Suivre Jésus en écoutant la voix de Dieu et en y répondant."], ["h", "1a) Répondre à Dieu"], ["p", "Être disciple, c’est un mode de vie de réponse active et de disciplines développées, dans lequel vous abandonnez votre cœur au plan de Dieu pour votre vie par le rythme quotidien de la Parole, de la prière et de l’adoration."], ["p", "En établissant un rythme quotidien de temps avec Dieu, nous apprenons à écouter sa voix et finalement à nous aligner sur sa volonté. Si nous écoutons, il parlera, comme nous le voyons maintes fois dans l’Écriture. Cette attitude de réponse s’étend à ceux qui nous recherchent avec amour pour notre maturité spirituelle. Leur répondre avec reconnaissance et leur permettre de parler dans notre vie nous profite immensément. Enfin, nous sommes appelés à être « dans la cible » dans notre monde de tous les jours, voyant nos circonstances comme des occasions d’être sel et lumière. Répondre à Dieu, à notre berger et à nos circonstances est l’œuvre essentielle d’être disciple."], ["p", "C’est le fondement de notre vie. Par le rythme quotidien de la Parole, de la prière et de l’adoration, nous passons du bruit du monde à une attitude d’écoute."], ["li", "La promesse : si nous créons l’espace pour écouter, il est fidèle pour nous parler."], ["li", "Le but : l’alignement. Nous ne recevons pas seulement de l’information ; nous ajustons notre vie pour qu’elle corresponde à son cœur."], ["p", "Au cœur de ce mode de vie se trouve une attitude précise du cœur : la volonté de dire « Me voici ». Cette expression est l’expression ultime de la disponibilité ; elle signifie que vous écoutez et que vous êtes prêt à partir avant même de connaître la destination."], ["h", "Quand nous disons « Me voici »"], ["p", "Quand nous disons « Me voici », nous déclarons notre disponibilité à Dieu. C’est une réponse qui se produit dans le lieu de calme de notre rythme quotidien avant même que nous ne nous engagions dans le monde. En maintenant un mode de vie de Parole, de prière et d’adoration, nous demeurons en Christ, ce qui apporte une véritable communion et intimité avec Dieu. Cette connexion est le noyau central de notre vie spirituelle, comme Jésus l’a décrit :"], ["p", "« Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire. » (Jean 15.5 ESV, traduction libre)"], ["p", "« Me voici » n’est pas une réponse à une liste de tâches ; c’est une réponse à la Présence du Père. Cela signifie que, que Dieu nous appelle à nous reposer, à nous repentir ou à tendre la main à un voisin, notre réponse est déjà « Oui » parce que nous vivons comme une partie du cep de la vie."], ["h", "Quand Abraham a dit « Me voici »"], ["h", "La perspective de Moriya : six épreuves de la réponse « Me voici »"], ["p", "Le récit d’Abraham sur le mont Moriya est une excellente métaphore de la vie d’un disciple. Il révèle que la réponse « Me voici » n’est pas une déclaration ponctuelle, mais une attitude continue à maintenir tout au long du chemin de la foi. En examinant Genèse 22, nous voyons six épreuves distinctes qui accordent notre cœur à la fréquence de la voix de Dieu et à l’ampleur de sa fidélité. Pendant que l’Écriture raconte le voyage d’Abraham jusqu’au sommet du mont Moriya, repérez les trois fois où il a répondu par les mots « Me voici »."], ["h", "Épreuve 1 : Sommes-nous à l’écoute de la mission ?"], ["p", "Verset 1 : Après ces choses, Dieu mit Abraham à l’épreuve et lui dit : « Abraham ! » Et il répondit : « Me voici. »"], ["p", "Ce passage commence en disant que Dieu a mis Abraham à l’épreuve en l’appelant par son nom. Il ne dit pas qu’il l’a mis à l’épreuve en lui confiant immédiatement une mission. La réponse d’Abraham a plutôt été la clé qui a ouvert la promesse pour sa vie. Nous pouvons en déduire qu’Abraham avait l’habitude d’écouter la voix de Dieu, car au moment où Dieu l’a appelé, il a répondu aussitôt par la simple réponse : « Me voici. » Cette épreuve n’était pas pour prouver la fidélité d’Abraham envers Dieu"], ["h", "Épreuve 2 : Obéissons-nous à la mission ?"], ["p", "Versets 2-3 : Dieu dit : « Prends ton fils, ton unique, celui que tu aimes, Isaac, et va-t’en au pays de Moriya, et là offre-le en holocauste sur l’une des montagnes que je te dirai. » Abraham se leva de bon matin, sella son âne et prit avec lui deux de ses serviteurs et son fils Isaac. Il fendit le bois pour l’holocauste, puis se leva et alla au lieu que Dieu lui avait indiqué. »"], ["p", "Dès qu’Abraham a répondu à Dieu, il a reçu sa mission, un ordre qui mettait sa foi à l’épreuve et exigeait d’agir immédiatement. Ces versets montrent que l’obéissance d’Abraham a été à la fois totale et immédiate. Il s’est occupé de chaque détail, jusqu’à fendre le bois pour l’holocauste qui devait consumer son fils, le fils même qui était l’accomplissement de la promesse de Dieu."], ["h", "Épreuve 3 : L’épreuve du temps"], ["p", "Verset 4 : « Le troisième jour, Abraham leva les yeux et vit le lieu de loin. »"], ["p", "Ce seul verset montre qu’Abraham a vu sa destination de loin. Il comprenait que la destination était éloignée et qu’il faudrait beaucoup de temps et un effort soutenu pour gravir la montagne de foi devant lui. Le discipulat est souvent un long chemin entre le « oui » initial et la provision finale."], ["h", "Épreuve 4 : Quel est notre témoignage devant le monde dans l’adversité ?"], ["p", "Verset 5 : « Abraham dit à ses serviteurs : “Restez ici avec l’âne ; moi et le garçon, nous irons jusque-là pour adorer, puis nous reviendrons vers vous.” »"], ["p", "Abraham savait que ses serviteurs observaient comment il réagirait à l’ordre de Dieu. Il a saisi cette occasion pour parler avec foi. Même face à ce qui semblait être une promesse brisée, il a témoigné que lui et Isaac iraient non seulement ensemble à la montagne, mais qu’ils en reviendraient tous les deux. Malgré des instructions en apparence contradictoires, Abraham a cru que la promesse de Dieu l’emporterait sur le coût de son obéissance sacrificielle."], ["p", "Cela soulève la question : que dirait le monde de notre témoignage en nous voyant affronter l’adversité ? Quand la pression monte et que l’issue est incertaine, nous plaignons-nous de nos circonstances ou affirmons-nous notre foi en la fidélité de Dieu ? Abraham a prouvé au monde qu’il était un homme fidèle en choisissant d’adorer plutôt que de vaciller."], ["h", "Épreuve 5 : Quel est notre témoignage devant ceux que nous aimons dans l’adversité ?"], ["p", "Versets 6-8 : « Abraham prit le bois de l’holocauste et le mit sur son fils Isaac. Il prit dans sa main le feu et le couteau. Et ils marchaient tous les deux ensemble. Isaac dit à son père Abraham : “Mon père !” Il répondit : “Me voici, mon fils.” Isaac dit : “Voici le feu et le bois, mais où est l’agneau pour l’holocauste ?” Abraham répondit : “Dieu pourvoira lui-même à l’agneau pour l’holocauste, mon fils.” Et ils marchaient tous les deux ensemble. »"], ["p", "Il est parfois plus facile de témoigner de la fidélité de Dieu à des étrangers qu’à ceux qui nous sont les plus proches. Au verset six, Abraham fait porter à Isaac le bois pour l’offrande pendant qu’il porte le feu et le couteau. Imaginez le tumulte dans l’âme d’Abraham quand Isaac demanda : « Où est l’agneau pour l’holocauste ? » La réponse d’Abraham fut une déclaration de foi : Dieu pourvoirait à l’agneau. Avant même de voir le bélier dans le buisson, il avait foi que Dieu pourvoirait."], ["h", "Épreuve 6 : Sommes-nous à l’écoute pendant la mission ?"], ["p", "Versets 9-12 : Lorsqu’ils furent arrivés au lieu que Dieu lui avait indiqué, Abraham y bâtit l’autel, disposa le bois, lia son fils Isaac et le mit sur l’autel, par-dessus le bois. Puis Abraham étendit la main et prit le couteau pour égorger son fils. Mais l’ange de l’Éternel l’appela du ciel et dit : « Abraham ! Abraham ! » Il répondit : « Me voici. » L’ange dit : « Ne porte pas la main sur le garçon et ne lui fais aucun mal, car je sais maintenant que tu crains Dieu, puisque tu ne m’as pas refusé ton fils, ton unique. »"], ["li", "Fidélité continue : Abraham bâtit l’autel, lia son fils et leva le couteau. Il était pleinement prêt à accomplir l’impensable sacrifice."], ["li", "Écouter pendant la mission : même dans un moment incroyablement déchirant et chargé d’émotion, la seconde même avant que le couteau ne mette fin à une vie, Dieu appela de nouveau Abraham. Abraham répondit encore : « Me voici. » À ce moment, Dieu l’arrêta, pourvut au bélier et réitéra la promesse qu’Abraham serait le père d’une grande nation. Si Abraham n’avait pas écouté la voix de Dieu pendant la mission, cela lui aurait coûté son héritage selon la promesse de Dieu."], ["p", "Quand Ésaïe a dit « Me voici »"], ["p", "« J’entendis la voix du Seigneur, qui disait : “Qui enverrai-je, et qui marchera pour nous ?” Et je répondis : “Me voici, envoie-moi !” » (Ésaïe 6.8 ESV, traduction libre)"], ["p", "En Ésaïe 6.1-8, Dieu révèle sa gloire à Ésaïe dans une vision qui le bouleverse, tandis que les séraphins crient : « Saint, saint, saint est l’Éternel des armées », et à ce moment Ésaïe entrevoit vraiment la sainteté de Dieu ; la crainte du Seigneur le saisit, et il s’humilie aussitôt, confessant : « Malheur à moi… je suis un homme dont les lèvres sont impures », reconnaissant à la fois son propre péché et l’état de son peuple ; pourtant Dieu répond non par le jugement mais par la grâce, envoyant un séraphin toucher les lèvres d’Ésaïe avec un charbon ardent et déclarer sa culpabilité ôtée et son péché expié ; ce n’est qu’après cette purification que le Seigneur demande : « Qui enverrai-je, et qui marchera pour nous ? » et Ésaïe, désormais transformé par la crainte de Dieu et relevé par sa miséricorde, répond par un abandon total : « Me voici, envoie-moi ! »"], ["p", "En réponse à l’abandon d’Ésaïe, « Me voici, envoie-moi ! », Dieu le charge non d’un ministère facile ou célébré, mais de proclamer fidèlement sa parole à un peuple qui entendrait sans comprendre ; pourtant, par cet appel, la relation d’Ésaïe avec Dieu passe d’un moment de conscience craintive du péché à une vie de communion restaurée et d’obéissance pleine de sens, et bien que sa mission ne produise pas de résultats visibles immédiats, sa fidélité a fait de lui un serviteur de Dieu dont les paroles seraient conservées et répétées à travers les générations, démontrant que si l’obéissance n’a pas rendu sa vie plus facile, elle l’a alignée sur la volonté de Dieu, profondément utile et éternellement significative."], ["p", "Quand Marie a dit « Me voici »"], ["p", "« Marie dit : “Voici la servante du Seigneur ; qu’il me soit fait selon ta parole.” » (Luc 1.38 ESV, traduction libre)"], ["p", "La vie de Marie est un puissant témoignage du mode de vie de réponse, en particulier lorsque l’ange Gabriel lui rendit visite avec la nouvelle qu’elle porterait le Messie. Bien que les circonstances fussent humainement impossibles et dussent entraîner un lourd coût social, sa réponse fut un abandon immédiat et total à l’initiative de Dieu."], ["p", "En se déclarant servante, elle annonçait sa totale disponibilité au Père. Elle n’a pas demandé une feuille de route détaillée pour les trente années suivantes ; elle a simplement remis son corps, sa réputation et son avenir au plan de Dieu avant de savoir comment il se déroulerait."], ["p", "Le « Me voici » de Marie montre qu’être disciple, c’est répondre à Dieu même lorsque son appel interrompt nos projets personnels ou bouscule notre confort. Parce qu’elle est restée dans une attitude de disponibilité, elle est devenue le vase par lequel la Promesse est entrée dans le monde, nous montrant que l’intimité avec Dieu se trouve dans la réponse simple et humble : « Qu’il me soit fait selon ta parole. »"], ["h", "« Me voici » est notre façon de répondre"], ["p", "Le parcours d’Abraham prouve que la réponse « Me voici » doit rester active du pied de la montagne jusqu’au sommet. Nous sommes appelés à écouter la mission, à obéir aux instructions et à continuer d’écouter même dans le feu de l’épreuve. Quand nous gardons cette attitude, nous découvrons que notre obéissance ne remplit pas seulement une exigence ; elle nous place en position de voir toute l’ampleur de la provision de Dieu."], ["h", "1b) Répondre à votre berger"], ["p", "Être disciple implique l’humilité de reconnaître que Dieu parle et conduit souvent par la voix de ceux qu’il a placés comme couverture spirituelle sur nous et autour de nous. Un mode de vie de réponse exige que nous soyons enseignables, mettant de côté notre orgueil pour suivre, écouter et appliquer les conseils de responsables spirituels qui sont investis dans notre croissance. Un vrai changement de vie se produit rarement dans l’isolement ; il est souvent le résultat d’un profond investissement spirituel de la part d’un mentor ou d’un berger qui nous aide à voir ce que nous ne pouvons pas voir en nous-mêmes. Cette attitude d’honneur est enracinée dans la manière dont nous considérons ceux que Dieu a"], ["h", "établis pour nous conduire :"], ["p", "« Nous vous demandons, frères, d’avoir de la considération pour ceux qui travaillent parmi vous, qui vous dirigent dans le Seigneur et qui vous avertissent, et de les entourer d’une très haute estime dans l’amour à cause de leur œuvre. Vivez en paix entre vous. » (1 Thessaloniciens 5.12-13 ESV, traduction libre) Quand nous répondons à nos bergers, nous ne suivons pas seulement une personne ; nous répondons à l’ordre établi par Dieu qui protège notre âme et nous garde dans la cible."], ["h", "Relation de disciple : Timothée et Paul"], ["p", "« Retiens le modèle des saines paroles que tu as entendues de moi, dans la foi et l’amour qui sont en Jésus-Christ. » (2 Timothée 1.13 ESV, traduction libre) La relation entre l’apôtre Paul et Timothée est un bel exemple de relation pastorale. Timothée était un jeune homme qui luttait contre une timidité naturelle et le lourd poids de son appel, mais Paul a investi en lui comme un père dans la foi. Paul a conduit Timothée par une correction constante, des encouragements et des instructions précises. La croissance de Timothée jusqu’à devenir un responsable stable n’a été possible que parce qu’il a constamment répondu à l’accompagnement de Paul. Paul lui a rappelé que son autorité spirituelle découlait du fait de suivre le « modèle des saines paroles » incarné par son berger."], ["h", "Comment Timothée a bénéficié de son berger :"], ["li", "Vaincre la peur : grâce à la conduite de Paul, la timidité naturelle de Timothée a été remplacée par un esprit de force, d’amour et de maîtrise de soi (2 Timothée 1.7)."], ["li", "Direction claire : Timothée n’avait pas à deviner comment diriger ; il avait un plan éprouvé à suivre."], ["li", "Autorité transmise : en répondant à la direction de Paul, Timothée s’est vu finalement confier son propre ministère, prouvant que ceux qui suivent bien sont équipés pour bien diriger."], ["h", "Relation de disciple : Ruth et Noémi"], ["p", "« Elle lui répondit : “Je ferai tout ce que tu me dis.” » (Ruth 3.5 ESV, traduction libre)"], ["p", "Le changement de vie que nous voyons chez Ruth est un puissant témoignage de la valeur de se soumettre à un berger. Ruth, une étrangère veuve qui avait tout perdu, a choisi de se lier à la couverture spirituelle de Noémi. Noémi lui a offert une conduite stratégique qui l’a placée en position pour un avenir qu’elle ne pouvait pas voir. La rédemption de Ruth n’a été possible que parce qu’elle a répondu à l’accompagnement de Noémi avec une totale humilité. Quand Noémi lui donna des instructions précises et difficiles sur la manière d’aborder Boaz sur l’aire de battage, Ruth ne s’appuya pas sur sa propre intelligence. Elle répondit : « Je ferai tout ce que tu me dis. »"], ["h", "Comment Ruth a bénéficié de sa bergère :"], ["li", "Un changement d’identité : grâce à la conduite de Noémi, Ruth a cessé de se voir comme une étrangère et a commencé à vivre comme une fille du Dieu d’Israël."], ["li", "Un positionnement stratégique : Noémi voyait le « champ » mieux que Ruth. Ses instructions ont placé Ruth en position d’être remarquée par Boaz, son proche parent et racheteur."], ["li", "Le fruit de l’héritage : parce que Ruth a répondu à la personne que Dieu a utilisée pour la guider, elle a été introduite dans la lignée directe du roi David et de Jésus-Christ."], ["h", "Ordres bibliques pour répondre à un berger"], ["li", "Répondre à la surveillance : « Obéissez à vos conducteurs et soumettez-vous à eux, car ils veillent sur vos âmes, comme devant en rendre compte. » (Hébreux 13.17 ESV, traduction libre)"], ["li", "Répondre à la formation : « Et il a donné… les bergers et les docteurs, pour équiper les saints en vue de l’œuvre du ministère, pour l’édification du corps de Christ. » (Éphésiens 4.11-12 ESV, traduction libre)"], ["li", "Répondre à l’exemple : « Souvenez-vous de vos conducteurs, qui vous ont annoncé la parole de Dieu. Considérez l’issue de leur vie, et imitez leur foi. » (Hébreux 13.7 ESV, traduction libre)"], ["li", "Répondre avec humilité : « De même, jeunes gens, soyez soumis aux anciens. Et tous, revêtez-vous d’humilité les uns envers les autres. » (1 Pierre 5.5 ESV, traduction libre)"], ["li", "Répondre à votre berger est le pont entre être disciple et faire un disciple. Lorsque nous nous laissons conduire, répondant avec le cœur de Ruth et la docilité de Timothée, nous vivons le genre de changement de vie qui ne se produit que par l’investissement spirituel. En honorant ceux qui veillent sur nos âmes, nous restons dans une attitude où Dieu peut nous façonner en responsables qui veilleront un jour sur d’autres."], ["h", "1c) Répondre à vos circonstances"], ["p", "Être disciple implique d’accueillir vos circonstances comme des occasions divines de répondre avec foi plutôt que de réagir par confiance en soi. Nous voyons souvent les situations inattendues comme des obstacles, mais dans la vie d’un disciple, ces moments sont le principal terrain d’entraînement à la maturité. Quand nous répondons correctement à notre situation, nous prouvons que notre confiance est dans la souveraineté de Dieu plutôt que dans la stabilité de notre environnement."], ["h", "Paul et Silas : répondre par l’adoration"], ["p", "Après avoir été battus et emprisonnés pour avoir prêché l’Évangile, Paul et Silas se retrouvèrent enchaînés dans une prison de Philippes. Plutôt que de se plaindre ou de désespérer, ils ont répondu à leurs circonstances par l’adoration et la prière."], ["p", "« Vers le milieu de la nuit, Paul et Silas priaient et chantaient les louanges de Dieu, et les prisonniers les écoutaient. » (Actes 16.25 ESV, traduction libre)"], ["h", "Les apôtres : répondre avec joie"], ["p", "Après avoir été arrêtés et battus pour avoir prêché au nom de Jésus, les apôtres reçurent des autorités l’ordre de cesser d’enseigner au sujet du Christ. Au lieu de partir découragés ou effrayés, ils se réjouirent d’avoir été jugés dignes de souffrir pour son nom."], ["p", "« Ils se retirèrent de devant le sanhédrin, joyeux d’avoir été jugés dignes de subir des outrages pour le nom. » (Actes 5.41 ESV, traduction libre)"], ["h", "Faire des disciples"], ["h", "Faire des disciples, c’est aller vers les gens"], ["p", "Faire des disciples, c’est modeler activement et enseigner aux autres à vivre une vie qui plaît au Seigneur. Vous les guidez pour qu’ils deviennent disciples tout comme vous êtes disciple de Jésus, vous tenant à leurs côtés pour cultiver l’Esprit pendant qu’ils apprennent à demeurer dans la vérité de l’Écriture et à l’appliquer à leur vie. Faire des disciples commence par construire des relations, car elles sont à la fois le terreau et le fruit du discipulat."], ["p", "Le terreau : les relations peuvent être un excellent terreau pour donner et recevoir un discipulat significatif, régulier et souvent pour la vie. Proverbes 27.17 dit : « Comme le fer aiguise le fer, ainsi un homme aiguise un autre homme. » Deux amis dans une relation de confiance ont une base solide pour traverser la joie, le deuil et se mesurer aux questions difficiles. Au sein d’une amitié centrée sur la foi, le Saint-Esprit peut guider deux personnes en recherche vers le fondement solide de la vérité. Ces relations offrent un terreau nourricier pour poser des questions difficiles sur Dieu, la Bible et notre foi, y compris nos propres combats personnels avec ces sujets. L’amitié est un terreau fertile pour la croissance spirituelle. Le fruit : les relations significatives sont souvent le fruit, le résultat naturel, d’un discipulat vécu ensemble. Un moment partagé de découverte spirituelle peut transformer deux étrangers en amis pour la vie, forgeant le genre de lien décrit en Proverbes 17.17 : une amitié qui « aime en tout temps » et qui est « née pour le temps de détresse »."], ["p", "Pensez aux moments de votre vie où une conversation spirituelle avec un ami vous a ouvert les yeux sur une vérité nouvelle, ou lorsque vous avez rejoint une classe ou un petit groupe pour étudier l’Écriture. Dans ces cadres, la recherche commune de Dieu agit comme un catalyseur de lien. Si nous apprenons certainement du Saint-Esprit dans la solitude, nos relations les plus profondes naissent parfois du terreau fertile d’apprendre, de grandir et de « lutter » avec la vérité aux côtés des autres."], ["h", "Modeler une vie partagée fait des disciples"], ["p", "Une communauté d’église saine est plus qu’un cercle social. C’est un laboratoire de discipulat où modeler une vie partagée et la formation spirituelle sont inséparablement liés. À travers l’Écriture, nous voyons que mûrir en Christ se produit rarement en vase clos. Jésus n’a pas seulement donné des conférences. Il a appelé douze disciples à une vie partagée pour démontrer que l’investissement spirituel le plus profond se fait dans le cadre d’une relation. Paul et Barnabas, ou Ruth et Noémi, n’étaient pas de simples compagnons. Le lien entre David et Jonathan montre que faire un disciple demande souvent de traverser le feu ensemble. Leur relation n’était pas un sous-produit de la proximité. Elle était le fruit d’un engagement mutuel envers les desseins de Dieu. Vivre en communauté prouve que Dieu utilise nos saisons les plus difficiles pour transformer des étrangers en un peuple uni et en disciples mûrs du Christ."], ["p", "Ils étaient des partenaires dans une mission qui s’encourageaient intentionnellement les uns les autres vers une vie plus semblable à celle du Christ. Modeler une vie partagée demande d’être assez proche pour que les autres voient comment la foi se vit en temps réel."], ["h", "Vivre en communauté fait des disciples"], ["p", "Le voyage des Israélites de l’esclavage à la Terre promise sert de modèle au discipulat collectif. Leur identité spirituelle s’est forgée non dans le confort, mais dans la rudesse d’endurer ensemble la misère et de voir des miracles. Cette expérience collective d’une nation montre que faire des disciples exige souvent de traverser le feu ensemble, laissant les épreuves partagées lier les cœurs d’une manière que la prospérité ne pourrait jamais faire. En vivant en communauté, un peuple errant s’est transformé en une nation unie, prouvant que Dieu utilise le poids d’une histoire partagée pour affiner le caractère de ses disciples et faire d’étrangers une famille."], ["p", "Faire partie d’une église exige que nous la construisions et l’entretenions. La communauté n’est pas quelque chose que nous trouvons ; c’est quelque chose que nous construisons. Tant de gens passent à côté de la bénédiction de la communion et gaspillent leur vie à errer d’une église à l’autre, cherchant une communauté sans jamais la trouver parce qu’ils refusent de la construire. Nous ne pouvons goûter le fruit de la communauté qu’en travaillant le terreau pour la bâtir. La communauté est une chose qui coûte. Quand nous nous concentrons uniquement sur le rassemblement du dimanche et manquons l’occasion de développer des relations, nous décourageons la formation de disciples. Pour vraiment faire des disciples, nous devons favoriser des espaces où le terreau de l’amitié est entretenu et où l’œuvre de bâtir la communauté est embrassée par tous."], ["h", "Le chemin relationnel : être connu, montré et accompagné dans la croissance"], ["p", "Le but d’une relation pastorale est que la personne accompagnée soit connue, soit accompagnée dans sa croissance et se voie montrer le chemin"], ["h", "Connu : le terreau de la relation"], ["p", "Le discipulat commence par apprendre à connaître la personne. En construisant une relation authentique, vous créez un espace où quelqu’un se sent assez en sécurité pour être vraiment connu. Cela reflète le lien du Berger en Jean 10 ; de même que les brebis reconnaissent la « forme » de la voix du Berger, un ami apprend à entendre le cœur de Dieu à travers le ton d’une relation de confiance. Cela vous permet de répondre aux besoins et de parler la vie dans les situations pertinentes de celui que vous accompagnez."], ["h", "Montré : les semences de la vérité"], ["p", "Dans le terreau d’une relation, la vérité est semée par l’honnêteté. Vous montrez le chemin à un ami en ouvrant ensemble la Parole de Dieu et en étant transparent sur vos propres luttes et victoires. Cette combinaison de vérité biblique et de vulnérabilité personnelle permet aux « semences » de la vérité dans la foi de prendre racine sans crainte du jugement. Il est impératif de semer les semences de la vérité de Dieu dans l’Esprit et non dans notre propre chair, car nous savons que ce que nous semons, nous le moissonnerons."], ["h", "Accompagné dans la croissance : le fruit de la croissance"], ["p", "La maturité spirituelle est la moisson qui vient de demeurer en Christ et d’appliquer les vérités à notre vie. Alors que vous marchez ensemble dans la vie, le « fruit » est un disciple qui ressemble davantage au Christ et une foi qui résiste à l’épreuve du temps. Nous plantons et nous arrosons, mais seul le Seigneur peut faire sortir le fruit d’un cœur. Il nous utilise pour planter, arroser et prendre soin des personnes afin que la semence puisse prendre racine et porter de bons fruits."], ["h", "Le Grand Mandat : la recherche des perdus"], ["p", "Ceci représente le cycle complet de la formation de disciples. Il commence par le fait que nous sommes recherchés et confrontés à la vérité de Jésus ; une fois que nous répondons, notre parcours d’« être » disciple commence. Nous sommes ensuite accompagnés pour demeurer, appliquer et grandir dans notre foi et notre communion avec Dieu. En grandissant, l’amour nous pousse à accepter le mandat de faire des disciples en allant vers les perdus et en les invitant dans une relation avec Dieu et avec nous. Cela boucle le cycle : évangéliser, c’est simplement aimer assez le monde pour être un disciple qui fait davantage de disciples."], ["li", "Le mandat : « Allez, faites de toutes les nations des disciples, les baptisant au nom du Père, du Fils et du Saint-Esprit, et leur enseignant à observer tout ce que je vous ai prescrit. » (Matthieu 28.19-20 ESV, traduction libre)"], ["li", "L’identité : « Il leur dit : “Suivez-moi, et je ferai de vous des pêcheurs d’hommes.” » (Matthieu 4.19 ESV, traduction libre)"], ["li", "La recherche : « Car le Fils de l’homme est venu chercher et sauver ce qui était perdu. » (Luc 19.10 ESV, traduction libre)"], ["li", "La puissance : « Mais vous recevrez une puissance, le Saint-Esprit survenant sur vous, et vous serez mes témoins… jusqu’aux extrémités de la terre. » (Actes 1.8 ESV, traduction libre)"], ["li", "L’appel : « Nous sommes donc ambassadeurs pour Christ, comme si Dieu exhortait par nous. Nous vous en supplions au nom de Christ : soyez réconciliés avec Dieu. » (2 Corinthiens 5.20 ESV, traduction libre)"], ["h", "Le pouvoir de raconter notre histoire pour faire des disciples"], ["p", "Nous avons à notre disposition un outil incroyablement puissant pour faire des disciples. Chaque chrétien le possède : raconter notre histoire. L’Apocalypse enseigne que nous vainquons par le sang de l’Agneau et par la parole de notre témoignage, présentant le récit comme une arme qui vainc l’ennemi. Raconter notre histoire nous donne le pouvoir de vaincre l’ennemi parce qu’elle fait passer l’Évangile d’un concept lointain et abstrait à une réalité vivante qu’on ne peut pas réfuter. Quand nous parlons avec vérité de la façon dont le Christ nous a tirés des ténèbres, nous démantelons activement les mensonges de l’accusateur et le privons de son pouvoir de nous garder — nous ou ceux qui écoutent — enchaînés dans la honte et le silence. En partageant les manières précises dont Dieu a racheté notre passé, nous faisons de notre histoire un champ de bataille où la défaite de l’ennemi est rendue publique. Raconter notre histoire inspire et encourage les autres à chercher Dieu d’une manière qui lui permette d’accomplir son œuvre miraculeuse en eux, faisant naître une nouvelle étincelle d’espoir dans leurs propres circonstances. En voyant la réalité de la puissance de Dieu à travers notre vie, ils sont encouragés à rechercher leur propre transformation afin de pouvoir, à leur tour, raconter leur histoire à un monde dans le besoin."]], "q": [["Être disciple, c’est vivre un mode de vie de réponse à trois choses précises. Quelles sont-elles ?", "Voir « Être disciple ».", 6], ["D’après l’histoire d’Abraham sur le mont Moriya, que signifie vivre un mode de vie « Me voici » dans votre marche quotidienne avec Dieu ?", "Regardez la perspective de Moriya.", 20], ["Quelle est l’activité principale de la formation de disciples ?", "Voir le début de « Faire des disciples ».", 84], ["Comment une relation peut-elle être décrite à la fois comme le « terreau » et le « fruit » du discipulat ?", "Voir « Le terreau » et « Le fruit ».", 97], ["Quelles sont les trois actions (ou étapes) précises du chemin relationnel utilisées dans une relation pastorale ?", "Voir « Le chemin relationnel ».", 95]]}, {"id": "s4", "k": "Section 4", "t": "Aimer et servir", "b": [["h", "Aperçu de la section :"], ["h", "1) Le mode de vie d’aimer et de servir"], ["h", "2) Les quatre fondements d’aimer et de servir"], ["p", "Un vrai disciple du Christ vit une vie d’amour et de service. Aimer et servir est le débordement naturel de demeurer en Christ (Jean 15.12-13). L’amour s’exprime par le cœur, et le service s’exprime par les mains."], ["h", "1) Le mode de vie d’aimer et de servir"], ["h", "Aimer"], ["p", "Quand nous franchissons le seuil de l’amour avec une personne, nous gagnons un point de vue spirituel qui l’aide à voir comment Dieu veut révéler sa gloire dans sa vie. Nous pouvons aussi décrire le piège que Satan lui a tendu ; notre amour pour une autre personne lui offre cet avantage, et nous profitons de l’amour de la même façon. C’est le fruit de l’amour. Cette profondeur de dévouement n’est pas passive ; nous ne pouvons vraiment aimer que ce pour quoi nous avons fait des sacrifices. Nous l’avons appris du modèle du Christ sur la croix, qui nous a montré la définition même de l’amour par son sacrifice ultime. En demeurant en Christ, Dieu conduit notre cœur à aimer ce qu’il aime."], ["h", "Servir"], ["p", "Servir quelqu’un ouvre la porte pour l’aimer. Quand nous faisons un sacrifice pour quelqu’un, nous l’invitons à franchir avec nous le seuil de l’amour. Servir les autres ouvre la porte pour que la bénédiction de Dieu soit répandue dans leur vie. Quand nous servons les autres de façon désintéressée, cela les pousse à se demander : « Pourquoi font-ils cela ? » Porter cette question à Dieu lui permet d’accomplir son œuvre ; les gens voient notre service comme la bonté de Dieu, et cette bonté conduit à la repentance, ce qui ouvre la porte au discipulat. Servir, c’est simplement l’amour en action, la preuve extérieure que notre dévouement intérieur est sincère. Servir n’attend pas qu’on le demande ; il cherche activement le besoin. Il n’attend ni récompense, ni reconnaissance, ni réciprocité, trouvant sa satisfaction uniquement dans le fait de plaire à Dieu. Au-delà de répondre aux besoins, servir humilie l’âme et brise le pouvoir de l’égoïsme en nous. Cela aide à briser l’esclavage de notre chair, afin que la gloire de Dieu soit révélée en nous."], ["h", "2) Les quatre fondements d’aimer et de servir"], ["h", "Fondement 1 : Aimer et servir le Christ"], ["p", "Nous aimons et servons le Christ en demeurant en lui. Comme Jésus l’enseigne en Jean 15.5 : « Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire. » Sans cette connexion, nous ne pouvons rien faire qui ait une valeur éternelle. Aimer et servir le Christ, c’est rester réconciliés avec le Père par le Christ afin de pouvoir, à notre tour, être réconciliés avec le monde."], ["p", "Le ministère de la réconciliation nous est confié, et nous agissons comme des ambassadeurs qui aident un monde brisé à retrouver le chemin vers Dieu. Comme le déclare 2 Corinthiens 5.17-21 : « Si quelqu’un est en Christ, il est une nouvelle créature. Les choses anciennes sont passées ; voici, toutes choses sont devenues nouvelles. Et tout cela vient de Dieu, qui nous a réconciliés avec lui par Christ et nous a confié le ministère de la réconciliation ; car Dieu était en Christ, réconciliant le monde avec lui-même, en ne tenant pas compte aux hommes de leurs offenses, et il a mis en nous la parole de la réconciliation. » Concrètement, nous aimons et servons le Christ en établissant un rythme quotidien de Parole, de prière et d’adoration, qui garde notre cœur aligné sur le sien. Cette santé spirituelle déborde ensuite sur le monde lorsque nous partageons activement son amour par nos paroles et nos actes."], ["h", "Fondement 2 : Aimer et servir la famille"], ["p", "Nos familles sont les premières à bénéficier d’une juste relation avec le Christ. Elles profitent de notre maturité spirituelle, et elles peuvent souffrir de notre immaturité. Établir un Fondement Un solide est le seul moyen de bâtir un Fondement Deux solide. Le guide souligne que nous devons aimer et servir nos familles à chaque étape de la vie, y compris le mariage, les enfants et l’éducation. Nous devons nous engager à aimer et servir notre famille de toutes les manières dont elle s’exprime. Que les familles soient traditionnelles ou recomposées, nous sommes appelés à donner la priorité à ces relations en recherchant la paix."], ["p", "En prenant Romains 12.18 comme point d’ancrage, « S’il est possible, autant que cela dépend de vous, soyez en paix avec tous les hommes », nous abordons trois occasions de réconciliation. Premièrement, quand nous avons blessé quelqu’un, nous suivons Matthieu 5.23-24 pour aller le trouver. Deuxièmement, quand quelqu’un nous blesse, nous suivons Marc 11.25 et choisissons de pardonner. Troisièmement, si les efforts de réconciliation échouent, nous faisons tout notre possible pour aller vers eux avec amour et nous nous engageons à prier pour eux. Aimer et servir notre famille signifie aussi avoir une vision biblique de l’argent, en trouvant un équilibre entre faire de la famille une priorité et assumer les responsabilités de subvenir à ses besoins financiers."], ["h", "Fondement 3 : Aimer et servir l’église"], ["p", "Nous aimons et servons l’église en nous engageant intentionnellement auprès des personnes qui composent le corps et en les accompagnant comme disciples. Ce n’est pas une organisation, c’est un organisme. Bâtir une église, c’est bâtir une communauté où les membres sont connus, guidés et accompagnés dans leur croissance. Nous le faisons en participant régulièrement aux rassemblements, en utilisant nos dons spirituels pour fortifier les autres et en soutenant financièrement la mission de l’église. Selon le guide, l’Église est une communauté « appelée hors du monde » (l’Ecclesia) de croyants unis par leur foi commune en Christ. Ce qu’est l’église se définit comme le Corps et l’Épouse du Christ : un organisme vivant, composé de membres divers qui fonctionnent dans l’unité pour refléter la gloire de Dieu au monde."], ["h", "Fondement 4 : Aimer et servir le monde"], ["p", "Le dernier fondement est bâti sur le Grand Mandat de Matthieu 28.18-20, où nous allons sous l’autorité du Christ faire des disciples de toutes les nations. Nous aimons et servons le monde en pratiquant une hospitalité radicale, ouvrant nos maisons et notre vie aux étrangers et aux voisins pour construire des relations sans arrière-pensées (Hébreux 13.2). Nous recherchons la justice et la miséricorde en défendant les vulnérables et en répondant aux besoins physiques des marginalisés (Michée 6.8). Nous offrons la prière d’intercession, parlant à Dieu des perdus avant de parler aux perdus de Dieu (1 Timothée 2.1). Nous vivons comme une « ville située sur une montagne », en maintenant une intégrité exemplaire sur nos lieux de travail afin que notre lumière brille par notre excellence (Matthieu 5.16). Nous partageons la raison de notre espérance, cherchant des portes ouvertes pour raconter notre histoire de salut avec douceur et respect (1 Pierre 3.15)."], ["p", "En définitive, nous aimons et servons le monde en nous engageant dans la discipline de faire des disciples. L’un des principaux outils pour faire des disciples est d’apprendre à raconter notre histoire avec vérité et transparence afin que d’autres voient comment Dieu a agi dans notre vie. L’Apocalypse enseigne que nous vainquons par le sang de l’Agneau et par la parole de notre témoignage. Quand nous racontons notre histoire, cela profite à nous-mêmes et à la personne qui entend de première main l’œuvre de Dieu en nous."]], "q": [["Selon la section « Aimer », quel est le bienfait spirituel, ou « fruit », de franchir le seuil de l’amour avec une autre personne ?", "Voir le début de « Aimer ».", 5], ["La section « Servir » décrit le service comme « l’amour en action ». Comment le service désintéressé conduit-il quelqu’un vers la porte du discipulat ?", "La bonté, puis les questions, puis la repentance.", 7], ["Selon le Fondement 2, pourquoi est-il important de donner la priorité à notre relation avec le Christ avant d’essayer de servir notre propre maison ?", "Voir « Fondement 2 ».", 13], ["Comment le fait de raconter votre témoignage personnel agit-il comme une arme contre l’ennemi ?", "Voir l’Apocalypse et « la parole de notre témoignage ».", 20]]}, {"id": "launch", "k": "Conclusion", "t": "Living On Target : le lancement du mode de vie", "b": [["p", "Vous avez terminé l’étape fondamentale de la formation Living On Target. C’est un profond accomplissement spirituel. Vous vous êtes engagé dans le dur travail du cœur, alignant votre vie sur le but ultime de la gloire de Dieu."], ["p", "Vous disposez désormais d’un plan tactique pour sortir du bruit de la vie quotidienne et entrer dans un mode de vie d’écoute, d’obéissance et de fécondité surnaturelle."], ["h", "Rappel des idées clés"], ["p", "Saisissez les quatre fondements de la cible que vous avez établis tout au long de cette formation :"], ["h", "● Notre rendez-vous avec Dieu"], ["p", "« Aussi, que nous soyons chez nous ou en exil, nous nous faisons un point d’honneur de lui plaire. » – 2"], ["h", "Corinthiens 5.9"], ["p", "Notre but premier est de vivre une vie qui plaît à Dieu, sachant qu’un jour nous nous tiendrons devant le tribunal de Christ pour rendre compte de nos actes. Cette responsabilité n’est pas une source de crainte mais une boussole quotidienne, où une sainte crainte et la révérence devant la puissance de Dieu éclairent son caractère, nous ancrent dans son amour inébranlable et nous motivent à persuader les autres."], ["h", "● Le rythme de la Parole, de la prière et de l’adoration"], ["h", "« Ta parole est une lampe à mes pieds, et une lumière sur mon sentier. » – Psaume 119.105"], ["p", "Une relation intime avec Dieu exige un temps de recueillement quotidien qui synchronise notre vie avec les battements de son cœur plutôt que de nous laisser dériver avec le monde. Nous engageons notre intelligence par l’autorité, la direction et le discernement de la Parole, nous livrons notre cœur en priant et en écoutant son programme, et nous déployons nos dons spirituels par un mode de vie d’adoration enraciné dans l’obéissance et le sacrifice."], ["h", "● Être et faire des disciples"], ["p", "« Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit… » – Jean 15.5 --- Être disciple, c’est maintenir une attitude continue de « Me voici » en disponibilité absolue, apprenant à répondre avec humilité et foi à Dieu, à nos bergers spirituels et à nos circonstances. À mesure que cette attitude mûrit, nous faisons activement des disciples en allant vers les gens, en modelant une vie partagée en communauté et en guidant les autres sur un chemin relationnel où ils sont vraiment connus, où la vérité leur est montrée et où ils grandissent jusqu’à la maturité spirituelle."], ["h", "● Aimer et servir"], ["h", "« Allez, faites de toutes les nations des disciples… » – Matthieu 28.19"], ["p", "La vie d’un disciple est animée par l’amour dans le cœur et s’exprime par un service désintéressé avec les mains, ce qui agit comme un catalyseur qui ouvre la porte pour que la bonté de Dieu conduise les autres à la repentance. Ce mode de vie se construit à partir d’une profonde connexion avec le Christ, déborde pour apporter la paix et la réconciliation à la famille, fortifie la communauté de l’église et met en œuvre le Grand Mandat en pratiquant l’hospitalité radicale et en partageant notre espérance avec le monde."], ["h", "Votre envoi : allez et multipliez"], ["p", "Le Grand Mandat est votre directive, et vous avez les outils pour l’exécuter. La vraie intendance consiste à prendre les investissements que Dieu a placés en vous et à les multiplier au sein de votre communauté. Vous êtes poussé par l’amour à aimer les autres."], ["p", "Engagez-vous dès aujourd’hui sur le chemin relationnel avec ces trois points d’action : 1. Cultivez le terreau (soyez connu) : construisez des relations authentiques où les gens se sentent en sécurité. Apprenez à connaître leur cœur, tout comme les brebis reconnaissent la voix du Berger en Jean 10."], ["p", "2. Plantez la semence (montrez le chemin) : ouvrez la Parole de Dieu avec les autres. Soyez transparent sur vos propres luttes et victoires, permettant à la vérité immuable de prendre racine sans crainte du jugement."], ["p", "3. Brandissez votre arme (racontez votre histoire) : souvenez-vous que nous vainquons par le sang de l’Agneau et par la parole de notre témoignage. Votre histoire personnelle de transformation est un atout indéniable qui démonte la tromperie, prive l’ennemi de son pouvoir et suscite un nouvel espoir chez ceux qui l’entendent."], ["h", "La mission :"], ["p", "Ne soyez pas comme le serviteur paralysé qui a caché son talent dans la terre à cause d’une idée fausse du cœur du Maître. Avancez avec une sagesse pleine de révérence, gravissez la montagne de la foi, et laissez votre vie porter naturellement du fruit pour son royaume."]], "q": []}]},I18N={"es": {"Discipleship Lifestyle Training": "Formación en el Estilo de Vida del Discipulado", "The Parable of the Talents: first, second, and third servant compared": "La parábola de los talentos: comparación del primer, segundo y tercer siervo", "Questions": "Preguntas", "Finish": "Finalizar", "‹ Home": "‹ Inicio", "‹ Back": "‹ Atrás", "Home ›": "Inicio ›", "Next ›": "Siguiente ›", "Reflect and Respond": "Reflexiona y responde", "Bookmark removed": "Marcador eliminado", "Bookmark added": "Marcador agregado", "Group: {g}": "Grupo: {g}", "Personal (on my own)": "Personal (por mi cuenta)", "Language": "Idioma", "Language changed": "Idioma cambiado", "Home": "Inicio", "Welcome": "Bienvenida", "Questions ({n} of {m} answered)": "Preguntas ({n} de {m} respondidas)", "Finish and download my PDF": "Finalizar y descargar mi PDF", "Bookmarks": "Marcadores", "How will you go through the training?": "¿Cómo harás la formación?", "On my own": "Por mi cuenta", "Read at your own pace. Your answers stay on this phone.": "Lee a tu propio ritmo. Tus respuestas se quedan en este teléfono.", "Start a group": "Crear un grupo", "Go through it together and chat in each section. You will get a code to share.": "Háganla juntos y conversen en cada sección. Recibirás un código para compartir.", "Join a group": "Unirse a un grupo", "Enter the code from the person who started your group.": "Escribe el código que te dio la persona que creó tu grupo.", "You are in the group {g}. Choosing an option above takes you out of it.": "Estás en el grupo {g}. Si eliges una opción de arriba, saldrás de él.", "Stay in this group": "Quedarme en este grupo", "Tip: if you add thi conectar. Revisa tu conexión a internet e inténtalo de nuevo.", "Chat": "Chat", "Ask a question or share something with your facilitator. It arrives by email, and your facilitator can reply to you by email or phone if you leave a way to reach you.": "Haz una pregunta o comparte algo con tu facilitador. Le llega por correo electrónico, y tu facilitador puede responderte por correo o por teléfono si dejas una forma de contactarte.", "Email or phone for a reply (optional)": "Correo o teléfono para la respuesta (opcional)", "Your message": "Tu mensaje", "Write your message here": "Escribe aquí tu mensaje", "Send message": "Enviar mensaje", "Only your facilitator sees this. It is not shared with your group.": "Solo tu facilitador ve esto. No se comparte con tu grupo.", "Please enter your name.": "Por favor, escribe tu nombre.", "Please write a message first.": "Por favor, escribe primero un mensaje.", "Sending…": "Enviando…", "Sent. Thank you! Your facilitator will get back to you.": "Enviado. ¡Gracias! Tu facilitador te responderá.", "Tap again to confirm": "Toca otra vez para confirmar", "Settings": "Configuración", "Mode": "Modo", "code {c}": "código {c}", "you are the host": "eres el anfitrión", "Personal: going through it on your own": "Personal: lo haces por tu cuenta", "Hide group members": "Ocultar miembros del grupo", "Show group members": "Mostrar miembros del grupo", "Change how I go through it": "Cambiar cómo hago la formación", "Changes the menus, buttons, training text and questions, and the language the coach replies in.": "Cambia los menús, los botones, el texto de la formación y las preguntas, y el idioma en que responde el coach.", "Reading voice": "Voz de lectura", "Used when you tap Listen at the bottom of a page.": "Se usa cuando tocas Escuchar en la parte inferior de una página.", "Voice": "Voz", "Speed": "Velocidad", "Hear a sample": "Escuchar una muestra", "Better voices can be downloaded in your phone's settings.": "Se pueden descargar mejores voces en la configuración de tu teléfono.", "Clear things on this phone": "Borrar datos de este teléfono", "Answers cleared": "Respuestas borradas", "Bookmarks cleared": "Marcadores borrados", "Tell your Story": "Cuenta tu historia", "Stories and videos shared by people going through the training.": "Historias y videos compartidos por personas que están haciendo la formación.", "Share a video": "Compartir un video", "This opens a private upload page. Only the facilitator can see what you upload, and nothing appears here until the facilitator approves it. Please only share videos of yourself, or of people who have said it is fine.": "Esto abre una página privada para subir archivos. Solo el facilitador puede ver lo que subes, y nada aparece aquí hasta que el facilitador lo apruebe. Por favor, comparte solo videos tuyos o de personas que hayan dado su permiso.", "Video": "Video", "Shared by {n}": "Compartido por {n}", "Open in a new tab": "Abrir en una pestaña nueva", "Videos could not be loaded right now. Check your connection and try again.": "No se pudieron cargar los videos en este momento. Revisa tu conexión e inténtalo de nuevo.", "No videos have been added yet. Check back soon.": "Aún no se han agregado videos. Vuelve pronto.", "{n} of {m} answered": "{n} de {m} respondidas", "Type your answer here": "Escribe aquí tu respuesta", "Answer to question {n}": "Respuesta a la pregunta {n}", "Check my answer": "Revisar mi respuesta", "When you tap Check my answer, that answer is sent to an AI service so your coach can write feedback.": "Al tocar Revisar mi respuesta, esa respuesta se envía a un servicio de inteligencia artificial para que tu coach escriba sus comentarios.", "Discuss with your group": "Conversar con tu grupo", "Open the chat for this section": "Abrir el chat de esta sección", "You completed this section": "Completaste esta sección", "Finished this section?": "¿Terminaste esta sección?", "It shows as complete in your Content list.": "Aparece como completada en tu lista de Contenido.", "Mark it complete to show it in your Content list.": "Márcala como completada para que aparezca en tu lista de Contenido.", "Mark as not complete": "Marcar como no completada", "Complete this section": "Completar esta sección", "Share your answers": "Comparte tus respuestas", "Your answers are saved on this phone. Choose what happens with this section.": "Tus respuestas se guardan en este teléfono. Elige qué pasa con esta sección.", "Keep private": "Mantener privado", "Submit to facilitator": "Enviar al facilitador", "Nothing leaves your phone unless you submit. You can change your mind at any time.": "Nada sale de tu teléfono a menos que lo envíes. Puedes cambiar de opinión en cualquier momento.", "Email (optional)": "Correo electrónico (opcional)", "This sends your answers for this section, and your coach chats, to your facilitator.": "Esto envía a tu facilitador tus respuestas de esta sección y tus conversaciones con el coach.", "Submit answers to facilitator": "Enviar respuestas al facilitador", "Submitted on {d}. You can submit again to send updates.": "Enviado el {d}. Puedes volver a enviar para mandar cambios.", "You answered {a} reflection questions.": "Respondiste {a} preguntas de reflexión.", "{n} of {m}": "{n} de {m}", "Make your own workbook: a copy of the training with your answers added after each Reflect and Respond page. The original pages stay exactly as they are. When it is ready you can also email it or text it.": "Crea tu propio cuaderno: una copia de la formación con tus respuestas agregadas después de cada página de Reflexiona y responde. Las páginas originales quedan exactamente como están. Cuando esté listo, también podrás enviarlo por correo o por mensaje de texto.", "Your name (printed on your answer pages)": "Tu nombre (se imprime en tus páginas de respuestas)", "Download this workbook with my answers": "Descargar este cuaderno con mis respuestas", "Download the original PDF without answers": "Descargar el PD function layout(){

function mergeMsgs(arr){if(!arr||!arr.length)return false;let ch=false;

    if(MSGS.some(x=>x.k===m.k))continue;MSGS.push(m);ch=true}
  MSGS.sort((a,b)=>a.k<b.k?-1:1);return ch}

  else if(t.dataset.kick){if(arm('k'+t.dataset.kick,renderGroup)){try{const j=await gapi({op:'kick',code:GRP.code,id:GRP.id,pid:t.dataset.kick});MEMBERS=j.members;GMSG=T('Member removed.')}catch(x){GMSG=gerr(x.code)}renderGroup()}}
  else if(t.id==='gbtn'){
    const name=$('gn').value.trim();GMSG='';
    try{t.disabled=true;let j;
      if(GT==='create'){const g=$('gg').value.trim();if(!name||!g)throw{code:'missing'};j=await gapi({op:'create',group:g,member:name})}
      else{const c=$('gc').value.trim().toUpperCase();if(!name||!c)throw{code:'missing'};j=await gapi({op:'join',code:c,member:name})}
      PROF.name=name;LS.set('dlt-profile',PROF);GRP={code:j.code,id:j.id,pid:j.pid,host:!!j.host,group:j.group,me:name};MODE='group';MSGS=[];CURSOR='';LASTREAD={};LS.set('dlt-lastread',{});LS.set('dlt-group',GRP);LS.set('dlt-mode',MODE);MEMBERS=j.members||[];syncUI();GMSG='';startBeat();renderGroup();$('screen').innerHTML=groupHTML()}
    catch(x){GMSG=gerr(x.code,x);t.disabled=false;renderGroup()}}
  else if(t.dataset.room){location.hash='#chat/'+t.dataset.room}
  else if(t.id==='csend'){sendChat()}
  else if(t.id==='fsend'){sendFac()}
  else if(t.id==='aqb'){askApp()}
  else if(t.dataset.del){const k=t.dataset.del;if(arm('del'+k,drawChat)){try{await gapi({op:'delmsg',code:GRP.code,id:GRP.id,k});const m=MSGS.find(x=>x.k===k);if(m){m.gone=true;m.text=''}}catch(x){const c=$('cerr');if(c)c.textContent=gerr(x.code)}drawChat()}}
  else if(t.dataset.back){e.preventDefault();const sid=t.dataset.back;go(sid,POS&&POS.sid===sid?{b:POS.b}:'first')}
  else if(t.dataset.vtest){voiceTest()}
  else if(t.dataset.showm){SHOWM=!SHOWM;renderSettings();if(SHOWM)beat()}
  else if(t.dataset.reset){const k=t.dataset.reset;if(arm('r'+k,renderSettings))doReset(k)}
});

/* Delivery: email via /api/notify (Resend) plus Netlify Forms as a stored backup. Success if either works. */
async function deliver(formBody,mail){
  const f=fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:formBody.toString()}).then(r=>{if(!r.ok)throw{status:r.status};return 1});
  const n=fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(mail)}).then(r=>{if(!r.ok)throw{status:r.status};return 1});
  const [a,b]=await Promise.allSettled([f,n]);
  if(a.status==='fulfilled'||b.status==='fulfilled')return;
  throw b.reason||a.reason||{status:0}}
async function sendFac(){const msg=t=>{const m=$('fmsg');if(m)m.textContent=t};
  const name=$('facn').value.trim(),contact=$('facc').value.trim(),message=$('facm').value.trim();
  if(!name){msg(T('Please enter your name.'));return}if(!message){msg(T('Please write a message first.'));return}
  PROF.name=name;if(/@/.test(contact))PROF.email=contact;LS.set('dlt-profile',PROF);
  const b=$('fsend');b.disabled=true;msg(T('Sending…'));
  const body=new URLSearchParams({'form-name':'facilitator','bot-field':'',subject:'Living On Target message from '+name,name,contact,group:GRP?GRP.group+' ('+GRP.code+')':'Individual',where:WHERE,message});
  try{await deliver(body,{kind:'facilitator',name,contact,group:GRP?GRP.group+' ('+GRP.code+')':'Individual',where:WHERE,message,lang:LANG,website:''});$('facm').value='';msg(T('Sent. Thank you! Your facilitator will get back to you.'))}
  catch(e){const m=$('fmsg');if(m)m.innerHTML=sendErr(e)+mailFallback('Living On Target message from '+name,'From: '+name+(contact?' ('+contact+')':'')+'\n\n'+message)}
  b.disabled=false}

}
function compHTML(s){const c=!!COMP[s.id];return '<div class="srow"><b>'+(c?T('You completed this section'):T('Finished this section?'))+'</b><p class="note">'+(c?T('It shows as complete in your Content list.'):T('Mark it complete to show it in your Content list.'))+'</p><button class="'+(c?'ghost':'primary')+'" id="compbtn">'+(c?T('Mark as not complete'):T('Complete this section'))+'</button></div>'}
function shareHTML(s){return shareCore(s)+compHTML(s)}
function shareCore(s){
  const st=SUB[s.id]||{choice:'private'},sub=st.choice==='submit';
  let h='<h2 class="t">'+T('Share your answers')+'</h2><p class="sub">'+T('Your answers are saved on this phone. Choose what happens with this section.')+'</p><div class="seg"><button data-ch="private" class="'+(sub?'':'on')+'">'+T('Keep private')+'</button><button data-ch="submit" class="'+(sub?'on':'')+'">'+T('Submit to facilitator')+'</button></div>';
  if(!sub)return h+'<p class="note">'+T('Nothing leaves your phone unless you submit. You can change your mind at any time.')+'</p>';
  const nm=PROF.name||(GRP&&GRP.me)||'';
  h+='<label for="sn">'+T('Your name')+'</label><input type="text" id="sn" autocomplete="name" value="'+esc(nm)+'"><label for="se">'+T('Email (optional)')+'</label><input type="email" id="se" autocomplete="email" value="'+esc(PROF.email||'')+'">';
  h+='<p class="note">'+T('This sends your answers for this section, and your coach chats, to your facilitator.')+'</p><button class="primary" id="sbtn">'+T('Submit answers to facilitator')+'</button>';
  h+='<p class="note ok" id="smsg" role="status">'+(st.at?esc(F('Submitted on {d}. You can submit again to send updates.',{d:new Date(st.at).toLocaleDateString(LOC())})):'')+'</p>';
  return h;
}
function finishHTML(s){
  return '<div class="in"><p class="k">'+esc(s.k)+'</p><h1 class="t">'+T('Finish')+'</h1><p class="sub">'+F('You answered {a} reflection questions.',{a:'<b>'+F('{n} of {m}',{n:totalA(),m:totalQ})+'</b>'})+'</p>'+
  '<p>'+T('Make your own workbook: a copy of the training with your answers added after each Reflect and Respond page. The original pages stay exactly as they are. When it is ready you can also email it or text it.')+'</p>'+
  '<label for="pn">'+T('Your name (printed on your answer pages)')+'</label><input type="text" id="pn" autocomplete="name" value="'+esc(PROF.name||'')+'">'+
  '<button class="primary" id="pdfb" style="margin-top:14px">'+T('Download this workbook with my answers')+'</button><p class="note ok" id="pdfmsg" role="status"></p><div id="pdfshare"></div>'+
  '<p class="note"><a href="training.pdf" download="Living-On-Target-Training.pdf" style="color:var(--acc)">'+T('Download the original PDF without answers')+'</a></p><p class="note"><a href="#home" style="color:var(--acc)">'+T('Back to home')+'</a></p></div>';
}
function renderPanel(s){$('qpanel').innerHTML=s.q.length?qHTML(s):finishHTML(s);s.q.forEach((_,j)=>draw(s.id+'-'+j))}
$('qpanel').addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;A[k]=e.target.value;LS.set('dlt-answers',A);const s=by[k.split('-')[0]],c=$('cnt');if(c)c.textContent=F('{n} of {m} answered',{n:nAns(s),m:s.q.length})});
$('qpanel').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('cb'))check(t.dataset.c);
  else if(t.classList.contains('sb'))sendReply(t.dataset.c);
  else if(t.dataset.ch){const s=by[cur.sid];SUB[s.id]=Object.assign({},SUB[s.id],{choice:t.dataset.ch});LS.set('dlt-sub',SUB);$('share').innerHTML=shareHTML(s)}
  else if(t.id==='sbtn')submitSection();
  else if(t.id==='compbtn'){const s=by[cur.sid];if(COMP[s.id])delete COMP[s.id];else COMP[s.id]=1;LS.set('dlt-comp',COMP);$('share').innerHTML=shareHTML(s);toast(COMP[s.id]?T('Section marked complete'):T('Marked as not complete'))}
  else if(t.id==='pdfb')makePDF()
  else if(t.id==='pdfem')sendPDF('email')
  else if(t.id==='pdftx')sendPDF('text')});
$('qpanel').addEventListener('click',e=>{const a=e.target.closest('a[data-hl]');if(a){e.preventDefault();const [sid,b]=a.dataset.hl.split(':');go(sid,{b:+b});setTimeout(()=>toast(T('Tap Content, then Questions, to come back to your question'),3500),700)}});
$('qpanel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ri-'))sendReply(e.target.id.slice(3))});

/* ---------- coach ---------- */
const INSTR=`You are a warm, encouraging discipleship coach inside the "Living On Target Discipleship Training" app. A learner just answered a reflection question. Use ONLY the TRAINING MATERIAL below and the Bible to respond; do not bring in outside teaching, other authors, or opinions. Rules: 1) Start with genuine encouragement and name what the learner got right. 2) If the answer is incomplete or off-track, do NOT hand over the full answer. Gently nudge: point to the specific heading or passage in the material to revisit and ask one guiding question. 3) If the answer is solid, affirm it and add one short insight from the material that deepens it. 4) If the learner replies in conversation, keep it going naturally; if they are still stuck after a couple of nudges or ask directly, you may give the answer briefly from the material. 5) If they ask something unrelated to the material, kindly steer back. 6) Keep each reply under 90 words, plain conversational text with no markdown, lists, or headings. Never invent quotes or Scripture references that are not in the material or clearly in the Bible.`;
function msgs(key){const [sid,j]=key.split('-'),s=by[sid],q=s.q[j],th=CH[key];
  const c=INSTR+'\n\nTRAINING MATERIAL (Section: '+s.t+'):\n'+s.b.filter(b=>b[0]!=='img').map(b=>b[1]).join('\n')+'\n\nQUESTION: '+q[0]+'\nWhere the training points learners: '+q[1]+'\n\nLEARNER ANSWER:\n'+th.ans;
  return [{role:'user',content:c}].concat(th.t.filter(x=>x.t).map(x=>({role:x.r==='a'?'assistant':'user',content:x.t})))}
function draw(key){const el=document.getElementById('ch-'+key),th=CH[key];if(!el)return;if(!th){el.innerHTML='';return}
  let h=th.t.map(x=>'<div class="bub '+(x.r==='a'?'ai':'me')+'">'+esc(x.t||T('Thinking…'))+'</div>').join('');
  if(th.err)h+='<p class="note">'+esc(th.err)+'</p>';
  if(!th.busy&&th.t.length&&!th.err)h+='<div class="rep"><input id="ri-'+key+'" placeholder="'+esc(T('Reply to your coach…'))+'" aria-label="'+esc(T('Reply to your coach'))+'"><button class="sb" data-c="'+key+'">'+T('Send')+'</button></div>';
  el.innerHTML=h}
async function ask(key){const th=CH[key];th.err='';th.busy=1;th.t.push({r:'a',t:''});draw(key);
  try{const r=await fetch('/api/coach',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:msgs(key),lang:LANG})});
    if(r.status===429)throw{c:'rate'};if(!r.ok)throw{c:'err'};const j=await r.json();th.t[th.t.length-1].t=j.text}
  catch(e){th.t.pop();th.err=e&&e.c==='rate'?T('The coach has reached its limit for now. Please try again later.'):T('Something went wrong getting feedback. Please try again.')}
  th.busy=0;LS.set('dlt-chats',CH);draw(key)}
function check(key){const ans=(A[key]||'').trim();if(ans.length<3){CH[key]={ans:'',t:[],err:T('Write your answer first, then tap Check my answer.')};draw(key);return}CH[key]={ans,t:[]};ask(key)}
function sendReply(key){const i=document.getElementById('ri-'+key),v=i&&i.value.trim();if(!v||!CH[key])return;CH[key].t.push({r:'u',t:v});ask(key)}

/* ---------- submit to facilitator (Netlify Forms) ---------- */
function composeAnswers(sid){const s=by[sid];return sk(s)+'\n\n'+s.q.map((q,j)=>'Q'+(j+1)+': '+q[0]+'\nAnswer: '+((A[sid+'-'+j]||'').trim()||'(no answer)')).join('\n\n')}
function composeChats(sid){const s=by[sid],out=[];s.q.forEach((q,j)=>{const th=CH[sid+'-'+j];if(th&&th.t&&th.t.length){out.push('Q'+(j+1)+': '+q[0]+'\nLearner: '+th.ans+'\n'+th.t.filter(x=>x.t).map(x=>(x.r==='a'?'Coach: ':'Learner: ')+x.t).join('\n'))}});return out.length?out.join('\n\n---\n\n'):'(no coach chats)'}
const FAC_EMAIL='brad@steelecreek.org';
const sendErr=e=>F('Could not send{e}. Check your connection and try again.',{e:e&&e.status?' ('+T('error')+' '+e.status+')':''});
function mailFallback(subject,body){const b=String(body).slice(0,1500)+(String(body).length>1500?'\n\n[Message shortened. Please ask me for the rest.]':'');return ' <a href="mailto:'+FAC_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(b)+'" style="color:var(--acc);font-weight:600"'+T('Send it with my email app instead')+'</a>'}
async function submitSection(){
  const s=by[cur.sid],msg=t=>{const m=$('smsg');if(m)m.textContent=t};
  const name=$('sn').value.trim(),email=$('se').value.trim();
  if(!name){msg(T('Please enter your name.'));return}
  if(!nAns(s)){msg(T('Write at least one answer first.'));return}
  PROF={name,email};LS.set('dlt-profile',PROF);
  const btn=$('sbtn');btn.disabled=true;msg(T('Sending…'));
  const body=new URLSearchParams({'form-name':'answers','bot-field':'',subject:'Living On Target answers: '+name+', '+s.k,name,email,group:GRP?GRP.group+' ('+GRP.code+')':'Individual',section:sk(s),answers:composeAnswers(s.id),chats:composeChats(s.id)});
  try{await deliver(body,{kind:'answers',name,email,group:GRP?GRP.group+' ('+GRP.code+')':'Individual',section:sk(s),sectionLabel:s.k,answers:composeAnswers(s.id),chats:composeChats(s.id),lang:LANG,website:''});
    SUB[s.id]={choice:'submit',at:Date.now()};LS.set('dlt-sub',SUB);msg(T('Submitted. Thank you!'))}
  catch(e){const m=$('smsg');if(m)m.innerHTML=sendErr(e)+mailFallback('Living On Target answers: '+name+', '+s.k,'From: '+name+(email?' ('+email+')':'')+'\n\n'+composeAnswers(s.id))}
  btn.disabled=false;
}

/* ---------- PDF with answers ---------- */
const REFLECT=[['s1',8],['s2',14],['s3',28],['s4',32]];
function wrapText(font,size,text,width){const out=[];String(text).split('\n').forEach(par=>{if(!par.trim()){out.push('');return}let line='';
  par.split(/\s+/).filter(Boolean).forEach(w=>{while(font.widthOfTextAtSize(w,size)>width){let n=w.length;while(n>1&&font.widthOfTextAtSize(w.slice(0,n),size)>width)n--;if(line){out.push(line);line=''}out.push(w.slice(0,n));w=w.slice(n)}
    const t=line?line+' '+w:w;if(font.widthOfTextAtSize(t,size)<=width)line=t;else{out.push(line);line=w}});out.push(line)});return out}
async function buildPDF(name){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const buf=await fetch('training.pdf').then(r=>{if(!r.ok)throw new Error('pdf');return r.arrayBuffer()});
  const src=await PDFDocument.load(buf),out=await PDFDocument.create();
  const F=await out.embedFont(StandardFonts.Helvetica),FB=await out.embedFont(StandardFonts.HelveticaBold);
  const okR=new Set(F.getCharacterSet()),okB=new Set(FB.getCharacterSet());
  const clean=(t,ok)=>Array.from(String(t)).map(c=>{const cp=c.codePointAt(0);if(cp===10)return c;if(cp===9)return' ';if(cp===0x200b||cp===0xfe0f)return'';if(ok.has(cp))return c;return cp>0xffff?'':'?'}).join('');
  const copy=async(a,b)=>{if(b<=a)return;const idx=[];for(let i=a;i<b;i++)idx.push(i);(await out.copyPages(src,idx)).forEach(p=>out.addPage(p))};
  const total=src.getPageCount(),size=src.getPage(Math.min(7,total-1)).getSize(),M=56,W=size.width-2*M;
  const charcoal=rgb(.23,.23,.23),coral=rgb(.88,.35,.25),gray=rgb(.45,.45,.45);
  const date=new Date().toLocaleDateString(LOC(),{year:'numeric',month:'long',day:'numeric'});
  function answerPages(s){
    let page,y,first=true;
    const np=()=>{page=out.addPage([size.width,size.height]);y=size.height-M;
      page.drawText(clean(T('Living On Target Discipleship Training'),okR),{x:M,y,size:9,font:F,color:gray});y-=26;
      page.drawText(clean(first?T('My Answers'):T('My Answers (continued)'),okB),{x:M,y,size:18,font:FB,color:charcoal});y-=20;
      page.drawText(clean(sk(s),okB),{x:M,y,size:11,font:FB,color:coral});y-=15;
      page.drawText(clean((name?name+'   |   ':'')+date,okR),{x:M,y,size:9,font:F,color:gray});y-=10;
      page.drawLine({start:{x:M,y},end:{x:M+W,y},thickness:1.5,color:coral});y-=24;first=false};
    np();
    s.q.forEach((q,j)=>{
      const ql=wrapText(FB,11,clean('Q'+(j+1)+'. '+q[0],okB),W),al=wrapText(F,11,clean((A[s.id+'-'+j]||'').trim()||T('(No answer)'),okR),W-16);
      if(y-ql.length*15-30<M)np();
      ql.forEach(l=>{page.drawText(l,{x:M,y,size:11,font:FB,color:charcoal});y-=15});y-=4;
      al.forEach(l=>{if(y<M+15)np();page.drawRectangle({x:M+2,y:y-4,width:2.2,height:16,color:coral});if(l)page.drawText(l,{x:M+14,y,size:11,font:F,color:(A[s.id+'-'+j]||'').trim()?charcoal:gray});y-=15});
      y-=14});
  }
  let at=0;
  for(const [sid,upto] of REFLECT){await copy(at,Math.min(upto,total));answerPages(by[sid]);at=upto}
  await copy(at,total);
  return out.save();
}
let pdfURL=null;
let PDFFILE=null;
async function sendPDF(kind){
  const title=T('My Living On Target workbook'),msg=t=>{const m=$('pdfmsg');if(m)m.innerHTML=t};
  try{if(PDFFILE&&navigator.canShare&&navigator.canShare({files:[PDFFILE]})){await navigator.share({files:[PDFFILE],title,text:kind==='email'?T('Here is my completed Living On Target workbook.'):title});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  msg(F('Your workbook was saved to this device. Attach it to the {x} that opens.',{x:kind==='email'?T('email'):T('text message')}));
  const body=encodeURIComponent(T('My Living On Target workbook is attached.'));
  location.href=kind==='email'?'mailto:?subject='+encodeURIComponent(title)+'&body='+body:'sms:?&body='+body;
}
async function makePDF(){
  const btn=$('pdfb'),msg=t=>$('pdfmsg').innerHTML=t;
  if(typeof PDFLib==='undefined'){msg(T('The PDF tool did not load. Please reload the app and try again.'));return}
  const name=$('pn').value.trim();PROF.name=name||PROF.name;LS.set('dlt-profile',PROF);
  btn.disabled=true;msg(T('Building your workbook…'));
  try{const bytes=await buildPDF(name);if(pdfURL)URL.revokeObjectURL(pdfURL);pdfURL=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    msg(F('Your workbook is ready. {l}.',{l:'<a href="'+pdfURL+'" download="Living-On-Target-My-Workbook.pdf" target="_blank" rel="noopener" style="color:var(--acc)">'+T('Tap here to download or open it')+'</a>'}));
    PDFFILE=null;try{PDFFILE=new File([bytes],'Living-On-Target-My-Workbook.pdf',{type:'application/pdf'})}catch(e){}
    $('pdfshare').innerHTML='<p class="note" style="margin-bottom:6px">'+T('Send it to yourself or someone else:')+'</p><div style="display:flex;gap:8px"><button class="ghost" id="pdfem">'+T('Email it')+'</button><button class="ghost" id="pdftx">'+T('Text it')+'</button></div><p class="note">'+T('On a phone, a list of apps opens with your workbook attached. Choose Mail or Messages.')+'</p>';
    try{const a=document.createElement('a');a.href=pdfURL;a.download='Living-On-Target-My-Workbook.pdf';document.body.appendChild(a);a.click();a.remove()}catch(e){}}
  catch(e){msg(T('Sorry, the PDF could not be built. Please try again.'))}
  btn.disabled=false;
}

/* ---------- read aloud ---------- */
let SP=0,TK=0,CURB=-2;
function vlist(){return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(LANG))}
function score(v){const n=v.name;let p=0;if(/natural|neural|online/i.test(n))p+=50;if(/siri/i.test(n))p+=45;if(/premium|enhanced/i.test(n))p+=40;if(/google (us|uk) english/i.test(n))p+=30;if(/samantha|ava|allison|susan|zoe|serena|daniel|karen|moira|tessa|aaron|nicky/i.test(n))p+=20;if(/en-US|es-ES|es-MX|fr-FR/i.test(v.lang))p+=5;if(/compact|albert|bad news|bells|boing|bubbles|cellos|deranged|good news|hysterical|organ|trinoids|whisper|zarvox|fred|junior|ralph|kathy|superstar|wobble|jester/i.test(n))p-=100;return p}
function pickV(){const l=vlist();if(!l.length)return null;if(VN){const m=l.find(v=>v.name===VN);if(m)return m}return l.slice().sort((a,b)=>score(b)-score(a))[0]}
function fillVoices(){if(!$('vs')||!$('rs'))return;if(!('speechSynthesis' in window)){$('vs').innerHTML='<option>'+T('Not available')+'</option>';return}
  const l=vlist().slice().sort((a,b)=>score(b)-score(a));
  $('vs').innerHTML='<option value="">'+T('Best voice (auto)')+'</option>'+l.map(v=>'<option value="'+esc(v.name)+'">'+esc(v.name)+'</option>').join('');$('vs').value=VN;
  $('rs').innerHTML=[0.8,0.9,1,1.1,1.25].map(x=>'<option value="'+x+'">'+F('{x}x speed',{x})+'</option>').join('');$('rs').value=String(RT)}
$('screen').addEventListener('change',e=>{
  if(e.target.id==='lgs'){setLang(e.target.value)}
  else if(e.target.id==='vs'){VN=e.target.value;LS.set('dlt-voice',VN);restartSpeak()}
  else if(e.target.id==='rs'){RT=parseFloat(e.target.value);LS.set('dlt-rate',RT);restartSpeak()}});
function voiceTest(){if(!('speechSynthesis' in window))return;try{stopSpeak();const u=new SpeechSynthesisUtterance(T('This is how I will read the training to you.'));const v=pickV();if(v){u.voice=v;u.lang=v.lang}u.rate=RT;speechSynthesis.speak(u)}catch(e){}}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=fillVoices;
function chunks(s,from){const o=[];if(from<=-1)o.push([s.k+'. '+s.t,-1]);s.b.forEach((b,i)=>{if(b[0]==='img'||i<from)return;(b[1].match(/[^.!?]+[.!?”"’)]*\s*|.+$/g)||[]).forEach(x=>{if(x.trim())o.push([x.trim(),i])})});return o}
function updateListenUI(){$('bListen').textContent=SP===0?T('Listen'):SP===1?T('Pause'):T('Resume');$('bStop').hidden=SP===0}
function clr(){document.querySelectorAll('.rd').forEach(e=>e.classList.remove('rd'))}
function stopSpeak(){TK++;try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}SP=0;CURB=-2;clr();updateListenUI()}
function startSpeak(from){
  if(kind!=='read')return;stopSpeak();const t=TK,s=by[cur.sid];
  const f=from==null?Math.max(-1,firstBlockOn(cur.idx)):from,cs=chunks(s,f);if(!cs.length)return;SP=1;let last=-9;
  cs.forEach(([x,bi],k)=>{const u=new SpeechSynthesisUtterance(x);u.lang=LOC();const v=pickV();if(v){u.voice=v;u.lang=v.lang}u.rate=RT;
    u.onstart=()=>{if(t!==TK||bi===last)return;last=bi;CURB=bi;clr();const el=$('cols').querySelector('[data-b="'+bi+'"]');if(el)el.classList.add('rd');
      const p=pageOfBlock(bi);if(!turning&&kind==='read'&&p!==cur.idx){const l=leafFor(cur.idx);setIdx(p);flip(l,'f')}};
    if(k===cs.length-1)u.onend=()=>{if(t===TK)stopSpeak()};speechSynthesis.speak(u)});
  updateListenUI();
}
function restartSpeak(){if(SP!==0)startSpeak(CURB>-2?CURB:null)}
$('bListen').onclick=()=>{if(SP===0)startSpeak();else if(SP===1){speechSynthesis.pause();SP=2;updateListenUI()}else{speechSynthesis.resume();SP=1;updateListenUI()}};
$('bStop').onclick=stopSpeak;

/* ---------- start ---------- */
applyStatic();syncUI();if(GRP)startBeat();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
route();
</script>
